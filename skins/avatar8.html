<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Talking Avatar - Alien</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background-color: #06020c;
    color: #d8a8ff;
    font-family: 'Courier New', Courier, monospace;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    /* Nebulosa cosmica */
    background-image:
      radial-gradient(circle at 20% 30%, rgba(120,60,200,0.15) 0%, transparent 50%),
      radial-gradient(circle at 80% 70%, rgba(200,140,60,0.10) 0%, transparent 50%),
      radial-gradient(circle at 50% 50%, rgba(80,40,150,0.12) 0%, transparent 60%);
    cursor: pointer;
    position: relative;
  }
  /* Vignette */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(2,0,6,0.9) 100%);
    pointer-events: none;
    z-index: 9998;
  }
  /* Grana cosmica sottile */
  .crt-overlay {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    background-image:
      url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='2' /%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.3'/%3E%3C/svg%3E");
    opacity: 0.06;
    pointer-events: none; z-index: 9999;
    animation: grainShift 0.8s steps(2) infinite;
    mix-blend-mode: overlay;
  }
  @keyframes grainShift {
    0% { transform: translate(0, 0); }
    50% { transform: translate(-2%, 1%); }
    100% { transform: translate(1%, -1%); }
  }

  .avatar-container {
    position: relative; width: 580px; height: 620px;
    display: flex; justify-content: center; align-items: center;
    flex-shrink: 0;
    pointer-events: none;
    z-index: 1;
  }
  canvas { display: block; }

  .status {
    position: fixed;
    bottom: 55px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    color: #d8a8ff;
    text-transform: uppercase;
    letter-spacing: 6px;
    text-align: center;
    pointer-events: none;
    animation: breathe 3.5s ease-in-out infinite;
    z-index: 10;
    font-weight: 300;
    text-shadow:
      0 0 12px rgba(180,120,255,0.7),
      0 0 4px rgba(255,220,140,0.5);
  }
  @keyframes breathe {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 0.95; }
  }
  .status.speaking { animation: none; opacity: 1; color: #ffdcaa; }
  .status.done { animation: none; opacity: 0.4; }
</style>
</head>
<body>
<div class="crt-overlay"></div>

<div class="avatar-container" id="avatarContainer">
  <canvas id="avatarCanvas" width="580" height="620"></canvas>
</div>

<div class="status" id="status">clicca o premi un tasto</div>

<script>
// ============================================================
// TESTO DA PRONUNCIARE
// ============================================================
const TESTO = "Ciao e benvenuto! Questo è un testo di prova per il mio avatar. Purtroppo a volte ci sono piccoli problemi, ma nessun errore grave. Attenzione però: il testo verrà letto utilizzando la sintesi vocale del browser. Wow, incredibile, vediamo se tutto funziona correttamente. Grazie e arrivederci!";

// ============================================================
// PALETTE ALIENA
// ============================================================
const PURPLE_DEEP = '#2a0a4a';
const PURPLE_MID = '#6a30aa';
const PURPLE_LIGHT = '#b87aff';
const PURPLE_GLOW = 'rgba(184,122,255,0.9)';
const PURPLE_GLOW_SOFT = 'rgba(184,122,255,0.3)';
const GOLD_DEEP = '#8a5a10';
const GOLD_MID = '#d8a020';
const GOLD_LIGHT = '#ffd860';
const GOLD_GLOW = 'rgba(255,216,96,0.9)';
const CYAN_COSMIC = '#66ddff';
const CYAN_GLOW = 'rgba(102,221,255,0.8)';
const VOID_BLACK = '#06020c';

// ============================================================
// CONFIGURAZIONE AUDIO
// ============================================================
const AUDIO_CONFIG = {
  ambientVolume: 0.030,
  syllableVolume: 0.09,
  startBeepVolume: 0.13,
  endBeepVolume: 0.13,
  enabled: true
};

// ============================================================
// DOM
// ============================================================
const canvas = document.getElementById('avatarCanvas');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');
const container = document.getElementById('avatarContainer');

// ============================================================
// STATO
// ============================================================
let isSpeaking = false;
let mouthOpen = 0;
let targetMouthOpen = 0;
let time = 0;

// Blink (palpebre verticali che si chiudono)
let eyeBlink = 0;
let blinkTimer = 0;
let nextBlinkAt = 180 + Math.random() * 250;
let doubleBlink = false;
let doubleBlinkDelay = 0;

// Sbadiglio (apertura energetica)
let yawnTimer = 0;
let yawnCooldown = 900 + Math.random() * 900;
let yawnActive = 0;
let yawnPhase = 0;

// Micro-smorfie bocca (simboli che si spostano)
let mouthTwitchTimer = 0;
let mouthTwitchNextAt = 140 + Math.random() * 200;
let mouthTwitchActive = 0;
let mouthTwitchPhase = 0;
let mouthTwitchDir = 1;

// Micro-movimenti sopracciglia (archi di luce)
let browTwitchTimer = 0;
let browTwitchNextAt = 120 + Math.random() * 220;
let browTwitchActive = 0;
let browTwitchPhase = 0;
let browTwitchAmount = 0;

// Micro-drift capo
let headDriftTimer = 0;
let headDriftNextAt = 110 + Math.random() * 180;
let headDriftTarget = 0;
let headDriftCurrent = 0;

// Dilatazione pozzo oculare
let pupilScale = 1;
let pupilScaleTarget = 1;
let pupilTimer = 0;
let pupilNextAt = 200 + Math.random() * 260;

// Wander
let wanderActive = false;
let wanderTimer = 0;
let wanderNextAt = 140 + Math.random() * 200;
let wanderTargetX = 0;
let wanderTargetY = 0;
let wanderReturnTimer = 0;

// Saccadi
let saccadeTimer = 0;
let saccadeNextAt = 20 + Math.random() * 30;
let saccadeX = 0, saccadeY = 0;
let saccadeTargetX = 0, saccadeTargetY = 0;

// Riflessione (meditazione cosmica)
let reflectionTimer = 0;
let reflectionNextAt = 1800 + Math.random() * 1800;
let reflectionActive = 0;
let reflectionPhase = 0;
let reflectionTotalFrames = 240;

// Respirazione (movimento cosmico lento)
let breathPhaseA = 0;
let breathPhaseB = 0;
let breathPhaseC = 0;
let breathCycleTimer = 0;
let breathCycleDuration = 240 + Math.random() * 150;
let currentBreathOffset = 0;

// === SPECIFICO ALIENO ===
// Terzo occhio che pulsa
let thirdEyePhase = 0;
let thirdEyeBrightness = 1;

// Glifi alieni rotanti attorno alla testa
let glyphs = [];
for (let i = 0; i < 8; i++) {
  glyphs.push({
    angle: (i / 8) * Math.PI * 2,
    radius: 175 + Math.random() * 30,
    speed: 0.003 + Math.random() * 0.004,
    symbol: Math.floor(Math.random() * 6),  // 6 simboli diversi
    alpha: 0.3 + Math.random() * 0.4,
    size: 12 + Math.random() * 8
  });
}

// Tentacoli/antenne laterali
let tentaclePhase = 0;

// Orbite dei pianeti (particelle che orbitano)
let orbits = [];
for (let i = 0; i < 5; i++) {
  orbits.push({
    angle: Math.random() * Math.PI * 2,
    radius: 220 + i * 35,
    speed: 0.002 + i * 0.001,
    color: i % 2 === 0 ? PURPLE_LIGHT : GOLD_LIGHT,
    size: 3 + Math.random() * 3,
    tilt: Math.random() * 0.3
  });
}

// Stelle cosmiche di sfondo
let stars = [];
for (let i = 0; i < 60; i++) {
  stars.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    size: Math.random() * 1.5 + 0.3,
    brightness: Math.random() * 0.6 + 0.2,
    twinkleSpeed: 0.01 + Math.random() * 0.03,
    twinklePhase: Math.random() * Math.PI * 2
  });
}

// Sguardo
let eyeTargetX = 0, eyeTargetY = 0;
let eyeCurrentX = 0, eyeCurrentY = 0;
let mouseIsActive = false;
let mouseMovedTimer = 0;

// Emozione (cambia il colore dell'aura)
let currentEmotion = { browAngle: 0, browHeight: 0, mouthCurve: 0, eyeOpen: 1, mouthWidth: 80, headTilt: 0 };
let targetEmotion = { ...currentEmotion };

// Aura cosmica
let auraColor = PURPLE_LIGHT;
let auraGlow = PURPLE_GLOW;
let auraColorTarget = PURPLE_LIGHT;

const EMOTION_KEYWORDS = {
  felice: ['ciao','benvenuto','grazie','felice','bene','ottimo','grande','bello','amore','contento','evviva','bravo','sorriso','piacere'],
  triste: ['purtroppo','triste','male','problema','difficile','brutto','dispiace','sofferenza','dolore','solo','perdere'],
  arrabbiato: ['attenzione','pericolo','errore','grave','rabbia','basta','no','mai','inaccettabile','sbagliato'],
  sorpreso: ['wow','incredibile','davvero','improvviso','inaspettato','sorpresa','caspita','accidenti','oh']
};
let activeEmotion = 'neutro';

// ============================================================
// WEB AUDIO
// ============================================================
let audioCtx = null;
let ambientOsc = null;
let ambientOsc2 = null;
let ambientGain = null;
let ambientFilter = null;

function initAudioContext() {
  if (audioCtx) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  } catch (e) { console.warn('Web Audio non disponibile', e); }
}

function startAmbient() {
  if (!audioCtx || !AUDIO_CONFIG.enabled) return;
  if (ambientOsc) return;

  // Drone principale (tono molto basso, cosmico)
  ambientOsc = audioCtx.createOscillator();
  ambientOsc.type = 'sine';
  ambientOsc.frequency.value = 55;

  // Secondo tono armonico (quinta sopra)
  ambientOsc2 = audioCtx.createOscillator();
  ambientOsc2.type = 'sine';
  ambientOsc2.frequency.value = 82.5;

  ambientGain = audioCtx.createGain();
  ambientGain.gain.value = 0;
  ambientGain.gain.linearRampToValueAtTime(AUDIO_CONFIG.ambientVolume, audioCtx.currentTime + 0.8);

  ambientFilter = audioCtx.createBiquadFilter();
  ambientFilter.type = 'lowpass';
  ambientFilter.frequency.value = 200;

  ambientOsc.connect(ambientFilter);
  ambientOsc2.connect(ambientFilter);
  ambientFilter.connect(ambientGain);
  ambientGain.connect(audioCtx.destination);
  ambientOsc.start();
  ambientOsc2.start();
}

function stopAmbient() {
  if (!ambientOsc) return;
  const now = audioCtx.currentTime;
  ambientGain.gain.cancelScheduledValues(now);
  ambientGain.gain.linearRampToValueAtTime(0, now + 0.5);
  const osc1 = ambientOsc;
  const osc2 = ambientOsc2;
  const gain = ambientGain;
  ambientOsc = null;
  ambientOsc2 = null;
  ambientGain = null;
  ambientFilter = null;
  setTimeout(() => {
    try { osc1.stop(); } catch(e){}
    try { osc2.stop(); } catch(e){}
    try { osc1.disconnect(); } catch(e){}
    try { osc2.disconnect(); } catch(e){}
    try { gain.disconnect(); } catch(e){}
  }, 600);
}

function playBeep(freq, duration, volume, type) {
  if (!audioCtx || !AUDIO_CONFIG.enabled) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type || 'sine';
  osc.frequency.value = freq;
  gain.gain.value = 0;
  gain.gain.linearRampToValueAtTime(volume, audioCtx.currentTime + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration + 0.1);
}

function playSyllableBeep(syllable) {
  if (!audioCtx || !AUDIO_CONFIG.enabled) return;
  // Toni "campana" con inviluppo più lungo
  let freq = 440;
  if (syllable.includes('a')) freq = 440;
  else if (syllable.includes('o')) freq = 349;
  else if (syllable.includes('e')) freq = 523;
  else if (syllable.includes('u')) freq = 294;
  else if (syllable.includes('i')) freq = 587;
  else freq = 262;
  freq += (Math.random() - 0.5) * 20;

  // Suono più lungo e riverberato
  const osc = audioCtx.createOscillator();
  const osc2 = audioCtx.createOscillator();  // armonica
  const gain = audioCtx.createGain();

  osc.type = 'sine';
  osc.frequency.value = freq;
  osc2.type = 'sine';
  osc2.frequency.value = freq * 1.5;   // quinta sopra

  const vol = AUDIO_CONFIG.syllableVolume;
  gain.gain.value = 0;
  gain.gain.linearRampToValueAtTime(vol, audioCtx.currentTime + 0.03);
  gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.35);

  osc.connect(gain);
  osc2.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start();
  osc2.start();
  osc.stop(audioCtx.currentTime + 0.4);
  osc2.stop(audioCtx.currentTime + 0.4);
}

function playStartBeep() {
  if (!audioCtx || !AUDIO_CONFIG.enabled) return;
  playBeep(220, 0.5, AUDIO_CONFIG.startBeepVolume, 'sine');
  setTimeout(() => playBeep(330, 0.6, AUDIO_CONFIG.startBeepVolume, 'sine'), 150);
  setTimeout(() => playBeep(440, 0.8, AUDIO_CONFIG.startBeepVolume, 'sine'), 350);
}

function playEndBeep() {
  if (!audioCtx || !AUDIO_CONFIG.enabled) return;
  playBeep(440, 0.5, AUDIO_CONFIG.endBeepVolume, 'sine');
  setTimeout(() => playBeep(330, 0.6, AUDIO_CONFIG.endBeepVolume, 'sine'), 200);
  setTimeout(() => playBeep(220, 0.9, AUDIO_CONFIG.endBeepVolume, 'sine'), 450);
}

// ============================================================
// PARTICELLE (cosmiche, fluttuanti)
// ============================================================
let particles = [];
class Particle {
  constructor() { this.reset(); this.y = Math.random() * canvas.height; }
  reset() {
    this.x = Math.random() * canvas.width;
    this.y = Math.random() * canvas.height;   // appaiono ovunque
    this.sizeBase = Math.random() * 2 + 0.5;
    this.size = this.sizeBase;
    this.alphaBase = Math.random() * 0.5 + 0.15;
    this.alpha = this.alphaBase;
    this.vx = (Math.random() - 0.5) * 0.3;
    this.vy = -Math.random() * 0.2 - 0.05;
    this.wobble = Math.random() * Math.PI * 2;
    this.wobbleSpeed = Math.random() * 0.02 + 0.005;
    this.life = 0;
    this.maxLife = 400 + Math.random() * 400;
    this.color = Math.random() < 0.6 ? PURPLE_LIGHT : (Math.random() < 0.5 ? GOLD_LIGHT : CYAN_COSMIC);
  }
  update(intensity) {
    this.life++;
    this.wobble += this.wobbleSpeed;
    this.x += this.vx + Math.sin(this.wobble) * 0.2;
    this.y += this.vy - intensity * 0.3;

    // Fade in/out
    if (this.life < 60) this.alpha = this.alphaBase * (this.life / 60);
    else if (this.life > this.maxLife - 60) this.alpha = this.alphaBase * ((this.maxLife - this.life) / 60);

    // Se esce dal canvas o è morta, respawn
    if (this.y < -20 || this.y > canvas.height + 20 || this.x < -20 || this.x > canvas.width + 20 || this.life > this.maxLife) {
      this.reset();
    }
  }
  draw() {
    ctx.save();
    ctx.globalAlpha = this.alpha;
    ctx.fillStyle = this.color;
    ctx.shadowBlur = 10;
    ctx.shadowColor = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}
for (let i = 0; i < 45; i++) particles.push(new Particle());

// ============================================================
// SILLABE
// ============================================================
function getSyllables(text) {
  const words = text.toLowerCase().match(/[a-zàèéìòù]+/g) || [];
  const result = [];
  const vowels = 'aeiouàèéìòù';
  for (const word of words) {
    let currentSyl = '';
    for (let i = 0; i < word.length; i++) {
      currentSyl += word[i];
      const isVowel = vowels.includes(word[i]);
      const nextIsVowel = i + 1 < word.length && vowels.includes(word[i + 1]);
      if (isVowel && !nextIsVowel) { result.push(currentSyl); currentSyl = ''; }
    }
    if (currentSyl) result.push(currentSyl);
  }
  return result;
}

function extractWords(text) {
  const words = [];
  const regex = /[a-zA-ZàèéìòùÀÈÉÌÒÙ]+/g;
  let m;
  while ((m = regex.exec(text)) !== null) {
    words.push({ word: m[0].toLowerCase(), index: m.index });
  }
  return words;
}

// ============================================================
// VOCI
// ============================================================
let selectedVoice = null;
function pickItalianVoice() {
  const voices = speechSynthesis.getVoices();
  if (!voices.length) return null;
  let v = voices.find(v => v.lang === 'it-IT');
  if (!v) v = voices.find(v => v.lang && v.lang.startsWith('it'));
  if (!v) v = voices.find(v => v.lang && v.lang.startsWith('en'));
  return v || voices[0];
}
function loadVoices() {
  const v = pickItalianVoice();
  if (v) { selectedVoice = v; console.log('[Avatar] Voce:', v.name, v.lang); }
}
if ('speechSynthesis' in window) {
  speechSynthesis.onvoiceschanged = loadVoices;
  loadVoices();
}

// ============================================================
// EMOZIONI
// ============================================================
function detectEmotionForWord(word) {
  for (const [emotion, keywords] of Object.entries(EMOTION_KEYWORDS)) {
    if (keywords.includes(word)) return emotion;
  }
  return null;
}
function emotionParams(emotion) {
  switch (emotion) {
    case 'felice':    return { browAngle: 0.4, browHeight: -5, mouthCurve: 0.7, eyeOpen: 1.05, mouthWidth: 85, headTilt: 0.02 };
    case 'triste':    return { browAngle: -0.6, browHeight: 7, mouthCurve: -0.9, eyeOpen: 0.7, mouthWidth: 70, headTilt: -0.04 };
    case 'arrabbiato':return { browAngle: -1.1, browHeight: 5, mouthCurve: -0.5, eyeOpen: 0.75, mouthWidth: 80, headTilt: 0 };
    case 'sorpreso':  return { browAngle: 0.7, browHeight: -13, mouthCurve: 0, eyeOpen: 1.5, mouthWidth: 75, headTilt: 0 };
    default:          return { browAngle: 0, browHeight: 0, mouthCurve: 0, eyeOpen: 1, mouthWidth: 80, headTilt: 0 };
  }
}

function updateAuraColor(emotion) {
  switch (emotion) {
    case 'felice':
      auraColorTarget = GOLD_LIGHT;
      break;
    case 'triste':
      auraColorTarget = CYAN_COSMIC;
      break;
    case 'arrabbiato':
      auraColorTarget = '#ff4444';
      break;
    case 'sorpreso':
      auraColorTarget = '#ff88ff';
      break;
    default:
      auraColorTarget = PURPLE_LIGHT;
  }
}

let wordsInText = [];
let wordCursor = 0;
let emotionHoldFrames = 0;

function processNextWord() {
  if (wordCursor >= wordsInText.length) return;
  const w = wordsInText[wordCursor];
  const detected = detectEmotionForWord(w.word);
  if (detected) {
    activeEmotion = detected;
    emotionHoldFrames = 90;
    updateAuraColor(detected);
  }
  wordCursor++;
}

// ============================================================
// BOCCA (apertura energetica)
// ============================================================
let syllables = [];
let currentSyllableIndex = 0;
let syllableTimer = 0;
let framesPerSyllable = 8;
let lastBeepedSyllable = -1;

function updateMouthAnimation() {
  if (!isSpeaking) {
    targetMouthOpen = 0.02 + Math.abs(Math.sin(time * 0.5)) * 0.03;
    return;
  }
  syllableTimer++;
  if (syllableTimer >= framesPerSyllable) {
    syllableTimer = 0;
    currentSyllableIndex++;
    if (currentSyllableIndex >= syllables.length) currentSyllableIndex = 0;
    if (currentSyllableIndex !== lastBeepedSyllable) {
      lastBeepedSyllable = currentSyllableIndex;
      playSyllableBeep(syllables[currentSyllableIndex] || '');
    }
    const syl = syllables[currentSyllableIndex] || '';
    framesPerSyllable = 7 + Math.random() * 4 + Math.min(4, syl.length);
  }
  const syl = syllables[currentSyllableIndex] || '';
  let openness = 0.4;
  if (syl.includes('a')) openness = 0.9;
  else if (syl.includes('o')) openness = 0.8;
  else if (syl.includes('e')) openness = 0.65;
  else if (syl.includes('u')) openness = 0.6;
  else if (syl.includes('i')) openness = 0.5;
  else openness = 0.3;
  openness += (Math.random() - 0.5) * 0.12;
  targetMouthOpen = Math.max(0.05, Math.min(1, openness));
}

// ============================================================
// ANIMAZIONI
// ============================================================
function lerp(a, b, t) { return a + (b - a) * t; }

function updateEmotionAnimation() {
  if (emotionHoldFrames > 0) {
    emotionHoldFrames--;
    if (emotionHoldFrames === 0) {
      activeEmotion = 'neutro';
      updateAuraColor('neutro');
    }
  }
  const params = emotionParams(activeEmotion);
  Object.keys(params).forEach(k => targetEmotion[k] = params[k]);
  Object.keys(currentEmotion).forEach(k => {
    currentEmotion[k] = lerp(currentEmotion[k], targetEmotion[k], 0.08);
  });
  // Interpola il colore dell'aura
  auraColor = lerpColor(auraColor, auraColorTarget, 0.05);
  auraGlow = auraColor.replace(')', ', 0.9)').replace('rgb(', 'rgba(');
}

function updateBreath() {
  breathPhaseA += 0.014;   // più lento
  breathPhaseB += 0.028;
  breathPhaseC += 0.006;
  currentBreathOffset = Math.sin(breathPhaseA) * 3 + Math.sin(breathPhaseB) * 1 + Math.sin(breathPhaseC) * 1.5;
  breathCycleTimer++;
  if (breathCycleTimer > breathCycleDuration) {
    breathCycleTimer = 0;
    breathCycleDuration = 240 + Math.random() * 150;
  }
}
function getBreathOffset() { return currentBreathOffset; }

function updateBlink() {
  blinkTimer++;
  if (doubleBlink) {
    doubleBlinkDelay++;
    if (doubleBlinkDelay > 20 && doubleBlinkDelay < 28) eyeBlink = 1;
    else if (doubleBlinkDelay >= 28 && doubleBlinkDelay < 36) eyeBlink = 0;
    else if (doubleBlinkDelay >= 36 && doubleBlinkDelay < 44) eyeBlink = 1;
    else if (doubleBlinkDelay >= 44) {
      eyeBlink = 0; doubleBlink = false; doubleBlinkDelay = 0;
      nextBlinkAt = blinkTimer + 180 + Math.random() * 250;
    }
    return;
  }
  if (blinkTimer >= nextBlinkAt) {
    const t = blinkTimer - nextBlinkAt;
    // Blink più lento ed elegante
    if (t < 5) eyeBlink = t / 5;
    else if (t < 10) eyeBlink = 1;
    else if (t < 16) eyeBlink = 1 - (t - 10) / 6;
    else {
      eyeBlink = 0;
      if (Math.random() < 0.15) { doubleBlink = true; doubleBlinkDelay = 0; }
      else nextBlinkAt = blinkTimer + 180 + Math.random() * 250;
    }
  }
}

function updateYawn() {
  if (isSpeaking) { yawnActive = 0; return; }
  yawnTimer++;
  if (yawnTimer > yawnCooldown && yawnActive === 0) { yawnActive = 0.01; yawnPhase = 0; }
  if (yawnActive > 0) {
    yawnPhase++;
    const totalFrames = 200;   // più lungo
    if (yawnPhase < 60) yawnActive = yawnPhase / 60;
    else if (yawnPhase < 130) yawnActive = 1;
    else if (yawnPhase < totalFrames) yawnActive = 1 - (yawnPhase - 130) / 70;
    else { yawnActive = 0; yawnTimer = 0; yawnCooldown = 900 + Math.random() * 900; }
  }
}

function updateMouthTwitch() {
  if (isSpeaking) {
    mouthTwitchActive = lerp(mouthTwitchActive, 0, 0.15);
    mouthTwitchTimer = 0;
    return;
  }
  mouthTwitchTimer++;
  if (mouthTwitchTimer > mouthTwitchNextAt && mouthTwitchActive < 0.01) {
    mouthTwitchActive = 0.01;
    mouthTwitchPhase = 0;
    mouthTwitchDir = Math.random() < 0.5 ? 1 : -1;
  }
  if (mouthTwitchActive > 0) {
    mouthTwitchPhase++;
    const totalFrames = 60 + Math.random() * 25;
    if (mouthTwitchPhase < totalFrames * 0.35) {
      mouthTwitchActive = mouthTwitchPhase / (totalFrames * 0.35);
    } else if (mouthTwitchPhase < totalFrames * 0.65) {
      mouthTwitchActive = 1;
    } else if (mouthTwitchPhase < totalFrames) {
      mouthTwitchActive = 1 - (mouthTwitchPhase - totalFrames * 0.65) / (totalFrames * 0.35);
    } else {
      mouthTwitchActive = 0;
      mouthTwitchTimer = 0;
      mouthTwitchNextAt = 180 + Math.random() * 300;
    }
  }
}

function updateBrowTwitch() {
  if (isSpeaking) {
    browTwitchActive = lerp(browTwitchActive, 0, 0.15);
    browTwitchAmount = lerp(browTwitchAmount, 0, 0.1);
    return;
  }
  browTwitchTimer++;
  if (browTwitchTimer > browTwitchNextAt && browTwitchActive < 0.01) {
    browTwitchActive = 0.01;
    browTwitchPhase = 0;
  }
  if (browTwitchActive > 0) {
    browTwitchPhase++;
    const totalFrames = 50 + Math.random() * 30;
    if (browTwitchPhase < totalFrames * 0.4) {
      browTwitchActive = browTwitchPhase / (totalFrames * 0.4);
    } else if (browTwitchPhase < totalFrames * 0.6) {
      browTwitchActive = 1;
    } else if (browTwitchPhase < totalFrames) {
      browTwitchActive = 1 - (browTwitchPhase - totalFrames * 0.6) / (totalFrames * 0.4);
    } else {
      browTwitchActive = 0;
      browTwitchTimer = 0;
      browTwitchNextAt = 150 + Math.random() * 250;
    }
  }
  const targetAmount = browTwitchActive * (2 + Math.random() * 2);
  browTwitchAmount = lerp(browTwitchAmount, targetAmount, 0.15);
}

function updateHeadDrift() {
  if (isSpeaking) {
    headDriftTarget = 0;
    headDriftCurrent = lerp(headDriftCurrent, 0, 0.06);
    return;
  }
  headDriftTimer++;
  if (headDriftTimer > headDriftNextAt) {
    headDriftTarget = (Math.random() - 0.5) * 0.05;
    headDriftTimer = 0;
    headDriftNextAt = 140 + Math.random() * 200;
  }
  headDriftCurrent = lerp(headDriftCurrent, headDriftTarget, 0.015);
}

function updatePupilDilation() {
  pupilTimer++;
  if (pupilTimer > pupilNextAt) {
    pupilScaleTarget = 0.85 + Math.random() * 0.35;
    pupilTimer = 0;
    pupilNextAt = 180 + Math.random() * 260;
  }
  pupilScale = lerp(pupilScale, pupilScaleTarget, 0.015);
}

function updateWander() {
  if (isSpeaking) { wanderActive = false; return; }
  if (mouseIsActive) { wanderActive = false; return; }
  wanderTimer++;
  if (wanderTimer > wanderNextAt) {
    wanderTargetX = (Math.random() - 0.5) * 10;
    wanderTargetY = (Math.random() - 0.5) * 6;
    wanderTimer = 0;
    wanderNextAt = 110 + Math.random() * 200;
    wanderActive = true;
    wanderReturnTimer = 0;
  }
  if (wanderActive) {
    wanderReturnTimer++;
    if (wanderReturnTimer > 150) {
      wanderTargetX = 0; wanderTargetY = 0;
      wanderActive = false;
    }
  }
}

function updateSaccades() {
  if (isSpeaking) {
    saccadeX = lerp(saccadeX, 0, 0.2);
    saccadeY = lerp(saccadeY, 0, 0.2);
    return;
  }
  saccadeTimer++;
  if (saccadeTimer > saccadeNextAt) {
    saccadeTargetX = (Math.random() - 0.5) * 2;
    saccadeTargetY = (Math.random() - 0.5) * 1.5;
    saccadeTimer = 0;
    saccadeNextAt = 20 + Math.random() * 30;
  }
  saccadeX = lerp(saccadeX, saccadeTargetX, 0.3);
  saccadeY = lerp(saccadeY, saccadeTargetY, 0.3);
}

function updateReflection() {
  if (isSpeaking) { reflectionActive = 0; reflectionTimer = 0; return; }
  reflectionTimer++;
  if (reflectionTimer > reflectionNextAt && reflectionActive === 0) {
    reflectionActive = 0.01;
    reflectionPhase = 0;
  }
  if (reflectionActive > 0) {
    reflectionPhase++;
    const totalFrames = reflectionTotalFrames;
    if (reflectionPhase < totalFrames * 0.25) {
      reflectionActive = reflectionPhase / (totalFrames * 0.25);
    } else if (reflectionPhase < totalFrames * 0.7) {
      reflectionActive = 1;
    } else if (reflectionPhase < totalFrames) {
      reflectionActive = 1 - (reflectionPhase - totalFrames * 0.7) / (totalFrames * 0.3);
    } else {
      reflectionActive = 0;
      reflectionTimer = 0;
      reflectionNextAt = 1800 + Math.random() * 1800;
    }
  }
}

document.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  const ccx = rect.left + rect.width / 2;
  const ccy = rect.top + rect.height / 2;
  const dx = e.clientX - ccx, dy = e.clientY - ccy;
  const dist = Math.sqrt(dx*dx + dy*dy);
  const maxOffset = 6;
  if (dist > 0) {
    const factor = Math.min(1, dist / 400);
    eyeTargetX = (dx / dist) * maxOffset * factor;
    eyeTargetY = (dy / dist) * maxOffset * factor;
  }
  mouseIsActive = true;
  mouseMovedTimer = 0;
});

function updateGaze() {
  mouseMovedTimer++;
  if (mouseMovedTimer > 220) mouseIsActive = false;
  if (isSpeaking) {
    eyeTargetX = Math.sin(time * 0.4) * 1.5;
    eyeTargetY = Math.sin(time * 0.6) * 1.0;
  } else if (mouseIsActive) {
    // già aggiornato
  } else if (wanderActive) {
    eyeTargetX = wanderTargetX;
    eyeTargetY = wanderTargetY;
  } else {
    eyeTargetX = lerp(eyeTargetX, 0, 0.03);
    eyeTargetY = lerp(eyeTargetY, 0, 0.03);
  }
  eyeCurrentX = lerp(eyeCurrentX, eyeTargetX, 0.06);
  eyeCurrentY = lerp(eyeCurrentY, eyeTargetY, 0.06);
}

// === SPECIFICO ALIENO ===
function updateGlyphs() {
  glyphs.forEach(g => {
    g.angle += g.speed;
  });
}

function updateOrbits() {
  orbits.forEach(o => {
    o.angle += o.speed;
  });
}

function updateStars() {
  stars.forEach(s => {
    s.twinklePhase += s.twinkleSpeed;
  });
}

function updateThirdEye() {
  thirdEyePhase += 0.04;
  thirdEyeBrightness = 0.7 + Math.sin(thirdEyePhase) * 0.3;
}

function updateTentacles() {
  tentaclePhase += 0.02;
}

function lerpColor(a, b, t) {
  const pa = hexToRgb(a);
  const pb = hexToRgb(b);
  if (!pa || !pb) return a;
  return `rgb(${Math.round(lerp(pa.r, pb.r, t))},${Math.round(lerp(pa.g, pb.g, t))},${Math.round(lerp(pa.b, pb.b, t))})`;
}

function hexToRgb(hex) {
  if (hex.startsWith('rgb')) {
    const m = hex.match(/\d+/g);
    return { r: +m[0], g: +m[1], b: +m[2] };
  }
  return {
    r: parseInt(hex.slice(1, 3), 16),
    g: parseInt(hex.slice(3, 5), 16),
    b: parseInt(hex.slice(5, 7), 16)
  };
}

// ============================================================
// DISEGNO
// ============================================================
function drawAvatar() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  time += 0.02;

  updateMouthAnimation();
  updateEmotionAnimation();
  updateBreath();
  updateBlink();
  updateYawn();
  updateMouthTwitch();
  updateBrowTwitch();
  updateHeadDrift();
  updatePupilDilation();
  updateWander();
  updateSaccades();
  updateReflection();
  updateGaze();
  updateGlyphs();
  updateOrbits();
  updateStars();
  updateThirdEye();
  updateTentacles();

  // === STELLE DI SFONDO ===
  drawStars();

  // === PARTICEELLE COSMICHE ===
  const baseIntensity = 0.15;
  const speakIntensity = isSpeaking ? Math.min(1, 0.3 + mouthOpen * 0.7) : 0;
  const intensity = Math.max(baseIntensity, speakIntensity);
  particles.forEach(p => { p.update(intensity); p.draw(); });

  const cx = canvas.width / 2;
  const cy = canvas.height / 2 + getBreathOffset();

  // === ORBITE ===
  drawOrbits(cx, cy);

  // === AURA COSMICA ===
  drawAura(cx, cy);

  // === GLIFI ROTANTI ===
  drawGlyphs(cx, cy);

  // === TESTA ===
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(currentEmotion.headTilt + headDriftCurrent);
  ctx.translate(-cx, -cy);

  // Tentacoli
  drawTentacles(cx, cy);

  // Testa a goccia
  drawHeadAlien(cx, cy);

  // Terzo occhio
  drawThirdEye(cx, cy);

  // Occhi laterali
  const eyeY = cy - 15;
  const eyeOffsetX = 65;
  const reflectionEyeFactor = 1 - reflectionActive * 0.2;
  const eyeRadius = 28 * currentEmotion.eyeOpen * reflectionEyeFactor;

  drawEyeAlien(cx - eyeOffsetX, eyeY, eyeRadius, 1);
  drawEyeAlien(cx + eyeOffsetX, eyeY, eyeRadius, -1);

  // Bocca/simboli
  drawMouthAlien(cx, cy + 80);

  ctx.restore();
}

// === STELLE ===
function drawStars() {
  ctx.save();
  stars.forEach(s => {
    const alpha = s.brightness * (0.5 + Math.sin(s.twinklePhase) * 0.5);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#ffffff';
    ctx.shadowBlur = 6;
    ctx.shadowColor = '#ffffff';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.restore();
}

// === ORBITE ===
function drawOrbits(cx, cy) {
  ctx.save();
  orbits.forEach(o => {
    const x = cx + Math.cos(o.angle) * o.radius;
    const y = cy + Math.sin(o.angle) * o.radius * 0.35;   // ellittiche

    // Traccia dell'orbita (ellisse sottile)
    ctx.strokeStyle = 'rgba(184,122,255,0.08)';
    ctx.lineWidth = 0.5;
    ctx.beginPath();
    ctx.ellipse(cx, cy, o.radius, o.radius * 0.35, 0, 0, Math.PI * 2);
    ctx.stroke();

    // Pianeta/particella
    ctx.fillStyle = o.color;
    ctx.shadowBlur = 15;
    ctx.shadowColor = o.color;
    ctx.beginPath();
    ctx.arc(x, y, o.size, 0, Math.PI * 2);
    ctx.fill();

    // Alone
    ctx.globalAlpha = 0.3;
    ctx.beginPath();
    ctx.arc(x, y, o.size * 2.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  });
  ctx.restore();
}

// === AURA ===
function drawAura(cx, cy) {
  ctx.save();
  const auraIntensity = isSpeaking ? 0.4 + mouthOpen * 0.5 : 0.15;

  const gradient = ctx.createRadialGradient(cx, cy, 80, cx, cy, 280);
  gradient.addColorStop(0, auraColor.replace(')', `, ${auraIntensity * 0.4})`).replace('rgb(', 'rgba('));
  gradient.addColorStop(0.5, auraColor.replace(')', `, ${auraIntensity * 0.15})`).replace('rgb(', 'rgba('));
  gradient.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.restore();
}

// === GLIFI ROTANTI ===
function drawGlyphs(cx, cy) {
  ctx.save();
  glyphs.forEach(g => {
    const x = cx + Math.cos(g.angle) * g.radius;
    const y = cy + Math.sin(g.angle) * g.radius * 0.7;

    ctx.globalAlpha = g.alpha;
    ctx.strokeStyle = GOLD_LIGHT;
    ctx.lineWidth = 1.5;
    ctx.shadowBlur = 12;
    ctx.shadowColor = GOLD_GLOW;

    // Ruota il glifo
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(g.angle * 2);

    // Disegna simbolo
    drawGlyphSymbol(g.symbol, g.size);

    ctx.restore();
  });
  ctx.restore();
}

function drawGlyphSymbol(symbol, size) {
  const s = size;
  ctx.beginPath();
  switch (symbol) {
    case 0: // Triangolo
      ctx.moveTo(0, -s);
      ctx.lineTo(s, s * 0.8);
      ctx.lineTo(-s, s * 0.8);
      ctx.closePath();
      ctx.stroke();
      break;
    case 1: // Rombo
      ctx.moveTo(0, -s);
      ctx.lineTo(s, 0);
      ctx.lineTo(0, s);
      ctx.lineTo(-s, 0);
      ctx.closePath();
      ctx.stroke();
      break;
    case 2: // Cerchio con croce
      ctx.arc(0, 0, s * 0.7, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(-s * 0.7, 0);
      ctx.lineTo(s * 0.7, 0);
      ctx.moveTo(0, -s * 0.7);
      ctx.lineTo(0, s * 0.7);
      ctx.stroke();
      break;
    case 3: // Esagono
      for (let i = 0; i < 6; i++) {
        const angle = (i / 6) * Math.PI * 2 - Math.PI / 2;
        const x = Math.cos(angle) * s * 0.7;
        const y = Math.sin(angle) * s * 0.7;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.stroke();
      break;
    case 4: // Stella 5 punte
      for (let i = 0; i < 10; i++) {
        const radius = i % 2 === 0 ? s : s * 0.5;
        const angle = (i / 10) * Math.PI * 2 - Math.PI / 2;
        const x = Math.cos(angle) * radius;
        const y = Math.sin(angle) * radius;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.stroke();
      break;
    case 5: // Simbolo astratto (linee)
      ctx.moveTo(-s * 0.6, -s * 0.6);
      ctx.lineTo(0, 0);
      ctx.lineTo(s * 0.6, -s * 0.3);
      ctx.moveTo(0, 0);
      ctx.lineTo(0, s * 0.7);
      ctx.moveTo(-s * 0.5, s * 0.5);
      ctx.lineTo(s * 0.5, s * 0.5);
      ctx.stroke();
      break;
  }
}

// === TENTACOLI ===
function drawTentacles(cx, cy) {
  ctx.save();
  ctx.strokeStyle = PURPLE_MID;
  ctx.lineWidth = 2;
  ctx.shadowBlur = 15;
  ctx.shadowColor = PURPLE_GLOW;

  // Tentacoli laterali (3 per lato)
  for (let side = -1; side <= 1; side += 2) {
    for (let i = 0; i < 3; i++) {
      const baseY = cy - 30 + i * 40;
      const baseX = cx + side * 95;
      const sway = Math.sin(tentaclePhase + i) * 8;

      ctx.beginPath();
      ctx.moveTo(baseX, baseY);
      ctx.quadraticCurveTo(
        baseX + side * 40,
        baseY + sway,
        baseX + side * 70,
        baseY + sway * 1.5
      );
      ctx.stroke();

      // Punta con LED
      const tipX = baseX + side * 70;
      const tipY = baseY + sway * 1.5;
      ctx.fillStyle = GOLD_LIGHT;
      ctx.beginPath();
      ctx.arc(tipX, tipY, 3, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.restore();
}

// === TESTA A GOCCIA ===
function drawHeadAlien(cx, cy) {
  ctx.save();

  // Gradiente viola
  const grad = ctx.createRadialGradient(cx - 30, cy - 50, 30, cx, cy, 160);
  grad.addColorStop(0, PURPLE_LIGHT);
  grad.addColorStop(0.4, PURPLE_MID);
  grad.addColorStop(0.85, PURPLE_DEEP);
  grad.addColorStop(1, '#0a0214');

  ctx.fillStyle = grad;
  ctx.strokeStyle = PURPLE_LIGHT;
  ctx.lineWidth = 1.5;
  ctx.shadowBlur = 25;
  ctx.shadowColor = PURPLE_GLOW;

  // Forma a goccia/orb (più alta che larga, appuntita in alto)
  ctx.beginPath();
  ctx.moveTo(cx, cy - 155);                          // cima
  ctx.bezierCurveTo(cx + 70, cy - 155, cx + 110, cy - 60, cx + 105, cy + 20);
  ctx.bezierCurveTo(cx + 100, cy + 80, cx + 60, cy + 130, cx, cy + 145);
  ctx.bezierCurveTo(cx - 60, cy + 130, cx - 100, cy + 80, cx - 105, cy + 20);
  ctx.bezierCurveTo(cx - 110, cy - 60, cx - 70, cy - 155, cx, cy - 155);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // Linee verticali decorative (vene cosmiche)
  ctx.strokeStyle = 'rgba(255,216,96,0.4)';
  ctx.lineWidth = 1;
  ctx.shadowBlur = 8;
  ctx.shadowColor = GOLD_GLOW;
  ctx.beginPath();
  ctx.moveTo(cx, cy - 155);
  ctx.lineTo(cx, cy - 60);
  ctx.stroke();

  // Piccolo punto sulla fronte
  ctx.fillStyle = GOLD_LIGHT;
  ctx.beginPath();
  ctx.arc(cx, cy - 100, 2, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

// === TERZO OCCHIO ===
function drawThirdEye(cx, cy) {
  ctx.save();

  const eyeX = cx;
  const eyeY = cy - 60;
  const eyeW = 22;
  const eyeH = 14;
  const pulse = thirdEyeBrightness;

  // Base dell'occhio (a mandorla verticale)
  ctx.fillStyle = VOID_BLACK;
  ctx.strokeStyle = GOLD_LIGHT;
  ctx.lineWidth = 1.5;
  ctx.shadowBlur = 20 * pulse;
  ctx.shadowColor = GOLD_GLOW;

  ctx.beginPath();
  ctx.moveTo(eyeX - eyeW, eyeY);
  ctx.quadraticCurveTo(eyeX, eyeY - eyeH, eyeX + eyeW, eyeY);
  ctx.quadraticCurveTo(eyeX, eyeY + eyeH, eyeX - eyeW, eyeY);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // Pozzo di luce interno
  const grad = ctx.createRadialGradient(eyeX, eyeY, 0, eyeX, eyeY, eyeW * 0.6);
  grad.addColorStop(0, GOLD_LIGHT);
  grad.addColorStop(0.5, GOLD_MID);
  grad.addColorStop(1, 'rgba(216,160,32,0)');

  ctx.fillStyle = grad;
  ctx.globalAlpha = pulse;
  ctx.beginPath();
  ctx.ellipse(eyeX, eyeY, eyeW * 0.4, eyeH * 0.6, 0, 0, Math.PI * 2);
  ctx.fill();

  // Pupilla verticale
  ctx.globalAlpha = 1;
  ctx.fillStyle = VOID_BLACK;
  ctx.beginPath();
  ctx.ellipse(eyeX, eyeY, 2, eyeH * 0.7, 0, 0, Math.PI * 2);
  ctx.fill();

  // Raggi di luce che emanano
  ctx.strokeStyle = GOLD_LIGHT;
  ctx.globalAlpha = pulse * 0.4;
  ctx.lineWidth = 1;
  for (let i = 0; i < 6; i++) {
    const angle = (i / 6) * Math.PI * 2 + time;
    ctx.beginPath();
    ctx.moveTo(eyeX + Math.cos(angle) * 16, eyeY + Math.sin(angle) * 16);
    ctx.lineTo(eyeX + Math.cos(angle) * 24, eyeY + Math.sin(angle) * 24);
    ctx.stroke();
  }

  ctx.restore();
}

// === OCCHIO ALIENO ===
function drawEyeAlien(x, y, radius, side) {
  ctx.save();

  const eyeW = radius * 0.6;   // occhi verticali, stretti
  const eyeH = radius * 1.2;

  // Base dell'occhio (a mandorla verticale)
  ctx.fillStyle = VOID_BLACK;
  ctx.strokeStyle = PURPLE_LIGHT;
  ctx.lineWidth = 1.5;
  ctx.shadowBlur = 18;
  ctx.shadowColor = PURPLE_GLOW;

  ctx.beginPath();
  ctx.ellipse(x, y, eyeW, eyeH, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  // Se chiuso (blink), solo linea verticale
  if (eyeBlink > 0.5) {
    ctx.strokeStyle = PURPLE_LIGHT;
    ctx.lineWidth = 2;
    ctx.shadowBlur = 20;
    ctx.beginPath();
    ctx.moveTo(x, y - eyeH * 0.6);
    ctx.lineTo(x, y + eyeH * 0.6);
    ctx.stroke();
  } else {
    // Pozzo di luce con gradiente
    const pupilX = x + eyeCurrentX * 0.5 + saccadeX * 0.5;
    const pupilY = y + eyeCurrentY * 0.5 + saccadeY * 0.5;
    const lightRadius = radius * 0.55 * pupilScale;

    // Gradiente radiale (dal centro verso l'esterno)
    const grad = ctx.createRadialGradient(pupilX, pupilY, 0, pupilX, pupilY, lightRadius);
    grad.addColorStop(0, '#ffffff');
    grad.addColorStop(0.3, GOLD_LIGHT);
    grad.addColorStop(0.7, PURPLE_LIGHT);
    grad.addColorStop(1, 'rgba(184,122,255,0)');

    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(pupilX, pupilY, lightRadius, 0, Math.PI * 2);
    ctx.fill();

    // Alone più ampio
    ctx.globalAlpha = 0.3;
    ctx.beginPath();
    ctx.arc(pupilX, pupilY, lightRadius * 1.6, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;

    // Piccola pupilla nera verticale (a forma di goccia)
    ctx.fillStyle = VOID_BLACK;
    ctx.beginPath();
    ctx.ellipse(pupilX, pupilY, lightRadius * 0.15, lightRadius * 0.5, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  // Overlay blink parziale
  if (eyeBlink > 0 && eyeBlink <= 0.5) {
    ctx.fillStyle = PURPLE_DEEP;
    const lidY = y - eyeH + eyeH * 2 * eyeBlink;
    ctx.beginPath();
    ctx.ellipse(x, y, eyeW * 1.1, eyeH * 1.1, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = PURPLE_LIGHT;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.ellipse(x, y, eyeW * 1.1, eyeH * 1.1, 0, 0, Math.PI * 2);
    ctx.stroke();
  }

  ctx.restore();
}

// === BOCCA ALIENA (simboli geometrici) ===
function drawMouthAlien(x, y) {
  ctx.save();

  const yawnOpen = yawnActive * 0.9;
  const combinedOpen = Math.max(mouthOpen, yawnOpen);
  const mouthWidth = currentEmotion.mouthWidth;
  const maxOpenHeight = 45;
  const openHeight = maxOpenHeight * combinedOpen;

  if (openHeight > 6) {
    // === BOCCA APERTA: portale di luce ===
    const pulse = 0.7 + Math.sin(time * 5) * 0.3;

    // Portale scuro
    ctx.fillStyle = VOID_BLACK;
    ctx.beginPath();
    ctx.ellipse(x, y, mouthWidth / 2, openHeight / 2, 0, 0, Math.PI * 2);
    ctx.fill();

    // Interno luminoso (luce che esce dalla bocca)
    const grad = ctx.createRadialGradient(x, y, 0, x, y, mouthWidth / 2);
    grad.addColorStop(0, GOLD_LIGHT);
    grad.addColorStop(0.5, PURPLE_LIGHT);
    grad.addColorStop(1, 'rgba(184,122,255,0)');
    ctx.globalAlpha = combinedOpen * pulse;
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.ellipse(x, y, mouthWidth / 2 - 2, openHeight / 2 - 2, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;

    // Contorno luminoso
    ctx.strokeStyle = PURPLE_LIGHT;
    ctx.lineWidth = 2;
    ctx.shadowBlur = 20;
    ctx.shadowColor = PURPLE_GLOW;
    ctx.beginPath();
    ctx.ellipse(x, y, mouthWidth / 2, openHeight / 2, 0, 0, Math.PI * 2);
    ctx.stroke();

    // Simboli dentro la bocca quando è molto aperta
    if (combinedOpen > 0.6) {
      ctx.strokeStyle = GOLD_LIGHT;
      ctx.lineWidth = 1;
      ctx.globalAlpha = combinedOpen;
      // Piccolo simbolo centrale
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(time * 2);
      ctx.beginPath();
      ctx.moveTo(0, -6);
      ctx.lineTo(5, 0);
      ctx.lineTo(0, 6);
      ctx.lineTo(-5, 0);
      ctx.closePath();
      ctx.stroke();
      ctx.restore();
    }
  } else {
    // === BOCCA CHIUSA: simboli geometrici che si compongono ===
    const curve = currentEmotion.mouthCurve + (reflectionActive * -0.3);
    const twitchOffset = mouthTwitchActive * mouthTwitchDir * 2;

    // Tre piccoli simboli allineati (come una bocca aliena)
    const spacing = mouthWidth * 0.35;
    const symbolSize = 6;
    const wave = Math.sin(time * 2) * 1.5;

    ctx.strokeStyle = GOLD_LIGHT;
    ctx.lineWidth = 1.5;
    ctx.shadowBlur = 10;
    ctx.shadowColor = GOLD_GLOW;

    // Simbolo centrale (rombo che ruota lentamente)
    ctx.save();
    ctx.translate(x, y + twitchOffset + curve * 3 + wave);
    ctx.rotate(time * 0.8);
    ctx.beginPath();
    ctx.moveTo(0, -symbolSize);
    ctx.lineTo(symbolSize, 0);
    ctx.lineTo(0, symbolSize);
    ctx.lineTo(-symbolSize, 0);
    ctx.closePath();
    ctx.stroke();
    ctx.restore();

    // Simbolo sinistro (triangolo)
    ctx.save();
    ctx.translate(x - spacing, y + twitchOffset + curve * 3 - wave);
    ctx.rotate(-time * 0.6);
    ctx.beginPath();
    ctx.moveTo(0, -symbolSize * 0.8);
    ctx.lineTo(symbolSize * 0.8, symbolSize * 0.6);
    ctx.lineTo(-symbolSize * 0.8, symbolSize * 0.6);
    ctx.closePath();
    ctx.stroke();
    ctx.restore();

    // Simbolo destro (quadrato)
    ctx.save();
    ctx.translate(x + spacing, y + twitchOffset + curve * 3 + wave * 1.2);
    ctx.rotate(time * 0.7);
    ctx.beginPath();
    ctx.rect(-symbolSize * 0.7, -symbolSize * 0.7, symbolSize * 1.4, symbolSize * 1.4);
    ctx.stroke();
    ctx.restore();
  }

  ctx.restore();
}

// ============================================================
// LOOP
// ============================================================
function renderLoop() {
  drawAvatar();
  requestAnimationFrame(renderLoop);
}

// ============================================================
// SINTESI VOCALE + TOGGLE
// ============================================================
let utterance = null;
let fallbackWordInterval = null;

function updateStatus(text, cls) {
  statusEl.innerText = text;
  statusEl.classList.remove('speaking', 'done');
  if (cls) statusEl.classList.add(cls);
}

function speak() {
  if (!('speechSynthesis' in window)) {
    updateStatus('sintesi vocale non supportata');
    return;
  }
  window.speechSynthesis.cancel();
  if (fallbackWordInterval) { clearInterval(fallbackWordInterval); fallbackWordInterval = null; }

  initAudioContext();
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

  syllables = getSyllables(TESTO);
  wordsInText = extractWords(TESTO);
  currentSyllableIndex = 0;
  syllableTimer = 0;
  framesPerSyllable = 8;
  wordCursor = 0;
  activeEmotion = 'neutro';
  emotionHoldFrames = 0;
  lastBeepedSyllable = -1;

  utterance = new SpeechSynthesisUtterance(TESTO);
  utterance.lang = 'it-IT';
  utterance.rate = 0.85;    // lento e solenne
  utterance.pitch = 1.0;    // pitch medio, un po' etereo
  utterance.volume = 1;
  if (selectedVoice) utterance.voice = selectedVoice;

  utterance.onstart = () => {
    isSpeaking = true;
    container.classList.add('speaking');
    updateStatus('clicca per fermare', 'speaking');
    playStartBeep();
    startAmbient();
  };

  utterance.onboundary = (e) => {
    if (e.name === 'word') processNextWord();
  };

  utterance.onend = () => {
    isSpeaking = false;
    targetMouthOpen = 0;
    activeEmotion = 'neutro';
    emotionHoldFrames = 0;
    updateAuraColor('neutro');
    container.classList.remove('speaking');
    updateStatus('fine — clicca per riascoltare', 'done');
    playEndBeep();
    stopAmbient();
    if (fallbackWordInterval) { clearInterval(fallbackWordInterval); fallbackWordInterval = null; }
  };

  utterance.onerror = (e) => {
    console.error(e);
    isSpeaking = false;
    targetMouthOpen = 0;
    activeEmotion = 'neutro';
    emotionHoldFrames = 0;
    updateAuraColor('neutro');
    container.classList.remove('speaking');
    updateStatus('errore — clicca per riprovare', 'done');
    stopAmbient();
    if (fallbackWordInterval) { clearInterval(fallbackWordInterval); fallbackWordInterval = null; }
  };

  fallbackWordInterval = setInterval(() => {
    if (!isSpeaking) { clearInterval(fallbackWordInterval); fallbackWordInterval = null; return; }
    processNextWord();
  }, 400);

  speechSynthesis.speak(utterance);
}

function stopSpeaking() {
  speechSynthesis.cancel();
  if (fallbackWordInterval) { clearInterval(fallbackWordInterval); fallbackWordInterval = null; }
  isSpeaking = false;
  targetMouthOpen = 0;
  activeEmotion = 'neutro';
  emotionHoldFrames = 0;
  updateAuraColor('neutro');
  container.classList.remove('speaking');
  updateStatus('clicca o premi un tasto');
  stopAmbient();
}

function toggleSpeech() {
  if (isSpeaking) stopSpeaking();
  else speak();
}

document.body.addEventListener('click', toggleSpeech);
document.body.addEventListener('touchstart', function(e) {
  e.preventDefault();
  toggleSpeech();
}, { passive: false });

document.addEventListener('keydown', (e) => {
  if (e.key === ' ' || e.key === 'Enter') {
    e.preventDefault();
    toggleSpeech();
  } else if (e.key === 'Escape') {
    if (isSpeaking) stopSpeaking();
  }
});

// ============================================================
// AVVIO
// ============================================================
renderLoop();
</script>
