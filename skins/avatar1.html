<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Talking Avatar - Hologram</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background-color: #020810;
    color: #66ccff;
    font-family: 'Courier New', Courier, monospace;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    background-image:
      radial-gradient(circle at 50% 40%, rgba(102,204,255,0.10) 0%, transparent 65%),
      linear-gradient(rgba(102,204,255,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(102,204,255,0.06) 1px, transparent 1px);
    background-size: 100% 100%, 40px 40px, 40px 40px;
    cursor: pointer;
    position: relative;
  }
  /* Grglia diagonale in background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      repeating-linear-gradient(45deg, rgba(102,204,255,0.02) 0, rgba(102,204,255,0.02) 1px, transparent 1px, transparent 20px),
      repeating-linear-gradient(-45deg, rgba(102,204,255,0.02) 0, rgba(102,204,255,0.02) 1px, transparent 1px, transparent 20px);
    pointer-events: none;
    z-index: 0;
  }
  .crt-overlay {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    background:
      linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.25) 50%),
      linear-gradient(90deg, rgba(0,200,255,0.05), rgba(0,255,255,0.02), rgba(100,200,255,0.05));
    background-size: 100% 4px, 6px 100%;
    pointer-events: none; z-index: 9999;
    animation: flicker 0.15s infinite;
  }
  @keyframes flicker { 0%{opacity:.95} 50%{opacity:.85} 100%{opacity:.95} }

  .avatar-container {
    position: relative; width: 500px; height: 500px;
    display: flex; justify-content: center; align-items: center;
    flex-shrink: 0;
    pointer-events: none;
    z-index: 1;
  }
  canvas { display: block; }

  /* Base del proiettore sotto l'ologramma */
  .projector-base {
    position: fixed;
    bottom: 120px;
    left: 50%;
    transform: translateX(-50%);
    width: 200px;
    height: 8px;
    background: radial-gradient(ellipse at center, rgba(102,204,255,0.9) 0%, rgba(102,204,255,0.3) 40%, transparent 80%);
    border-radius: 50%;
    filter: blur(2px);
    pointer-events: none;
    z-index: 0;
    animation: projectorPulse 3s ease-in-out infinite;
  }
  @keyframes projectorPulse {
    0%, 100% { opacity: 0.7; }
    50% { opacity: 1; }
  }

  .status {
    position: fixed;
    bottom: 60px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 13px; color: #66ccff; text-transform: uppercase;
    letter-spacing: 3px; text-shadow: 0 0 12px #66ccff, 0 0 4px #ffffff;
    text-align: center;
    pointer-events: none;
    animation: breathe 2.5s ease-in-out infinite;
    z-index: 10;
  }
  @keyframes breathe {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }
  .status.speaking { animation: none; opacity: 1; color: #aae6ff; }
  .status.done { animation: none; opacity: 0.45; }
</style>
</head>
<body>
<div class="crt-overlay"></div>
<div class="projector-base"></div>

<div class="avatar-container" id="avatarContainer">
  <canvas id="avatarCanvas" width="500" height="500"></canvas>
</div>

<div class="status" id="status">▶ clicca o premi un tasto per iniziare</div>

<script>
// ============================================================
// TESTO DA PRONUNCIARE — modifica qui
// ============================================================
const TESTO = "Ciao e benvenuto! Questo è un testo di prova per il mio avatar. Purtroppo a volte ci sono piccoli problemi, ma nessun errore grave. Attenzione però: il testo verrà letto utilizzando la sintesi vocale del browser. Wow, incredibile, vediamo se tutto funziona correttamente. Grazie e arrivederci!";

// ============================================================
// PALETTE OLOCRAMA
// ============================================================
const COLOR_MAIN = '#66ccff';       // azzurro olografico
const COLOR_DIM  = '#3a99cc';       // azzurro più scuro
const COLOR_BRIGHT = '#aae6ff';     // azzurro chiaro per dettagli
const COLOR_GLOW = 'rgba(102,204,255,0.9)';
const COLOR_GLOW_SOFT = 'rgba(102,204,255,0.4)';

// Rettangolo olografico (cornice)
const FRAME_W = 340;
const FRAME_H = 380;

// ============================================================
// CONFIGURAZIONE AUDIO
// ============================================================
const AUDIO_CONFIG = {
  ambientVolume: 0.030,
  syllableVolume: 0.09,
  startBeepVolume: 0.14,
  endBeepVolume: 0.14,
  enabled: true
};

// ============================================================
// DOM
// ============================================================
const canvas = document.getElementById('avatarCanvas');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');
const container = document.getElementById('avatarContainer');

// ============================================================
// STATO
// ============================================================
let isSpeaking = false;
let mouthOpen = 0;
let targetMouthOpen = 0;
let time = 0;

// Blink
let eyeBlink = 0;
let blinkTimer = 0;
let nextBlinkAt = 150 + Math.random() * 200;
let doubleBlink = false;
let doubleBlinkDelay = 0;

// Sbadiglio
let yawnTimer = 0;
let yawnCooldown = 800 + Math.random() * 800;
let yawnActive = 0;
let yawnPhase = 0;

// Micro-smorfie bocca
let mouthTwitchTimer = 0;
let mouthTwitchNextAt = 120 + Math.random() * 180;
let mouthTwitchActive = 0;
let mouthTwitchPhase = 0;
let mouthTwitchDir = 1;

// Micro-movimenti sopracciglia
let browTwitchTimer = 0;
let browTwitchNextAt = 100 + Math.random() * 200;
let browTwitchActive = 0;
let browTwitchPhase = 0;
let browTwitchAmount = 0;

// Micro-drift capo
let headDriftTimer = 0;
let headDriftNextAt = 90 + Math.random() * 150;
let headDriftTarget = 0;
let headDriftCurrent = 0;

// Dilatazione pupille
let pupilScale = 1;
let pupilScaleTarget = 1;
let pupilTimer = 0;
let pupilNextAt = 180 + Math.random() * 240;

// Wander
let wanderActive = false;
let wanderTimer = 0;
let wanderNextAt = 120 + Math.random() * 180;
let wanderTargetX = 0;
let wanderTargetY = 0;
let wanderReturnTimer = 0;

// Saccadi
let saccadeTimer = 0;
let saccadeNextAt = 15 + Math.random() * 25;
let saccadeX = 0, saccadeY = 0;
let saccadeTargetX = 0, saccadeTargetY = 0;

// Riflessione
let reflectionTimer = 0;
let reflectionNextAt = 1500 + Math.random() * 1500;
let reflectionActive = 0;
let reflectionPhase = 0;
let reflectionTotalFrames = 180;

// Respirazione irregolare
let breathPhaseA = 0;
let breathPhaseB = 0;
let breathPhaseC = 0;
let breathCycleTimer = 0;
let breathCycleDuration = 180 + Math.random() * 120;
let currentBreathOffset = 0;

// Glitch
let glitchTimer = 0;
let glitchNextAt = 600 + Math.random() * 1200;
let glitchIntensity = 0;

// === SPECIFICO OLOCRAMA ===
// Linee di scansione
let scanlinePos = 0;
let scanlineSpeed = 0.6;

// Disturbo orizzontale (l'ologramma "salta")
let hDisplaceTimer = 0;
let hDisplaceNextAt = 120 + Math.random() * 240;
let hDisplaceActive = 0;
let hDisplaceOffset = 0;

// Flicker globale dell'ologramma
let holoFlicker = 1;
let holoFlickerTimer = 0;

// Sguardo
let eyeTargetX = 0, eyeTargetY = 0;
let eyeCurrentX = 0, eyeCurrentY = 0;
let mouseIsActive = false;
let mouseMovedTimer = 0;

// Emozione
let currentEmotion = { browAngle: 0, browHeight: 0, mouthCurve: 0, eyeOpen: 1, mouthWidth: 80, headTilt: 0 };
let targetEmotion = { ...currentEmotion };

const EMOTION_KEYWORDS = {
  felice: ['ciao','benvenuto','grazie','felice','bene','ottimo','grande','bello','amore','contento','evviva','bravo','sorriso','piacere'],
  triste: ['purtroppo','triste','male','problema','difficile','brutto','dispiace','sofferenza','dolore','solo','perdere'],
  arrabbiato: ['attenzione','pericolo','errore','grave','rabbia','basta','no','mai','inaccettabile','sbagliato'],
  sorpreso: ['wow','incredibile','davvero','improvviso','inaspettato','sorpresa','caspita','accidenti','oh']
};
let activeEmotion = 'neutro';

// ============================================================
// WEB AUDIO
// ============================================================
let audioCtx = null;
let ambientOsc = null;
let ambientGain = null;
let ambientFilter = null;

function initAudioContext() {
  if (audioCtx) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  } catch (e) {
    console.warn('Web Audio non disponibile', e);
  }
}

function startAmbient() {
  if (!audioCtx || !AUDIO_CONFIG.enabled) return;
  if (ambientOsc) return;
  ambientOsc = audioCtx.createOscillator();
  ambientOsc.type = 'sawtooth';
  ambientOsc.frequency.value = 55;
  ambientGain = audioCtx.createGain();
  ambientGain.gain.value = 0;
  ambientGain.gain.linearRampToValueAtTime(AUDIO_CONFIG.ambientVolume, audioCtx.currentTime + 0.4);
  ambientFilter = audioCtx.createBiquadFilter();
  ambientFilter.type = 'lowpass';
  ambientFilter.frequency.value = 200;
  ambientOsc.connect(ambientFilter);
  ambientFilter.connect(ambientGain);
  ambientGain.connect(audioCtx.destination);
  ambientOsc.start();
}

function stopAmbient() {
  if (!ambientOsc) return;
  const now = audioCtx.currentTime;
  ambientGain.gain.cancelScheduledValues(now);
  ambientGain.gain.linearRampToValueAtTime(0, now + 0.3);
  const osc = ambientOsc;
  const gain = ambientGain;
  ambientOsc = null;
  ambientGain = null;
  ambientFilter = null;
  setTimeout(() => {
    try { osc.stop(); } catch(e){}
    try { osc.disconnect(); } catch(e){}
    try { gain.disconnect(); } catch(e){}
  }, 400);
}

function playBeep(freq, duration, volume, type) {
  if (!audioCtx || !AUDIO_CONFIG.enabled) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type || 'square';
  osc.frequency.value = freq;
  gain.gain.value = 0;
  gain.gain.linearRampToValueAtTime(volume, audioCtx.currentTime + 0.008);
  gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration + 0.05);
}

function playSyllableBeep(syllable) {
  if (!audioCtx || !AUDIO_CONFIG.enabled) return;
  let freq = 460;
  if (syllable.includes('a')) freq = 350;
  else if (syllable.includes('o')) freq = 310;
  else if (syllable.includes('e')) freq = 390;
  else if (syllable.includes('u')) freq = 275;
  else if (syllable.includes('i')) freq = 510;
  else freq = 230;
  freq += (Math.random() - 0.5) * 30;
  playBeep(freq, 0.05, AUDIO_CONFIG.syllableVolume, 'square');
}

function playStartBeep() {
  if (!audioCtx || !AUDIO_CONFIG.enabled) return;
  playBeep(950, 0.09, AUDIO_CONFIG.startBeepVolume, 'sine');
  setTimeout(() => playBeep(1420, 0.11, AUDIO_CONFIG.startBeepVolume, 'sine'), 90);
}

function playEndBeep() {
  if (!audioCtx || !AUDIO_CONFIG.enabled) return;
  playBeep(1420, 0.09, AUDIO_CONFIG.endBeepVolume, 'sine');
  setTimeout(() => playBeep(950, 0.12, AUDIO_CONFIG.endBeepVolume, 'sine'), 90);
}

// ============================================================
// PARTICELLE — in stile ologramma (azzurro)
// ============================================================
let particles = [];
class Particle {
  constructor() { this.reset(); this.y = Math.random() * canvas.height; }
  reset() {
    this.x = Math.random() * canvas.width;
    this.y = canvas.height + 20;
    this.sizeBase = Math.random() * 2.2 + 0.4;
    this.size = this.sizeBase;
    this.speedBase = Math.random() * 0.4 + 0.2;
    this.speed = this.speedBase;
    this.alphaBase = Math.random() * 0.4 + 0.15;
    this.alpha = this.alphaBase;
    this.wobble = Math.random() * Math.PI * 2;
    this.wobbleSpeed = Math.random() * 0.02 + 0.008;
  }
  update(intensity) {
    this.speed = this.speedBase * (1 + intensity * 2.5);
    this.size = this.sizeBase * (1 + intensity * 1.5);
    this.alpha = Math.min(1, this.alphaBase * (1 + intensity * 2));
    this.wobble += this.wobbleSpeed * (1 + intensity * 2);
    this.y -= this.speed;
    this.x += Math.sin(this.wobble) * (0.4 + intensity * 1.5);
    if (this.y < -20) this.reset();
  }
  draw() {
    ctx.save();
    ctx.globalAlpha = this.alpha * holoFlicker;
    ctx.fillStyle = COLOR_MAIN;
    ctx.shadowBlur = 6 + 10 * (this.size / this.sizeBase - 1);
    ctx.shadowColor = COLOR_MAIN;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}
for (let i = 0; i < 50; i++) particles.push(new Particle());

// ============================================================
// ONDE
// ============================================================
let waves = [];
let waveSpawnTimer = 0;
function spawnWave(baseAlpha, baseSpeed) {
  waves.push({
    radius: 40, maxRadius: 260 + Math.random() * 60,
    alpha: baseAlpha, speed: baseSpeed + Math.random() * 0.6,
    width: 1 + Math.random() * 0.8
  });
}
function updateWaves() {
  waveSpawnTimer++;
  const spawnInterval = isSpeaking ? 12 : 60;
  const baseAlpha = isSpeaking ? 0.55 : 0.28;
  const baseSpeed = isSpeaking ? 1.4 : 0.8;
  if (waveSpawnTimer >= spawnInterval) {
    waveSpawnTimer = 0;
    spawnWave(baseAlpha, baseSpeed);
  }
  for (let i = waves.length - 1; i >= 0; i--) {
    const w = waves[i];
    w.radius += w.speed;
    w.alpha -= 0.009;
    if (w.alpha <= 0 || w.radius >= w.maxRadius) waves.splice(i, 1);
  }
}
function drawWaves(cx, cy) {
  waves.forEach(w => {
    ctx.save();
    ctx.strokeStyle = COLOR_MAIN;
    ctx.globalAlpha = w.alpha * holoFlicker;
    ctx.lineWidth = w.width;
    ctx.shadowBlur = 10;
    ctx.shadowColor = COLOR_GLOW;
    // Onde "quadrate" per look ologramma
    const r = w.radius;
    ctx.beginPath();
    ctx.moveTo(cx - r, cy - r * 0.7);
    ctx.lineTo(cx + r, cy - r * 0.7);
    ctx.lineTo(cx + r, cy + r * 0.7);
    ctx.lineTo(cx - r, cy + r * 0.7);
    ctx.closePath();
    ctx.stroke();
    ctx.restore();
  });
}

// ============================================================
// SILLABE
// ============================================================
function getSyllables(text) {
  const words = text.toLowerCase().match(/[a-zàèéìòù]+/g) || [];
  const result = [];
  const vowels = 'aeiouàèéìòù';
  for (const word of words) {
    let currentSyl = '';
    for (let i = 0; i < word.length; i++) {
      currentSyl += word[i];
      const isVowel = vowels.includes(word[i]);
      const nextIsVowel = i + 1 < word.length && vowels.includes(word[i + 1]);
      if (isVowel && !nextIsVowel) { result.push(currentSyl); currentSyl = ''; }
    }
    if (currentSyl) result.push(currentSyl);
  }
  return result;
}

function extractWords(text) {
  const words = [];
  const regex = /[a-zA-ZàèéìòùÀÈÉÌÒÙ]+/g;
  let m;
  while ((m = regex.exec(text)) !== null) {
    words.push({ word: m[0].toLowerCase(), index: m.index });
  }
  return words;
}

// ============================================================
// VOCI
// ============================================================
let selectedVoice = null;
function pickItalianVoice() {
  const voices = speechSynthesis.getVoices();
  if (!voices.length) return null;
  let v = voices.find(v => v.lang === 'it-IT');
  if (!v) v = voices.find(v => v.lang && v.lang.startsWith('it'));
  if (!v) v = voices.find(v => v.lang && v.lang.startsWith('en'));
  return v || voices[0];
}
function loadVoices() {
  const v = pickItalianVoice();
  if (v) { selectedVoice = v; console.log('[Avatar] Voce:', v.name, v.lang); }
}
if ('speechSynthesis' in window) {
  speechSynthesis.onvoiceschanged = loadVoices;
  loadVoices();
}

// ============================================================
// EMOZIONI
// ============================================================
function detectEmotionForWord(word) {
  for (const [emotion, keywords] of Object.entries(EMOTION_KEYWORDS)) {
    if (keywords.includes(word)) return emotion;
  }
  return null;
}
function emotionParams(emotion) {
  switch (emotion) {
    case 'felice':    return { browAngle: 0.3, browHeight: -5, mouthCurve: 1, eyeOpen: 0.95, mouthWidth: 90, headTilt: 0.02 };
    case 'triste':    return { browAngle: -0.8, browHeight: 8, mouthCurve: -1, eyeOpen: 0.75, mouthWidth: 70, headTilt: -0.05 };
    case 'arrabbiato':return { browAngle: -1.2, browHeight: 5, mouthCurve: -0.7, eyeOpen: 0.7, mouthWidth: 80, headTilt: 0 };
    case 'sorpreso':  return { browAngle: 0.6, browHeight: -14, mouthCurve: 0, eyeOpen: 1.5, mouthWidth: 75, headTilt: 0 };
    default:          return { browAngle: 0, browHeight: 0, mouthCurve: 0, eyeOpen: 1, mouthWidth: 80, headTilt: 0 };
  }
}

let wordsInText = [];
let wordCursor = 0;
let emotionHoldFrames = 0;

function processNextWord() {
  if (wordCursor >= wordsInText.length) return;
  const w = wordsInText[wordCursor];
  const detected = detectEmotionForWord(w.word);
  if (detected) { activeEmotion = detected; emotionHoldFrames = 90; }
  wordCursor++;
}

// ============================================================
// BOCCA
// ============================================================
let syllables = [];
let currentSyllableIndex = 0;
let syllableTimer = 0;
let framesPerSyllable = 8;
let lastBeepedSyllable = -1;

function updateMouthAnimation() {
  if (!isSpeaking) {
    targetMouthOpen = 0.02 + Math.abs(Math.sin(time * 0.6)) * 0.04;
    return;
  }
  syllableTimer++;
  if (syllableTimer >= framesPerSyllable) {
    syllableTimer = 0;
    currentSyllableIndex++;
    if (currentSyllableIndex >= syllables.length) currentSyllableIndex = 0;
    if (currentSyllableIndex !== lastBeepedSyllable) {
      lastBeepedSyllable = currentSyllableIndex;
      playSyllableBeep(syllables[currentSyllableIndex] || '');
    }
    const syl = syllables[currentSyllableIndex] || '';
    framesPerSyllable = 6 + Math.random() * 4 + Math.min(4, syl.length);
  }
  const syl = syllables[currentSyllableIndex] || '';
  let openness = 0.4;
  if (syl.includes('a')) openness = 1.0;
  else if (syl.includes('o')) openness = 0.9;
  else if (syl.includes('e')) openness = 0.75;
  else if (syl.includes('u')) openness = 0.6;
  else if (syl.includes('i')) openness = 0.5;
  else openness = 0.25;
  openness += (Math.random() - 0.5) * 0.15;
  targetMouthOpen = Math.max(0.05, Math.min(1, openness));
}

// ============================================================
// ANIMAZIONI
// ============================================================
function lerp(a, b, t) { return a + (b - a) * t; }

function updateEmotionAnimation() {
  if (emotionHoldFrames > 0) {
    emotionHoldFrames--;
    if (emotionHoldFrames === 0) activeEmotion = 'neutro';
  }
  const params = emotionParams(activeEmotion);
  Object.keys(params).forEach(k => targetEmotion[k] = params[k]);
  Object.keys(currentEmotion).forEach(k => {
    currentEmotion[k] = lerp(currentEmotion[k], targetEmotion[k], 0.12);
  });
}

function updateBreath() {
  breathPhaseA += 0.018;
  breathPhaseB += 0.037;
  breathPhaseC += 0.008;
  const base = Math.sin(breathPhaseA) * 2.5;
  const harmonic = Math.sin(breathPhaseB) * 0.8;
  const drift = Math.sin(breathPhaseC) * 1.2;
  currentBreathOffset = base + harmonic + drift;
  breathCycleTimer++;
  if (breathCycleTimer > breathCycleDuration) {
    breathCycleTimer = 0;
    breathCycleDuration = 180 + Math.random() * 180;
    currentBreathOffset += (Math.random() - 0.5) * 2;
  }
}
function getBreathOffset() { return currentBreathOffset; }

function updateBlink() {
  blinkTimer++;
  if (doubleBlink) {
    doubleBlinkDelay++;
    if (doubleBlinkDelay > 15 && doubleBlinkDelay < 20) eyeBlink = 1;
    else if (doubleBlinkDelay >= 20 && doubleBlinkDelay < 25) eyeBlink = 0;
    else if (doubleBlinkDelay >= 25 && doubleBlinkDelay < 30) eyeBlink = 1;
    else if (doubleBlinkDelay >= 30) {
      eyeBlink = 0; doubleBlink = false; doubleBlinkDelay = 0;
      nextBlinkAt = blinkTimer + 150 + Math.random() * 200;
    }
    return;
  }
  if (blinkTimer >= nextBlinkAt) {
    eyeBlink = 1;
    if (blinkTimer >= nextBlinkAt + 6) {
      eyeBlink = 0;
      if (Math.random() < 0.2) { doubleBlink = true; doubleBlinkDelay = 0; }
      else nextBlinkAt = blinkTimer + 150 + Math.random() * 200;
    }
  }
}

function updateYawn() {
  if (isSpeaking) { yawnActive = 0; return; }
  yawnTimer++;
  if (yawnTimer > yawnCooldown && yawnActive === 0) { yawnActive = 0.01; yawnPhase = 0; }
  if (yawnActive > 0) {
    yawnPhase++;
    const totalFrames = 120;
    if (yawnPhase < 40) yawnActive = yawnPhase / 40;
    else if (yawnPhase < 80) yawnActive = 1;
    else if (yawnPhase < totalFrames) yawnActive = 1 - (yawnPhase - 80) / 40;
    else { yawnActive = 0; yawnTimer = 0; yawnCooldown = 800 + Math.random() * 800; }
  }
}

function updateMouthTwitch() {
  if (isSpeaking) {
    mouthTwitchActive = lerp(mouthTwitchActive, 0, 0.15);
    mouthTwitchTimer = 0;
    return;
  }
  mouthTwitchTimer++;
  if (mouthTwitchTimer > mouthTwitchNextAt && mouthTwitchActive < 0.01) {
    mouthTwitchActive = 0.01;
    mouthTwitchPhase = 0;
    mouthTwitchDir = Math.random() < 0.5 ? 1 : -1;
  }
  if (mouthTwitchActive > 0) {
    mouthTwitchPhase++;
    const totalFrames = 45 + Math.random() * 20;
    if (mouthTwitchPhase < totalFrames * 0.35) {
      mouthTwitchActive = mouthTwitchPhase / (totalFrames * 0.35);
    } else if (mouthTwitchPhase < totalFrames * 0.65) {
      mouthTwitchActive = 1;
    } else if (mouthTwitchPhase < totalFrames) {
      mouthTwitchActive = 1 - (mouthTwitchPhase - totalFrames * 0.65) / (totalFrames * 0.35);
    } else {
      mouthTwitchActive = 0;
      mouthTwitchTimer = 0;
      mouthTwitchNextAt = 180 + Math.random() * 300;
    }
  }
}

function updateBrowTwitch() {
  if (isSpeaking) {
    browTwitchActive = lerp(browTwitchActive, 0, 0.15);
    browTwitchAmount = lerp(browTwitchAmount, 0, 0.1);
    return;
  }
  browTwitchTimer++;
  if (browTwitchTimer > browTwitchNextAt && browTwitchActive < 0.01) {
    browTwitchActive = 0.01;
    browTwitchPhase = 0;
  }
  if (browTwitchActive > 0) {
    browTwitchPhase++;
    const totalFrames = 40 + Math.random() * 30;
    if (browTwitchPhase < totalFrames * 0.4) {
      browTwitchActive = browTwitchPhase / (totalFrames * 0.4);
    } else if (browTwitchPhase < totalFrames * 0.6) {
      browTwitchActive = 1;
    } else if (browTwitchPhase < totalFrames) {
      browTwitchActive = 1 - (browTwitchPhase - totalFrames * 0.6) / (totalFrames * 0.4);
    } else {
      browTwitchActive = 0;
      browTwitchTimer = 0;
      browTwitchNextAt = 150 + Math.random() * 250;
    }
  }
  const targetAmount = browTwitchActive * (2 + Math.random() * 2);
  browTwitchAmount = lerp(browTwitchAmount, targetAmount, 0.15);
}

function updateHeadDrift() {
  if (isSpeaking) {
    headDriftTarget = 0;
    headDriftCurrent = lerp(headDriftCurrent, 0, 0.08);
    return;
  }
  headDriftTimer++;
  if (headDriftTimer > headDriftNextAt) {
    headDriftTarget = (Math.random() - 0.5) * 0.06;
    headDriftTimer = 0;
    headDriftNextAt = 120 + Math.random() * 200;
  }
  headDriftCurrent = lerp(headDriftCurrent, headDriftTarget, 0.02);
}

function updatePupilDilation() {
  pupilTimer++;
  if (pupilTimer > pupilNextAt) {
    pupilScaleTarget = 0.85 + Math.random() * 0.30;
    pupilTimer = 0;
    pupilNextAt = 120 + Math.random() * 240;
  }
  pupilScale = lerp(pupilScale, pupilScaleTarget, 0.02);
}

function updateWander() {
  if (isSpeaking) { wanderActive = false; return; }
  if (mouseIsActive) { wanderActive = false; return; }
  wanderTimer++;
  if (wanderTimer > wanderNextAt) {
    wanderTargetX = (Math.random() - 0.5) * 10;
    wanderTargetY = (Math.random() - 0.5) * 6;
    wanderTimer = 0;
    wanderNextAt = 90 + Math.random() * 180;
    wanderActive = true;
    wanderReturnTimer = 0;
  }
  if (wanderActive) {
    wanderReturnTimer++;
    if (wanderReturnTimer > 120) {
      wanderTargetX = 0; wanderTargetY = 0;
      wanderActive = false;
    }
  }
}

function updateSaccades() {
  if (isSpeaking) {
    saccadeX = lerp(saccadeX, 0, 0.2);
    saccadeY = lerp(saccadeY, 0, 0.2);
    return;
  }
  saccadeTimer++;
  if (saccadeTimer > saccadeNextAt) {
    saccadeTargetX = (Math.random() - 0.5) * 2;
    saccadeTargetY = (Math.random() - 0.5) * 1.5;
    saccadeTimer = 0;
    saccadeNextAt = 15 + Math.random() * 25;
  }
  saccadeX = lerp(saccadeX, saccadeTargetX, 0.4);
  saccadeY = lerp(saccadeY, saccadeTargetY, 0.4);
}

function updateReflection() {
  if (isSpeaking) {
    reflectionActive = 0;
    reflectionTimer = 0;
    return;
  }
  reflectionTimer++;
  if (reflectionTimer > reflectionNextAt && reflectionActive === 0) {
    reflectionActive = 0.01;
    reflectionPhase = 0;
  }
  if (reflectionActive > 0) {
    reflectionPhase++;
    const totalFrames = reflectionTotalFrames;
    if (reflectionPhase < totalFrames * 0.2) {
      reflectionActive = reflectionPhase / (totalFrames * 0.2);
    } else if (reflectionPhase < totalFrames * 0.7) {
      reflectionActive = 1;
    } else if (reflectionPhase < totalFrames) {
      reflectionActive = 1 - (reflectionPhase - totalFrames * 0.7) / (totalFrames * 0.3);
    } else {
      reflectionActive = 0;
      reflectionTimer = 0;
      reflectionNextAt = 1500 + Math.random() * 1500;
    }
  }
}

document.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  const dx = e.clientX - cx, dy = e.clientY - cy;
  const dist = Math.sqrt(dx*dx + dy*dy);
  const maxOffset = 6;
  if (dist > 0) {
    const factor = Math.min(1, dist / 400);
    eyeTargetX = (dx / dist) * maxOffset * factor;
    eyeTargetY = (dy / dist) * maxOffset * factor;
  }
  mouseIsActive = true;
  mouseMovedTimer = 0;
});

function updateGaze() {
  mouseMovedTimer++;
  if (mouseMovedTimer > 180) mouseIsActive = false;
  if (isSpeaking) {
    eyeTargetX = Math.sin(time * 0.5) * 1.5;
    eyeTargetY = Math.sin(time * 0.7) * 1.0;
  } else if (mouseIsActive) {
    // già aggiornato da mousemove
  } else if (wanderActive) {
    eyeTargetX = wanderTargetX;
    eyeTargetY = wanderTargetY;
  } else {
    eyeTargetX = lerp(eyeTargetX, 0, 0.03);
    eyeTargetY = lerp(eyeTargetY, 0, 0.03);
  }
  eyeCurrentX = lerp(eyeCurrentX, eyeTargetX, 0.08);
  eyeCurrentY = lerp(eyeCurrentY, eyeTargetY, 0.08);
}

function updateGlitch() {
  glitchTimer++;
  if (glitchIntensity > 0) {
    glitchIntensity -= 0.05;
    if (glitchIntensity < 0) glitchIntensity = 0;
  }
  if (glitchTimer > glitchNextAt) {
    glitchIntensity = 0.6 + Math.random() * 0.4;
    glitchTimer = 0;
    glitchNextAt = 600 + Math.random() * 1200;
  }
}

// === SPECIFICO OLOCRAMA ===
function updateScanline() {
  scanlinePos += scanlineSpeed;
  if (scanlinePos > 380) scanlinePos = -20;
}

function updateHorizontalDisplace() {
  hDisplaceTimer++;
  if (hDisplaceActive > 0) {
    hDisplaceActive -= 0.08;
    if (hDisplaceActive < 0) hDisplaceActive = 0;
    hDisplaceOffset = (Math.random() - 0.5) * 12 * hDisplaceActive;
  }
  if (hDisplaceTimer > hDisplaceNextAt) {
    hDisplaceActive = 0.5 + Math.random() * 0.5;
    hDisplaceTimer = 0;
    hDisplaceNextAt = 100 + Math.random() * 260;
  }
}

function updateHoloFlicker() {
  holoFlickerTimer++;
  // Flicker costante molto sottile + ogni tanto un lampo più forte
  const base = 0.92 + Math.sin(holoFlickerTimer * 0.3) * 0.04 + Math.sin(holoFlickerTimer * 0.7) * 0.03;
  if (Math.random() < 0.005) {
    holoFlicker = 0.55 + Math.random() * 0.15;
  } else {
    holoFlicker = lerp(holoFlicker, base, 0.25);
  }
}

// ============================================================
// DISEGNO
// ============================================================
function drawAvatar() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  time += 0.02;

  updateMouthAnimation();
  updateEmotionAnimation();
  updateBreath();
  updateBlink();
  updateYawn();
  updateMouthTwitch();
  updateBrowTwitch();
  updateHeadDrift();
  updatePupilDilation();
  updateWander();
  updateSaccades();
  updateReflection();
  updateGaze();
  updateGlitch();
  updateWaves();
  updateScanline();
  updateHorizontalDisplace();
  updateHoloFlicker();

  const baseIntensity = 0.15;
  const speakIntensity = isSpeaking ? Math.min(1, 0.3 + mouthOpen * 0.7) : 0;
  const intensity = Math.max(baseIntensity, speakIntensity);
  particles.forEach(p => { p.update(intensity); p.draw(); });

  const cx = canvas.width / 2;
  const cy = canvas.height / 2 + getBreathOffset();

  ctx.save();
  if (glitchIntensity > 0) {
    ctx.translate(
      (Math.random() - 0.5) * glitchIntensity * 8,
      (Math.random() - 0.5) * glitchIntensity * 4
    );
  }

  // === CORNICE OLOCRAMA (rettangolo) ===
  drawHoloFrame(cx, cy);

  // === ONDE ===
  drawWaves(cx, cy);

  // === APPLICA OPACITÀ GLOBALE per effetto ologramma ===
  ctx.save();
  ctx.globalAlpha = holoFlicker;

  // Alone centrale
  const gIntensity = isSpeaking ? 0.3 + targetMouthOpen * 0.4 : 0.1;
  const gradient = ctx.createRadialGradient(cx, cy, 60, cx, cy, 220);
  gradient.addColorStop(0, `rgba(102,204,255,${gIntensity * 0.3})`);
  gradient.addColorStop(1, 'rgba(102,204,255,0)');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // === DISTURBO ORIZZONTALE (l'ologramma "salta") ===
  ctx.save();
  ctx.translate(hDisplaceOffset, 0);

  // Head tilt + drift
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(currentEmotion.headTilt + headDriftCurrent);
  ctx.translate(-cx, -cy);

  // === SCHERMO OLOCRAMA: linee di scansione sottili sul viso ===
  drawScanlines(cx, cy);

  // === OCCHI E SOPRACCIGLIA ===
  const reflectionOffsetY = reflectionActive * -4;
  const eyeY = cy - 30 + reflectionOffsetY;
  const eyeOffsetX = 55;
  const baseEyeRadius = 18;
  const reflectionEyeFactor = 1 - reflectionActive * 0.25;
  const eyeRadius = baseEyeRadius * currentEmotion.eyeOpen * reflectionEyeFactor;

  drawEye(cx - eyeOffsetX, eyeY, eyeRadius);
  drawEye(cx + eyeOffsetX, eyeY, eyeRadius);

  const reflectionBrowOffset = reflectionActive * 3;
  drawEyebrowWithOffset(cx - eyeOffsetX, eyeY - eyeRadius - 12 - reflectionBrowOffset, 1);
  drawEyebrowWithOffset(cx + eyeOffsetX, eyeY - eyeRadius - 12 - reflectionBrowOffset, -1);

  // Naso (linea verticale)
  ctx.save();
  ctx.strokeStyle = COLOR_DIM;
  ctx.lineWidth = 2;
  ctx.shadowBlur = 8;
  ctx.shadowColor = COLOR_GLOW_SOFT;
  ctx.beginPath();
  ctx.moveTo(cx, eyeY + 28);
  ctx.lineTo(cx, cy + 28);
  ctx.stroke();
  ctx.restore();

  // Bocca
  drawMouth(cx, cy + 75);
  mouthOpen += (targetMouthOpen - mouthOpen) * 0.35;

  ctx.restore(); // head tilt
  ctx.restore(); // displace
  ctx.restore(); // alpha

  ctx.restore(); // glitch

  // === OVERLAY: linee di scansione globali ===
  drawGlobalScanlines();

  // Riflesso sotto (specchio sfumato)
  drawReflection(cx, cy);
}

// === CORNICE RETTANGOLARE OLOCRAMA ===
function drawHoloFrame(cx, cy) {
  const w = FRAME_W;
  const h = FRAME_H;
  const halfW = w / 2;
  const halfH = h / 2;
  const x0 = cx - halfW;
  const y0 = cy - halfH;

  ctx.save();
  ctx.globalAlpha = holoFlicker * 0.9;

  // Cornice esterna luminosa
  ctx.strokeStyle = COLOR_MAIN;
  ctx.lineWidth = 2;
  ctx.shadowBlur = 20;
  ctx.shadowColor = COLOR_GLOW;
  ctx.strokeRect(x0, y0, w, h);

  // Cornice interna sottile
  ctx.strokeStyle = COLOR_MAIN;
  ctx.globalAlpha = holoFlicker * 0.4;
  ctx.lineWidth = 1;
  ctx.shadowBlur = 8;
  ctx.strokeRect(x0 + 8, y0 + 8, w - 16, h - 16);

  // Angoli decorativi (stile HUD)
  ctx.globalAlpha = holoFlicker * 1;
  ctx.strokeStyle = COLOR_BRIGHT;
  ctx.lineWidth = 3;
  ctx.shadowBlur = 15;
  ctx.shadowColor = COLOR_GLOW;
  const cl = 25;
  // Alto-sinistra
  ctx.beginPath();
  ctx.moveTo(x0, y0 + cl); ctx.lineTo(x0, y0); ctx.lineTo(x0 + cl, y0);
  ctx.stroke();
  // Alto-destra
  ctx.beginPath();
  ctx.moveTo(x0 + w - cl, y0); ctx.lineTo(x0 + w, y0); ctx.lineTo(x0 + w, y0 + cl);
  ctx.stroke();
  // Basso-sinistra
  ctx.beginPath();
  ctx.moveTo(x0, y0 + h - cl); ctx.lineTo(x0, y0 + h); ctx.lineTo(x0 + cl, y0 + h);
  ctx.stroke();
  // Basso-destra
  ctx.beginPath();
  ctx.moveTo(x0 + w - cl, y0 + h); ctx.lineTo(x0 + w, y0 + h); ctx.lineTo(x0 + w, y0 + h - cl);
  ctx.stroke();

  // "Piedini" dell'ologramma (base proiettore)
  ctx.restore();
  ctx.save();
  ctx.globalAlpha = holoFlicker * 0.7;
  ctx.strokeStyle = COLOR_MAIN;
  ctx.lineWidth = 2;
  ctx.shadowBlur = 12;
  ctx.shadowColor = COLOR_GLOW;
  // Linee diagonali ai piedi del rettangolo (fascio di proiezione)
  ctx.beginPath();
  ctx.moveTo(x0 + 30, y0 + h);
  ctx.lineTo(cx - 80, y0 + h + 60);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x0 + w - 30, y0 + h);
  ctx.lineTo(cx + 80, y0 + h + 60);
  ctx.stroke();

  // Scritta tecnica ai piedi
  ctx.globalAlpha = holoFlicker * 0.6;
  ctx.fillStyle = COLOR_BRIGHT;
  ctx.font = '9px Courier New';
  ctx.textAlign = 'center';
  ctx.fillText('◊ PROIEZIONE OLOCRAMA v2.4 ◊', cx, y0 + h + 18);
  ctx.fillText('STABILITÀ: ' + Math.floor(78 + holoFlicker * 20) + '%', cx, y0 + h + 32);

  ctx.restore();
}

// Linee di scansione SOPRA il viso
function drawScanlines(cx, cy) {
  const x0 = cx - FRAME_W / 2 + 15;
  const y0 = cy - FRAME_H / 2 + 15;
  const w = FRAME_W - 30;
  const h = FRAME_H - 30;

  ctx.save();
  ctx.globalAlpha = 0.08;
  ctx.strokeStyle = COLOR_MAIN;
  ctx.lineWidth = 1;
  for (let y = y0; y < y0 + h; y += 4) {
    ctx.beginPath();
    ctx.moveTo(x0, y);
    ctx.lineTo(x0 + w, y);
    ctx.stroke();
  }
  ctx.restore();

  // Linea di scansione principale che attraversa il viso
  ctx.save();
  const scanY = y0 + scanlinePos % h;
  ctx.globalAlpha = 0.5;
  ctx.strokeStyle = COLOR_BRIGHT;
  ctx.lineWidth = 2;
  ctx.shadowBlur = 15;
  ctx.shadowColor = COLOR_GLOW;
  ctx.beginPath();
  ctx.moveTo(x0, scanY);
  ctx.lineTo(x0 + w, scanY);
  ctx.stroke();

  // Bagliore aggiuntivo attorno alla scanline
  ctx.globalAlpha = 0.15;
  ctx.lineWidth = 8;
  ctx.beginPath();
  ctx.moveTo(x0, scanY);
  ctx.lineTo(x0 + w, scanY);
  ctx.stroke();
  ctx.restore();
}

// Scanline globali (sopra tutto)
function drawGlobalScanlines() {
  ctx.save();
  ctx.globalAlpha = 0.05;
  ctx.strokeStyle = COLOR_BRIGHT;
  ctx.lineWidth = 1;
  for (let y = 0; y < canvas.height; y += 3) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(canvas.width, y);
    ctx.stroke();
  }
  ctx.restore();
}

// Riflesso sul "pavimento" (specchio sfumato)
function drawReflection(cx, cy) {
  const y0 = cy + FRAME_H / 2 + 40;
  const h = 40;

  ctx.save();
  // Gradiente dal centro verso il basso
  const grad = ctx.createLinearGradient(0, y0, 0, y0 + h);
  grad.addColorStop(0, `rgba(102,204,255,${0.15 * holoFlicker})`);
  grad.addColorStop(1, 'rgba(102,204,255,0)');
  ctx.fillStyle = grad;

  // Un riflesso sgranato: linee orizzontali corte
  ctx.globalAlpha = 0.6 * holoFlicker;
  for (let i = 0; i < 8; i++) {
    const yy = y0 + i * 5;
    const ww = FRAME_W * (1 - i * 0.08);
    ctx.fillRect(cx - ww / 2, yy, ww, 2);
  }
  ctx.restore();
}

function drawEye(x, y, radius) {
  ctx.save();
  ctx.strokeStyle = COLOR_MAIN;
  ctx.lineWidth = 2;
  ctx.shadowBlur = 15;
  ctx.shadowColor = COLOR_GLOW;
  ctx.beginPath();
  if (eyeBlink > 0) {
    ctx.moveTo(x - radius, y);
    ctx.lineTo(x + radius, y);
    ctx.stroke();
  } else {
    ctx.arc(x, y, radius, 0, Math.PI * 2);
    ctx.stroke();
    const pupilX = x + eyeCurrentX + saccadeX + Math.sin(time * 0.7) * 1.5;
    const pupilY = y + eyeCurrentY + saccadeY + Math.sin(time * 1.1) * 1.5;
    const pupilRadius = radius * 0.4 * pupilScale;
    ctx.beginPath();
    ctx.arc(pupilX, pupilY, pupilRadius, 0, Math.PI * 2);
    ctx.fillStyle = COLOR_BRIGHT;
    ctx.shadowBlur = 25;
    ctx.fill();
    // Riflesso
    ctx.beginPath();
    ctx.arc(pupilX - 3, pupilY - 3, Math.max(1.5, radius * 0.15), 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff';
    ctx.shadowBlur = 15;
    ctx.shadowColor = '#ffffff';
    ctx.fill();
  }
  ctx.restore();
}

function drawEyebrowWithOffset(x, y, side) {
  const w = 30;
  const angle = currentEmotion.browAngle * 0.35;
  const offsetY = currentEmotion.browHeight - browTwitchAmount;
  const reflectAngle = reflectionActive * -0.15 * side;
  const finalAngle = angle + reflectAngle;

  ctx.save();
  ctx.strokeStyle = COLOR_MAIN;
  ctx.lineWidth = 3.5;
  ctx.lineCap = 'round';
  ctx.shadowBlur = 12;
  ctx.shadowColor = COLOR_GLOW;
  const innerX = x - side * w / 2;
  const outerX = x + side * w / 2;
  const innerY = y + offsetY + finalAngle * w * 0.5;
  const outerY = y + offsetY - finalAngle * w * 0.5;
  ctx.beginPath();
  ctx.moveTo(innerX, innerY);
  ctx.lineTo(outerX, outerY);
  ctx.stroke();
  ctx.restore();
}

function drawMouth(x, y) {
  ctx.save();
  ctx.strokeStyle = COLOR_MAIN;
  ctx.lineWidth = 2.5;
  ctx.shadowBlur = 18;
  ctx.shadowColor = COLOR_GLOW;
  const yawnOpen = yawnActive * 0.9;
  const combinedOpen = Math.max(mouthOpen, yawnOpen);
  const mouthWidth = currentEmotion.mouthWidth;
  const maxOpenHeight = 55;
  const openHeight = maxOpenHeight * combinedOpen;
  const reflectionCurve = reflectionActive * -0.4;

  if (openHeight > 8) {
    const twitchOffsetY = mouthTwitchActive * mouthTwitchDir * 1.5;
    ctx.beginPath();
    ctx.ellipse(x, y + twitchOffsetY, mouthWidth / 2, openHeight / 2, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(x, y + twitchOffsetY, mouthWidth / 2 - 3, openHeight / 2 - 3, 0, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(10,30,50,${0.5 + combinedOpen * 0.5})`;
    ctx.fill();
    if (combinedOpen > 0.5) {
      ctx.beginPath();
      ctx.ellipse(x, y + twitchOffsetY + openHeight * 0.15, mouthWidth / 3, openHeight / 4, 0, 0, Math.PI * 2);
      ctx.fillStyle = COLOR_MAIN + '99';
      ctx.fill();
    }
  } else {
    const curve = currentEmotion.mouthCurve + reflectionCurve;
    const twitchCurve = mouthTwitchActive * mouthTwitchDir * 0.7;
    const totalCurve = curve + twitchCurve;
    const halfW = mouthWidth / 2;
    const controlY = y + totalCurve * 22;
    ctx.beginPath();
    ctx.moveTo(x - halfW, y);
    ctx.quadraticCurveTo(x, controlY, x + halfW, y);
    ctx.stroke();
  }
  ctx.restore();
}

// ============================================================
// LOOP
// ============================================================
function renderLoop() {
  drawAvatar();
  requestAnimationFrame(renderLoop);
}

// ============================================================
// SINTESI VOCALE + TOGGLE
// ============================================================
let utterance = null;
let fallbackWordInterval = null;

function updateStatus(text, cls) {
  statusEl.innerText = text;
  statusEl.classList.remove('speaking', 'done');
  if (cls) statusEl.classList.add(cls);
}

function speak() {
  if (!('speechSynthesis' in window)) {
    updateStatus('⚠ sintesi vocale non supportata');
    return;
  }
  window.speechSynthesis.cancel();
  if (fallbackWordInterval) { clearInterval(fallbackWordInterval); fallbackWordInterval = null; }

  initAudioContext();
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

  syllables = getSyllables(TESTO);
  wordsInText = extractWords(TESTO);
  currentSyllableIndex = 0;
  syllableTimer = 0;
  framesPerSyllable = 8;
  wordCursor = 0;
  activeEmotion = 'neutro';
  emotionHoldFrames = 0;
  lastBeepedSyllable = -1;

  utterance = new SpeechSynthesisUtterance(TESTO);
  utterance.lang = 'it-IT';
  utterance.rate = 0.95;
  utterance.pitch = 1.1;
  utterance.volume = 1;
  if (selectedVoice) utterance.voice = selectedVoice;

  utterance.onstart = () => {
    isSpeaking = true;
    container.classList.add('speaking');
    updateStatus('■ clicca per fermare', 'speaking');
    playStartBeep();
    startAmbient();
  };

  utterance.onboundary = (e) => {
    if (e.name === 'word') processNextWord();
  };

  utterance.onend = () => {
    isSpeaking = false;
    targetMouthOpen = 0;
    activeEmotion = 'neutro';
    emotionHoldFrames = 0;
    container.classList.remove('speaking');
    updateStatus('✓ fine — clicca per riascoltare', 'done');
    playEndBeep();
    stopAmbient();
    if (fallbackWordInterval) { clearInterval(fallbackWordInterval); fallbackWordInterval = null; }
  };

  utterance.onerror = (e) => {
    console.error(e);
    isSpeaking = false;
    targetMouthOpen = 0;
    activeEmotion = 'neutro';
    emotionHoldFrames = 0;
    container.classList.remove('speaking');
    updateStatus('✗ errore — clicca per riprovare', 'done');
    stopAmbient();
    if (fallbackWordInterval) { clearInterval(fallbackWordInterval); fallbackWordInterval = null; }
  };

  fallbackWordInterval = setInterval(() => {
    if (!isSpeaking) { clearInterval(fallbackWordInterval); fallbackWordInterval = null; return; }
    processNextWord();
  }, 350);

  speechSynthesis.speak(utterance);
}

function stopSpeaking() {
  speechSynthesis.cancel();
  if (fallbackWordInterval) { clearInterval(fallbackWordInterval); fallbackWordInterval = null; }
  isSpeaking = false;
  targetMouthOpen = 0;
  activeEmotion = 'neutro';
  emotionHoldFrames = 0;
  container.classList.remove('speaking');
  updateStatus('▶ clicca per iniziare');
  stopAmbient();
}

function toggleSpeech() {
  if (isSpeaking) stopSpeaking();
  else speak();
}

document.body.addEventListener('click', toggleSpeech);
document.body.addEventListener('touchstart', function(e) {
  e.preventDefault();
  toggleSpeech();
}, { passive: false });

document.addEventListener('keydown', (e) => {
  if (e.key === ' ' || e.key === 'Enter') {
    e.preventDefault();
    toggleSpeech();
  } else if (e.key === 'Escape') {
    if (isSpeaking) stopSpeaking();
  }
});

// ============================================================
// AVVIO
// ============================================================
renderLoop();
</script>
