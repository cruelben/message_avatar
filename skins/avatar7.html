<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Talking Avatar - Robot</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background-color: #0a0e14;
    color: #e0e0e8;
    font-family: 'Courier New', Courier, monospace;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    background-image:
      radial-gradient(circle at 50% 45%, rgba(180,200,220,0.08) 0%, transparent 60%),
      linear-gradient(rgba(80,100,120,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(80,100,120,0.04) 1px, transparent 1px);
    background-size: 100% 100%, 40px 40px, 40px 40px;
    cursor: pointer;
    position: relative;
  }
  /* Scanline CRT */
  .crt-overlay {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    background:
      linear-gradient(rgba(0,0,0,0) 50%, rgba(20,25,35,0.35) 50%);
    background-size: 100% 4px;
    pointer-events: none; z-index: 9999;
    animation: flicker 0.2s infinite;
  }
  @keyframes flicker { 0%{opacity:.96} 50%{opacity:.9} 100%{opacity:.96} }
  /* Vignette */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 45%, rgba(5,8,12,0.9) 100%);
    pointer-events: none;
    z-index: 9998;
  }

  .avatar-container {
    position: relative; width: 560px; height: 600px;
    display: flex; justify-content: center; align-items: center;
    flex-shrink: 0;
    pointer-events: none;
    z-index: 1;
  }
  canvas { display: block; }

  /* HUD tecnico in alto */
  .hud {
    position: fixed;
    top: 25px;
    left: 25px;
    font-size: 10px;
    color: #88aacc;
    opacity: 0.6;
    letter-spacing: 2px;
    pointer-events: none;
    z-index: 10;
    line-height: 1.7;
  }
  .hud-right {
    position: fixed;
    top: 25px;
    right: 25px;
    font-size: 10px;
    color: #88aacc;
    opacity: 0.6;
    letter-spacing: 2px;
    pointer-events: none;
    text-align: right;
    z-index: 10;
    line-height: 1.7;
  }

  .status {
    position: fixed;
    bottom: 55px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    color: #e0e0e8;
    text-transform: uppercase;
    letter-spacing: 5px;
    text-align: center;
    pointer-events: none;
    animation: breathe 2.5s ease-in-out infinite;
    z-index: 10;
    font-weight: bold;
    text-shadow: 0 0 8px rgba(200,220,240,0.5), 0 0 15px rgba(255,60,60,0.3);
  }
  @keyframes breathe {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }
  .status.speaking { animation: none; opacity: 1; color: #ffcc44; }
  .status.done { animation: none; opacity: 0.45; }
</style>
</head>
<body>
<div class="crt-overlay"></div>

<div class="hud">
  UNIT://RK-7719<br>
  MODE: AUDIO-INTERACT<br>
  PWR: <span id="pwr">98</span>%<br>
  TEMP: <span id="temp">42</span>°C
</div>
<div class="hud-right">
  SYNC: ACTIVE<br>
  UPTIME: <span id="uptime">00:00</span><br>
  RAM: 4.2 GB<br>
  NET: STABLE
</div>

<div class="avatar-container" id="avatarContainer">
  <canvas id="avatarCanvas" width="560" height="600"></canvas>
</div>

<div class="status" id="status">clicca o premi un tasto</div>

<script>
// ============================================================
// TESTO DA PRONUNCIARE
// ============================================================
const TESTO = "Ciao e benvenuto! Questo è un testo di prova per il mio avatar. Purtroppo a volte ci sono piccoli problemi, ma nessun errore grave. Attenzione però: il testo verrà letto utilizzando la sintesi vocale del browser. Wow, incredibile, vediamo se tutto funziona correttamente. Grazie e arrivederci!";

// ============================================================
// PALETTE ROBOT
// ============================================================
const METAL_LIGHT = '#d8dde4';      // metallo chiaro
const METAL_MID = '#9aa4b0';        // metallo medio
const METAL_DARK = '#5a6470';       // metallo scuro
const METAL_SHADOW = '#3a424c';     // ombra metallo
const METAL_EDGE = '#2a323c';       // bordo pannelli
const LED_RED = '#ff3030';          // LED rosso
const LED_RED_GLOW = 'rgba(255,48,48,0.9)';
const LED_BLUE = '#44aaff';         // LED blu
const LED_BLUE_GLOW = 'rgba(68,170,255,0.9)';
const LED_YELLOW = '#ffcc44';       // LED giallo (warning)
const SCREEN_BG = '#0a1a22';        // sfondo display
const SCREEN_TEXT = '#44ffcc';      // testo display
const RIVET = '#7a8490';            // rivetti

// ============================================================
// CONFIGURAZIONE AUDIO
// ============================================================
const AUDIO_CONFIG = {
  ambientVolume: 0.028,
  syllableVolume: 0.09,
  startBeepVolume: 0.13,
  endBeepVolume: 0.13,
  enabled: true
};

// ============================================================
// DOM
// ============================================================
const canvas = document.getElementById('avatarCanvas');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');
const container = document.getElementById('avatarContainer');
const uptimeEl = document.getElementById('uptime');
const pwrEl = document.getElementById('pwr');
const tempEl = document.getElementById('temp');

// ============================================================
// STATO
// ============================================================
let isSpeaking = false;
let mouthOpen = 0;
let targetMouthOpen = 0;
let time = 0;
let startTime = Date.now();

// Blink (LED che si abbassa)
let eyeBlink = 0;
let blinkTimer = 0;
let nextBlinkAt = 150 + Math.random() * 200;
let doubleBlink = false;
let doubleBlinkDelay = 0;

// Sbadiglio (LED che lampeggia lento)
let yawnTimer = 0;
let yawnCooldown = 800 + Math.random() * 800;
let yawnActive = 0;
let yawnPhase = 0;

// Micro-smorfie bocca (LED che lampeggia)
let mouthTwitchTimer = 0;
let mouthTwitchNextAt = 120 + Math.random() * 180;
let mouthTwitchActive = 0;
let mouthTwitchPhase = 0;
let mouthTwitchDir = 1;

// Micro-movimenti sopracciglia
let browTwitchTimer = 0;
let browTwitchNextAt = 100 + Math.random() * 200;
let browTwitchActive = 0;
let browTwitchPhase = 0;
let browTwitchAmount = 0;

// Micro-drift capo
let headDriftTimer = 0;
let headDriftNextAt = 90 + Math.random() * 150;
let headDriftTarget = 0;
let headDriftCurrent = 0;

// Dilatazione LED oculari
let pupilScale = 1;
let pupilScaleTarget = 1;
let pupilTimer = 0;
let pupilNextAt = 180 + Math.random() * 240;

// Wander
let wanderActive = false;
let wanderTimer = 0;
let wanderNextAt = 120 + Math.random() * 180;
let wanderTargetX = 0;
let wanderTargetY = 0;
let wanderReturnTimer = 0;

// Saccadi
let saccadeTimer = 0;
let saccadeNextAt = 15 + Math.random() * 25;
let saccadeX = 0, saccadeY = 0;
let saccadeTargetX = 0, saccadeTargetY = 0;

// Riflessione (modalità "standby")
let reflectionTimer = 0;
let reflectionNextAt = 1500 + Math.random() * 1500;
let reflectionActive = 0;
let reflectionPhase = 0;
let reflectionTotalFrames = 180;

// Respirazione (leggero sollevamento del petto/testa)
let breathPhaseA = 0;
let breathPhaseB = 0;
let breathPhaseC = 0;
let breathCycleTimer = 0;
let breathCycleDuration = 180 + Math.random() * 120;
let currentBreathOffset = 0;

// === SPECIFICO ROBOT ===
// Antenna lampeggiante
let antennaPulse = 0;

// LED sparsi sul viso che lampeggiano
let scatteredLeds = [];

// Barre di stato (audio level)
let audioLevelBars = [0, 0, 0, 0, 0, 0, 0, 0];

// Ventola di raffreddamento (rotazione)
let fanAngle = 0;

// Olografico di stato (piccola barra info che appare)
let infoDisplayText = 'STANDBY';
let infoDisplayBlink = 0;

// Sguardo
let eyeTargetX = 0, eyeTargetY = 0;
let eyeCurrentX = 0, eyeCurrentY = 0;
let mouseIsActive = false;
let mouseMovedTimer = 0;

// Emozione
let currentEmotion = { browAngle: 0, browHeight: 0, mouthCurve: 0, eyeOpen: 1, mouthWidth: 80, headTilt: 0 };
let targetEmotion = { ...currentEmotion };

// LED emozione (colore del LED principale)
let ledColor = LED_RED;
let ledColorTarget = LED_RED;
let ledGlow = LED_RED_GLOW;
let ledGlowTarget = LED_RED_GLOW;

const EMOTION_KEYWORDS = {
  felice: ['ciao','benvenuto','grazie','felice','bene','ottimo','grande','bello','amore','contento','evviva','bravo','sorriso','piacere'],
  triste: ['purtroppo','triste','male','problema','difficile','brutto','dispiace','sofferenza','dolore','solo','perdere'],
  arrabbiato: ['attenzione','pericolo','errore','grave','rabbia','basta','no','mai','inaccettabile','sbagliato'],
  sorpreso: ['wow','incredibile','davvero','improvviso','inaspettato','sorpresa','caspita','accidenti','oh']
};
let activeEmotion = 'neutro';

// ============================================================
// WEB AUDIO
// ============================================================
let audioCtx = null;
let ambientOsc = null;
let ambientGain = null;
let ambientFilter = null;

function initAudioContext() {
  if (audioCtx) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  } catch (e) { console.warn('Web Audio non disponibile', e); }
}

function startAmbient() {
  if (!audioCtx || !AUDIO_CONFIG.enabled) return;
  if (ambientOsc) return;
  ambientOsc = audioCtx.createOscillator();
  ambientOsc.type = 'sawtooth';
  ambientOsc.frequency.value = 50;
  ambientGain = audioCtx.createGain();
  ambientGain.gain.value = 0;
  ambientGain.gain.linearRampToValueAtTime(AUDIO_CONFIG.ambientVolume, audioCtx.currentTime + 0.4);
  ambientFilter = audioCtx.createBiquadFilter();
  ambientFilter.type = 'lowpass';
  ambientFilter.frequency.value = 180;
  ambientOsc.connect(ambientFilter);
  ambientFilter.connect(ambientGain);
  ambientGain.connect(audioCtx.destination);
  ambientOsc.start();
}

function stopAmbient() {
  if (!ambientOsc) return;
  const now = audioCtx.currentTime;
  ambientGain.gain.cancelScheduledValues(now);
  ambientGain.gain.linearRampToValueAtTime(0, now + 0.3);
  const osc = ambientOsc;
  const gain = ambientGain;
  ambientOsc = null;
  ambientGain = null;
  ambientFilter = null;
  setTimeout(() => {
    try { osc.stop(); } catch(e){}
    try { osc.disconnect(); } catch(e){}
    try { gain.disconnect(); } catch(e){}
  }, 400);
}

function playBeep(freq, duration, volume, type) {
  if (!audioCtx || !AUDIO_CONFIG.enabled) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type || 'square';
  osc.frequency.value = freq;
  gain.gain.value = 0;
  gain.gain.linearRampToValueAtTime(volume, audioCtx.currentTime + 0.006);
  gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration + 0.05);
}

function playSyllableBeep(syllable) {
  if (!audioCtx || !AUDIO_CONFIG.enabled) return;
  // Beep meccanici, tipo R2-D2
  let freq = 660;
  if (syllable.includes('a')) freq = 550;
  else if (syllable.includes('o')) freq = 440;
  else if (syllable.includes('e')) freq = 620;
  else if (syllable.includes('u')) freq = 330;
  else if (syllable.includes('i')) freq = 880;
  else freq = 300;
  freq += (Math.random() - 0.5) * 100;
  playBeep(freq, 0.04, AUDIO_CONFIG.syllableVolume, 'square');
}

function playStartBeep() {
  if (!audioCtx || !AUDIO_CONFIG.enabled) return;
  playBeep(220, 0.08, AUDIO_CONFIG.startBeepVolume, 'square');
  setTimeout(() => playBeep(440, 0.08, AUDIO_CONFIG.startBeepVolume, 'square'), 80);
  setTimeout(() => playBeep(880, 0.12, AUDIO_CONFIG.startBeepVolume, 'square'), 160);
}

function playEndBeep() {
  if (!audioCtx || !AUDIO_CONFIG.enabled) return;
  playBeep(880, 0.08, AUDIO_CONFIG.endBeepVolume, 'square');
  setTimeout(() => playBeep(440, 0.08, AUDIO_CONFIG.endBeepVolume, 'square'), 80);
  setTimeout(() => playBeep(220, 0.12, AUDIO_CONFIG.endBeepVolume, 'square'), 160);
}

// Suono del servo motore (quando la testa si muove)
function playServoSound() {
  if (!audioCtx || !AUDIO_CONFIG.enabled) return;
  if (Math.random() > 0.05) return;   // raro
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.value = 120;
  osc.frequency.linearRampToValueAtTime(180, audioCtx.currentTime + 0.15);
  gain.gain.value = 0.03;
  gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.2);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.25);
}

// ============================================================
// PARTICELLE (poche, come scintille metalliche)
// ============================================================
let particles = [];
class Particle {
  constructor() { this.reset(); this.y = Math.random() * canvas.height; }
  reset() {
    this.x = Math.random() * canvas.width;
    this.y = canvas.height + 20;
    this.sizeBase = Math.random() * 1.2 + 0.4;
    this.size = this.sizeBase;
    this.speedBase = Math.random() * 0.3 + 0.15;
    this.speed = this.speedBase;
    this.alphaBase = Math.random() * 0.3 + 0.1;
    this.alpha = this.alphaBase;
    this.wobble = Math.random() * Math.PI * 2;
    this.wobbleSpeed = Math.random() * 0.02 + 0.008;
    this.isSpark = Math.random() < 0.3;
  }
  update(intensity) {
    this.speed = this.speedBase * (1 + intensity * 2);
    this.size = this.sizeBase * (1 + intensity * 1.2);
    this.alpha = Math.min(0.7, this.alphaBase * (1 + intensity * 1.5));
    this.wobble += this.wobbleSpeed * (1 + intensity * 1.5);
    this.y -= this.speed;
    this.x += Math.sin(this.wobble) * (0.3 + intensity * 1);
    if (this.y < -20) this.reset();
  }
  draw() {
    ctx.save();
    ctx.globalAlpha = this.alpha;
    if (this.isSpark) {
      // Scintilla (linea verticale breve)
      ctx.strokeStyle = LED_RED;
      ctx.lineWidth = 0.6;
      ctx.shadowBlur = 6;
      ctx.shadowColor = LED_RED;
      ctx.beginPath();
      ctx.moveTo(this.x, this.y);
      ctx.lineTo(this.x, this.y + this.size * 3);
      ctx.stroke();
    } else {
      ctx.fillStyle = METAL_LIGHT;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }
}
for (let i = 0; i < 25; i++) particles.push(new Particle());

// LED sparsi sul viso (per renderlo "vivo")
for (let i = 0; i < 8; i++) {
  scatteredLeds.push({
    x: 0, y: 0,  // verranno posizionati in draw
    angle: Math.random() * Math.PI * 2,
    radius: 120 + Math.random() * 30,
    phase: Math.random() * Math.PI * 2,
    speed: 0.02 + Math.random() * 0.03,
    size: 1.5 + Math.random() * 1.5,
    color: Math.random() < 0.5 ? LED_RED : LED_BLUE
  });
}

// ============================================================
// SILLABE
// ============================================================
function getSyllables(text) {
  const words = text.toLowerCase().match(/[a-zàèéìòù]+/g) || [];
  const result = [];
  const vowels = 'aeiouàèéìòù';
  for (const word of words) {
    let currentSyl = '';
    for (let i = 0; i < word.length; i++) {
      currentSyl += word[i];
      const isVowel = vowels.includes(word[i]);
      const nextIsVowel = i + 1 < word.length && vowels.includes(word[i + 1]);
      if (isVowel && !nextIsVowel) { result.push(currentSyl); currentSyl = ''; }
    }
    if (currentSyl) result.push(currentSyl);
  }
  return result;
}

function extractWords(text) {
  const words = [];
  const regex = /[a-zA-ZàèéìòùÀÈÉÌÒÙ]+/g;
  let m;
  while ((m = regex.exec(text)) !== null) {
    words.push({ word: m[0].toLowerCase(), index: m.index });
  }
  return words;
}

// ============================================================
// VOCI
// ============================================================
let selectedVoice = null;
function pickItalianVoice() {
  const voices = speechSynthesis.getVoices();
  if (!voices.length) return null;
  // Preferisci voci robotiche/mascolili
  let v = voices.find(v => v.lang === 'it-IT' && v.name.toLowerCase().includes('male'));
  if (!v) v = voices.find(v => v.lang === 'it-IT');
  if (!v) v = voices.find(v => v.lang && v.lang.startsWith('it'));
  if (!v) v = voices.find(v => v.lang && v.lang.startsWith('en'));
  return v || voices[0];
}
function loadVoices() {
  const v = pickItalianVoice();
  if (v) { selectedVoice = v; console.log('[Avatar] Voce:', v.name, v.lang); }
}
if ('speechSynthesis' in window) {
  speechSynthesis.onvoiceschanged = loadVoices;
  loadVoices();
}

// ============================================================
// EMOZIONI (LED color cambia)
// ============================================================
function detectEmotionForWord(word) {
  for (const [emotion, keywords] of Object.entries(EMOTION_KEYWORDS)) {
    if (keywords.includes(word)) return emotion;
  }
  return null;
}
function emotionParams(emotion) {
  switch (emotion) {
    case 'felice':    return { browAngle: 0.3, browHeight: -4, mouthCurve: 0.8, eyeOpen: 1.1, mouthWidth: 85, headTilt: 0.02 };
    case 'triste':    return { browAngle: -0.7, browHeight: 6, mouthCurve: -1.0, eyeOpen: 0.7, mouthWidth: 70, headTilt: -0.04 };
    case 'arrabbiato':return { browAngle: -1.3, browHeight: 4, mouthCurve: -0.6, eyeOpen: 0.8, mouthWidth: 80, headTilt: 0 };
    case 'sorpreso':  return { browAngle: 0.6, browHeight: -12, mouthCurve: 0, eyeOpen: 1.5, mouthWidth: 75, headTilt: 0 };
    default:          return { browAngle: 0, browHeight: 0, mouthCurve: 0, eyeOpen: 1, mouthWidth: 80, headTilt: 0 };
  }
}

function updateLedColor(emotion) {
  switch (emotion) {
    case 'felice':
      ledColorTarget = LED_YELLOW;
      ledGlowTarget = 'rgba(255,204,68,0.9)';
      infoDisplayText = 'HAPPY';
      break;
    case 'triste':
      ledColorTarget = LED_BLUE;
      ledGlowTarget = LED_BLUE_GLOW;
      infoDisplayText = 'SAD';
      break;
    case 'arrabbiato':
      ledColorTarget = LED_RED;
      ledGlowTarget = LED_RED_GLOW;
      infoDisplayText = 'ALERT';
      break;
    case 'sorpreso':
      ledColorTarget = '#ff88ff';
      ledGlowTarget = 'rgba(255,136,255,0.9)';
      infoDisplayText = 'SURPRISE';
      break;
    default:
      ledColorTarget = LED_RED;
      ledGlowTarget = LED_RED_GLOW;
      infoDisplayText = isSpeaking ? 'SPEAKING' : 'STANDBY';
  }
}

let wordsInText = [];
let wordCursor = 0;
let emotionHoldFrames = 0;

function processNextWord() {
  if (wordCursor >= wordsInText.length) return;
  const w = wordsInText[wordCursor];
  const detected = detectEmotionForWord(w.word);
  if (detected) {
    activeEmotion = detected;
    emotionHoldFrames = 90;
    updateLedColor(detected);
  }
  wordCursor++;
}

// ============================================================
// BOCCA
// ============================================================
let syllables = [];
let currentSyllableIndex = 0;
let syllableTimer = 0;
let framesPerSyllable = 8;
let lastBeepedSyllable = -1;

function updateMouthAnimation() {
  if (!isSpeaking) {
    targetMouthOpen = 0.02 + Math.abs(Math.sin(time * 0.6)) * 0.03;
    return;
  }
  syllableTimer++;
  if (syllableTimer >= framesPerSyllable) {
    syllableTimer = 0;
    currentSyllableIndex++;
    if (currentSyllableIndex >= syllables.length) currentSyllableIndex = 0;
    if (currentSyllableIndex !== lastBeepedSyllable) {
      lastBeepedSyllable = currentSyllableIndex;
      playSyllableBeep(syllables[currentSyllableIndex] || '');
      // Aggiorna le barre di stato audio
      for (let i = 0; i < audioLevelBars.length; i++) {
        audioLevelBars[i] = Math.random() * 0.8 + 0.2;
      }
    }
    const syl = syllables[currentSyllableIndex] || '';
    framesPerSyllable = 6 + Math.random() * 4 + Math.min(4, syl.length);
  }
  const syl = syllables[currentSyllableIndex] || '';
  let openness = 0.4;
  if (syl.includes('a')) openness = 0.95;
  else if (syl.includes('o')) openness = 0.8;
  else if (syl.includes('e')) openness = 0.65;
  else if (syl.includes('u')) openness = 0.6;
  else if (syl.includes('i')) openness = 0.5;
  else openness = 0.25;
  openness += (Math.random() - 0.5) * 0.1;
  targetMouthOpen = Math.max(0.05, Math.min(1, openness));
}

// ============================================================
// ANIMAZIONI
// ============================================================
function lerp(a, b, t) { return a + (b - a) * t; }

function updateEmotionAnimation() {
  if (emotionHoldFrames > 0) {
    emotionHoldFrames--;
    if (emotionHoldFrames === 0) {
      activeEmotion = 'neutro';
      updateLedColor('neutro');
    }
  }
  const params = emotionParams(activeEmotion);
  Object.keys(params).forEach(k => targetEmotion[k] = params[k]);
  Object.keys(currentEmotion).forEach(k => {
    currentEmotion[k] = lerp(currentEmotion[k], targetEmotion[k], 0.1);
  });
}

function updateBreath() {
  breathPhaseA += 0.018;
  breathPhaseB += 0.037;
  breathPhaseC += 0.008;
  currentBreathOffset = Math.sin(breathPhaseA) * 2 + Math.sin(breathPhaseB) * 0.6 + Math.sin(breathPhaseC) * 0.8;
  breathCycleTimer++;
  if (breathCycleTimer > breathCycleDuration) {
    breathCycleTimer = 0;
    breathCycleDuration = 180 + Math.random() * 180;
  }
}
function getBreathOffset() { return currentBreathOffset; }

function updateBlink() {
  blinkTimer++;
  if (doubleBlink) {
    doubleBlinkDelay++;
    if (doubleBlinkDelay > 15 && doubleBlinkDelay < 22) eyeBlink = 1;
    else if (doubleBlinkDelay >= 22 && doubleBlinkDelay < 28) eyeBlink = 0;
    else if (doubleBlinkDelay >= 28 && doubleBlinkDelay < 35) eyeBlink = 1;
    else if (doubleBlinkDelay >= 35) {
      eyeBlink = 0; doubleBlink = false; doubleBlinkDelay = 0;
      nextBlinkAt = blinkTimer + 150 + Math.random() * 200;
    }
    return;
  }
  if (blinkTimer >= nextBlinkAt) {
    const t = blinkTimer - nextBlinkAt;
    if (t < 3) eyeBlink = t / 3;
    else if (t < 6) eyeBlink = 1;
    else if (t < 10) eyeBlink = 1 - (t - 6) / 4;
    else {
      eyeBlink = 0;
      if (Math.random() < 0.15) { doubleBlink = true; doubleBlinkDelay = 0; }
      else nextBlinkAt = blinkTimer + 150 + Math.random() * 250;
    }
  }
}

function updateYawn() {
  if (isSpeaking) { yawnActive = 0; return; }
  yawnTimer++;
  if (yawnTimer > yawnCooldown && yawnActive === 0) { yawnActive = 0.01; yawnPhase = 0; }
  if (yawnActive > 0) {
    yawnPhase++;
    const totalFrames = 140;
    if (yawnPhase < 45) yawnActive = yawnPhase / 45;
    else if (yawnPhase < 90) yawnActive = 1;
    else if (yawnPhase < totalFrames) yawnActive = 1 - (yawnPhase - 90) / 50;
    else { yawnActive = 0; yawnTimer = 0; yawnCooldown = 900 + Math.random() * 900; }
  }
}

function updateMouthTwitch() {
  if (isSpeaking) {
    mouthTwitchActive = lerp(mouthTwitchActive, 0, 0.15);
    mouthTwitchTimer = 0;
    return;
  }
  mouthTwitchTimer++;
  if (mouthTwitchTimer > mouthTwitchNextAt && mouthTwitchActive < 0.01) {
    mouthTwitchActive = 0.01;
    mouthTwitchPhase = 0;
    mouthTwitchDir = Math.random() < 0.5 ? 1 : -1;
  }
  if (mouthTwitchActive > 0) {
    mouthTwitchPhase++;
    const totalFrames = 45 + Math.random() * 20;
    if (mouthTwitchPhase < totalFrames * 0.35) {
      mouthTwitchActive = mouthTwitchPhase / (totalFrames * 0.35);
    } else if (mouthTwitchPhase < totalFrames * 0.65) {
      mouthTwitchActive = 1;
    } else if (mouthTwitchPhase < totalFrames) {
      mouthTwitchActive = 1 - (mouthTwitchPhase - totalFrames * 0.65) / (totalFrames * 0.35);
    } else {
      mouthTwitchActive = 0;
      mouthTwitchTimer = 0;
      mouthTwitchNextAt = 180 + Math.random() * 300;
    }
  }
}

function updateBrowTwitch() {
  if (isSpeaking) {
    browTwitchActive = lerp(browTwitchActive, 0, 0.15);
    browTwitchAmount = lerp(browTwitchAmount, 0, 0.1);
    return;
  }
  browTwitchTimer++;
  if (browTwitchTimer > browTwitchNextAt && browTwitchActive < 0.01) {
    browTwitchActive = 0.01;
    browTwitchPhase = 0;
  }
  if (browTwitchActive > 0) {
    browTwitchPhase++;
    const totalFrames = 40 + Math.random() * 30;
    if (browTwitchPhase < totalFrames * 0.4) {
      browTwitchActive = browTwitchPhase / (totalFrames * 0.4);
    } else if (browTwitchPhase < totalFrames * 0.6) {
      browTwitchActive = 1;
    } else if (browTwitchPhase < totalFrames) {
      browTwitchActive = 1 - (browTwitchPhase - totalFrames * 0.6) / (totalFrames * 0.4);
    } else {
      browTwitchActive = 0;
      browTwitchTimer = 0;
      browTwitchNextAt = 150 + Math.random() * 250;
    }
  }
  const targetAmount = browTwitchActive * (2 + Math.random() * 2);
  browTwitchAmount = lerp(browTwitchAmount, targetAmount, 0.15);
}

function updateHeadDrift() {
  if (isSpeaking) {
    headDriftTarget = 0;
    headDriftCurrent = lerp(headDriftCurrent, 0, 0.08);
    return;
  }
  headDriftTimer++;
  if (headDriftTimer > headDriftNextAt) {
    headDriftTarget = (Math.random() - 0.5) * 0.06;
    // Occasionali micro-rotazioni meccaniche
    if (Math.random() < 0.3) {
      headDriftTarget *= 2.5;
      playServoSound();
    }
    headDriftTimer = 0;
    headDriftNextAt = 120 + Math.random() * 200;
  }
  headDriftCurrent = lerp(headDriftCurrent, headDriftTarget, 0.03);
}

function updatePupilDilation() {
  pupilTimer++;
  if (pupilTimer > pupilNextAt) {
    pupilScaleTarget = 0.9 + Math.random() * 0.25;
    pupilTimer = 0;
    pupilNextAt = 120 + Math.random() * 240;
  }
  pupilScale = lerp(pupilScale, pupilScaleTarget, 0.02);
}

function updateWander() {
  if (isSpeaking) { wanderActive = false; return; }
  if (mouseIsActive) { wanderActive = false; return; }
  wanderTimer++;
  if (wanderTimer > wanderNextAt) {
    wanderTargetX = (Math.random() - 0.5) * 10;
    wanderTargetY = (Math.random() - 0.5) * 6;
    wanderTimer = 0;
    wanderNextAt = 90 + Math.random() * 180;
    wanderActive = true;
    wanderReturnTimer = 0;
  }
  if (wanderActive) {
    wanderReturnTimer++;
    if (wanderReturnTimer > 120) {
      wanderTargetX = 0; wanderTargetY = 0;
      wanderActive = false;
    }
  }
}

function updateSaccades() {
  if (isSpeaking) {
    saccadeX = lerp(saccadeX, 0, 0.2);
    saccadeY = lerp(saccadeY, 0, 0.2);
    return;
  }
  saccadeTimer++;
  if (saccadeTimer > saccadeNextAt) {
    saccadeTargetX = (Math.random() - 0.5) * 2;
    saccadeTargetY = (Math.random() - 0.5) * 1.5;
    saccadeTimer = 0;
    saccadeNextAt = 15 + Math.random() * 25;
  }
  saccadeX = lerp(saccadeX, saccadeTargetX, 0.4);
  saccadeY = lerp(saccadeY, saccadeTargetY, 0.4);
}

function updateReflection() {
  if (isSpeaking) { reflectionActive = 0; reflectionTimer = 0; return; }
  reflectionTimer++;
  if (reflectionTimer > reflectionNextAt && reflectionActive === 0) {
    reflectionActive = 0.01;
    reflectionPhase = 0;
    infoDisplayText = 'STANDBY';
  }
  if (reflectionActive > 0) {
    reflectionPhase++;
    const totalFrames = reflectionTotalFrames;
    if (reflectionPhase < totalFrames * 0.2) {
      reflectionActive = reflectionPhase / (totalFrames * 0.2);
    } else if (reflectionPhase < totalFrames * 0.7) {
      reflectionActive = 1;
      infoDisplayText = 'STANDBY';
    } else if (reflectionPhase < totalFrames) {
      reflectionActive = 1 - (reflectionPhase - totalFrames * 0.7) / (totalFrames * 0.3);
    } else {
      reflectionActive = 0;
      reflectionTimer = 0;
      reflectionNextAt = 1500 + Math.random() * 1500;
    }
  }
}

document.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  const ccx = rect.left + rect.width / 2;
  const ccy = rect.top + rect.height / 2;
  const dx = e.clientX - ccx, dy = e.clientY - ccy;
  const dist = Math.sqrt(dx*dx + dy*dy);
  const maxOffset = 6;
  if (dist > 0) {
    const factor = Math.min(1, dist / 400);
    eyeTargetX = (dx / dist) * maxOffset * factor;
    eyeTargetY = (dy / dist) * maxOffset * factor;
  }
  mouseIsActive = true;
  mouseMovedTimer = 0;
});

function updateGaze() {
  mouseMovedTimer++;
  if (mouseMovedTimer > 180) mouseIsActive = false;
  if (isSpeaking) {
    eyeTargetX = Math.sin(time * 0.5) * 1.5;
    eyeTargetY = Math.sin(time * 0.7) * 1.0;
  } else if (mouseIsActive) {
    // già aggiornato
  } else if (wanderActive) {
    eyeTargetX = wanderTargetX;
    eyeTargetY = wanderTargetY;
  } else {
    eyeTargetX = lerp(eyeTargetX, 0, 0.03);
    eyeTargetY = lerp(eyeTargetY, 0, 0.03);
  }
  eyeCurrentX = lerp(eyeCurrentX, eyeTargetX, 0.08);
  eyeCurrentY = lerp(eyeCurrentY, eyeTargetY, 0.08);
}

// === SPECIFICO ROBOT ===
function updateAntenna() {
  antennaPulse += 0.08;
}

function updateScatteredLeds() {
  scatteredLeds.forEach(led => {
    led.phase += led.speed;
  });
}

function updateAudioBars() {
  // Le barre decadono verso 0
  for (let i = 0; i < audioLevelBars.length; i++) {
    audioLevelBars[i] *= 0.85;
    if (audioLevelBars[i] < 0.05) audioLevelBars[i] = 0;
  }
}

function updateFan() {
  fanAngle += 0.15;
  if (fanAngle > Math.PI * 2) fanAngle -= Math.PI * 2;
}

function updateLedColorAnimation() {
  // Interpola verso il colore target
  ledColor = lerpColor(ledColor, ledColorTarget, 0.08);
  ledGlow = ledGlowTarget;
}

function lerpColor(a, b, t) {
  const pa = hexToRgb(a);
  const pb = hexToRgb(b);
  if (!pa || !pb) return a;
  const r = Math.round(lerp(pa.r, pb.r, t));
  const g = Math.round(lerp(pa.g, pb.g, t));
  const bl = Math.round(lerp(pa.b, pb.b, t));
  return `rgb(${r},${g},${bl})`;
}

function hexToRgb(hex) {
  if (hex.startsWith('rgb')) {
    const m = hex.match(/\d+/g);
    return { r: +m[0], g: +m[1], b: +m[2] };
  }
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return { r, g, b };
}

function updateUptime() {
  const elapsed = Math.floor((Date.now() - startTime) / 1000);
  const m = String(Math.floor(elapsed / 60)).padStart(2, '0');
  const s = String(elapsed % 60).padStart(2, '0');
  uptimeEl.textContent = m + ':' + s;
}
setInterval(updateUptime, 1000);

// PWR e TEMP che oscillano
setInterval(() => {
  pwrEl.textContent = Math.floor(95 + Math.random() * 5);
  tempEl.textContent = Math.floor(40 + Math.random() * 8);
}, 1500);

// ============================================================
// DISEGNO — ROBOT MECCANICO
// ============================================================
function drawAvatar() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  time += 0.02;

  updateMouthAnimation();
  updateEmotionAnimation();
  updateBreath();
  updateBlink();
  updateYawn();
  updateMouthTwitch();
  updateBrowTwitch();
  updateHeadDrift();
  updatePupilDilation();
  updateWander();
  updateSaccades();
  updateReflection();
  updateGaze();
  updateAntenna();
  updateScatteredLeds();
  updateAudioBars();
  updateFan();
  updateLedColorAnimation();

  const baseIntensity = 0.15;
  const speakIntensity = isSpeaking ? Math.min(1, 0.3 + mouthOpen * 0.7) : 0;
  const intensity = Math.max(baseIntensity, speakIntensity);
  particles.forEach(p => { p.update(intensity); p.draw(); });

  const cx = canvas.width / 2;
  const cy = canvas.height / 2 + getBreathOffset();

  // Trasformazioni testa
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(currentEmotion.headTilt + headDriftCurrent);
  ctx.translate(-cx, -cy);

  // 1. BASE / COLLO MECCANICO
  drawNeckMech(cx, cy);

  // 2. TESTA (pannello principale)
  drawHeadMech(cx, cy);

  // 3. VITI ai lati della testa
  drawSideScrews(cx, cy);

  // 4. ANTENNA
  drawAntenna(cx, cy);

  // 5. DISPLAY FRONTALE (piccolo schermo sulla fronte)
  drawForeheadDisplay(cx, cy);

  // 6. SOPRACCIGLIA (LED bar)
  const eyeY = cy - 20;
  const eyeOffsetX = 62;
  const reflectionBrowOffset = reflectionActive * 2;
  drawBrowLed(cx - eyeOffsetX, eyeY - 55 - reflectionBrowOffset, 1);
  drawBrowLed(cx + eyeOffsetX, eyeY - 55 - reflectionBrowOffset, -1);

  // 7. OCCHI (fotorecettori)
  const baseEyeRadius = 24;
  const reflectionEyeFactor = 1 - reflectionActive * 0.2;
  const eyeRadius = baseEyeRadius * currentEmotion.eyeOpen * reflectionEyeFactor;
  drawEyeRobot(cx - eyeOffsetX, eyeY, eyeRadius, 1);
  drawEyeRobot(cx + eyeOffsetX, eyeY, eyeRadius, -1);

  // 8. NASO (piccolo triangolo)
  drawNoseMech(cx, cy, eyeY);

  // 9. GUANCE con pannelli
  drawCheeks(cx, cy);

  // 10. BOCCA (griglia speaker)
  drawMouthRobot(cx, cy + 75);

  // 11. LED sparsi
  drawScatteredLeds(cx, cy);

  // 12. VENTOLA di raffreddamento
  drawFan(cx, cy);

  // 13. Barre audio di stato (a lato)
  drawAudioBars(cx, cy);

  ctx.restore();
}

// === COLLO MECCANICO ===
function drawNeckMech(cx, cy) {
  ctx.save();
  // Base del collo
  const grad = ctx.createLinearGradient(cx - 50, 0, cx + 50, 0);
  grad.addColorStop(0, METAL_DARK);
  grad.addColorStop(0.5, METAL_MID);
  grad.addColorStop(1, METAL_DARK);
  ctx.fillStyle = grad;
  ctx.strokeStyle = METAL_EDGE;
  ctx.lineWidth = 2;

  // Collo trapezoidale
  ctx.beginPath();
  ctx.moveTo(cx - 50, cy + 100);
  ctx.lineTo(cx - 70, cy + 220);
  ctx.lineTo(cx + 70, cy + 220);
  ctx.lineTo(cx + 50, cy + 100);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // Anelli meccanici
  ctx.strokeStyle = METAL_SHADOW;
  ctx.lineWidth = 1.5;
  for (let i = 0; i < 4; i++) {
    const y = cy + 120 + i * 25;
    const w = 55 + i * 5;
    ctx.beginPath();
    ctx.moveTo(cx - w, y);
    ctx.lineTo(cx + w, y);
    ctx.stroke();
  }

  // LED sul collo (indicatori di stato)
  ctx.fillStyle = ledColor;
  ctx.shadowBlur = 12;
  ctx.shadowColor = ledGlow;
  ctx.beginPath();
  ctx.arc(cx, cy + 160, 3, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(cx - 20, cy + 160, 2, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(cx + 20, cy + 160, 2, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

// === TESTA MECCANICA ===
function drawHeadMech(cx, cy) {
  ctx.save();

  // Pannello principale (forma a esagono arrotondato)
  const grad = ctx.createLinearGradient(cx - 120, cy - 120, cx + 120, cy + 120);
  grad.addColorStop(0, METAL_LIGHT);
  grad.addColorStop(0.4, METAL_MID);
  grad.addColorStop(1, METAL_DARK);

  ctx.fillStyle = grad;
  ctx.strokeStyle = METAL_EDGE;
  ctx.lineWidth = 3;
  ctx.shadowBlur = 15;
  ctx.shadowColor = 'rgba(0,0,0,0.6)';

  // Forma testa: più quadrata, tipo casco
  const headW = 115;
  const headH = 135;
  ctx.beginPath();
  ctx.moveTo(cx - headW, cy - headH + 30);
  ctx.quadraticCurveTo(cx - headW, cy - headH, cx - headW + 30, cy - headH);
  ctx.lineTo(cx + headW - 30, cy - headH);
  ctx.quadraticCurveTo(cx + headW, cy - headH, cx + headW, cy - headH + 30);
  ctx.lineTo(cx + headW, cy + headH - 40);
  ctx.quadraticCurveTo(cx + headW, cy + headH, cx + headW - 30, cy + headH);
  ctx.lineTo(cx - headW + 30, cy + headH);
  ctx.quadraticCurveTo(cx - headW, cy + headH, cx - headW, cy + headH - 40);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // Pannello frontale (più chiaro al centro)
  ctx.fillStyle = 'rgba(255,255,255,0.08)';
  ctx.beginPath();
  ctx.moveTo(cx - headW + 15, cy - headH + 45);
  ctx.lineTo(cx + headW - 15, cy - headH + 45);
  ctx.lineTo(cx + headW - 15, cy + headH - 50);
  ctx.lineTo(cx - headW + 15, cy + headH - 50);
  ctx.closePath();
  ctx.fill();

  // Linee di pannellatura (giunzioni)
  ctx.strokeStyle = METAL_SHADOW;
  ctx.lineWidth = 1;
  ctx.globalAlpha = 0.6;

  // Linea orizzontale sopra gli occhi
  ctx.beginPath();
  ctx.moveTo(cx - headW + 15, cy - 70);
  ctx.lineTo(cx + headW - 15, cy - 70);
  ctx.stroke();

  // Linea sotto gli occhi
  ctx.beginPath();
  ctx.moveTo(cx - headW + 15, cy + 30);
  ctx.lineTo(cx + headW - 15, cy + 30);
  ctx.stroke();

  // Linea verticale centrale (dalla fronte al mento)
  ctx.globalAlpha = 0.3;
  ctx.beginPath();
  ctx.moveTo(cx, cy - headH + 45);
  ctx.lineTo(cx, cy + headH - 50);
  ctx.stroke();

  ctx.globalAlpha = 1;

  // Rivetti/ viti ai 4 angoli
  drawRivet(cx - headW + 18, cy - headH + 18);
  drawRivet(cx + headW - 18, cy - headH + 18);
  drawRivet(cx - headW + 18, cy + headH - 18);
  drawRivet(cx + headW - 18, cy + headH - 18);

  ctx.restore();
}

function drawRivet(x, y) {
  ctx.save();
  // Cerchio base
  const grad = ctx.createRadialGradient(x - 1, y - 1, 0, x, y, 4);
  grad.addColorStop(0, METAL_LIGHT);
  grad.addColorStop(1, METAL_DARK);
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(x, y, 4, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = METAL_EDGE;
  ctx.lineWidth = 1;
  ctx.stroke();
  // Croce (testa della vite)
  ctx.strokeStyle = METAL_SHADOW;
  ctx.lineWidth = 0.8;
  ctx.beginPath();
  ctx.moveTo(x - 2.5, y);
  ctx.lineTo(x + 2.5, y);
  ctx.moveTo(x, y - 2.5);
  ctx.lineTo(x, y + 2.5);
  ctx.stroke();
  ctx.restore();
}

// === VITI LATERALI ===
function drawSideScrews(cx, cy) {
  ctx.save();
  const headW = 115;
  for (let i = 0; i < 3; i++) {
    const y = cy - 80 + i * 60;
    drawRivet(cx - headW - 8, y);
    drawRivet(cx + headW + 8, y);
  }
  ctx.restore();
}

// === ANTENNA ===
function drawAntenna(cx, cy) {
  ctx.save();
  const headW = 115;
  const headH = 135;
  const baseX = cx + headW - 15;
  const baseY = cy - headH + 15;

  // Asta dell'antenna
  ctx.strokeStyle = METAL_DARK;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(baseX, baseY);
  ctx.lineTo(baseX + 25, baseY - 50);
  ctx.stroke();

  // Punta con LED pulsante
  const tipX = baseX + 25;
  const tipY = baseY - 50;
  const pulse = 0.7 + Math.sin(antennaPulse) * 0.3;

  ctx.fillStyle = ledColor;
  ctx.globalAlpha = pulse;
  ctx.shadowBlur = 20;
  ctx.shadowColor = ledGlow;
  ctx.beginPath();
  ctx.arc(tipX, tipY, 4, 0, Math.PI * 2);
  ctx.fill();

  // Alone più grande
  ctx.globalAlpha = pulse * 0.4;
  ctx.beginPath();
  ctx.arc(tipX, tipY, 8, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

// === DISPLAY FRONTALE ===
function drawForeheadDisplay(cx, cy) {
  ctx.save();
  const dispW = 60;
  const dispH = 18;
  const dispX = cx - dispW / 2;
  const dispY = cy - 100;

  // Sfondo display
  ctx.fillStyle = SCREEN_BG;
  ctx.strokeStyle = METAL_SHADOW;
  ctx.lineWidth = 1.5;
  ctx.fillRect(dispX, dispY, dispW, dispH);
  ctx.strokeRect(dispX, dispY, dispW, dispH);

  // Testo display
  ctx.fillStyle = SCREEN_TEXT;
  ctx.font = 'bold 9px Courier New';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  // Blink del testo ogni tanto
  infoDisplayBlink += 0.1;
  const showText = Math.sin(infoDisplayBlink) > -0.8;
  if (showText) {
    ctx.fillText(infoDisplayText, cx, dispY + dispH / 2 + 1);
  }

  // Bordo luminoso
  ctx.strokeStyle = SCREEN_TEXT;
  ctx.globalAlpha = 0.4;
  ctx.lineWidth = 1;
  ctx.strokeRect(dispX - 1, dispY - 1, dispW + 2, dispH + 2);

  ctx.restore();
}

// === SOPRACCIGLIA (LED bar) ===
function drawBrowLed(x, y, side) {
  const w = 44;
  const angle = currentEmotion.browAngle * 0.3;
  const offsetY = currentEmotion.browHeight - browTwitchAmount;
  const reflectAngle = reflectionActive * -0.1 * side;
  const finalAngle = angle + reflectAngle;

  ctx.save();
  const innerX = x - side * w / 2;
  const outerX = x + side * w / 2;
  const innerY = y + offsetY + finalAngle * w * 0.5;
  const outerY = y + offsetY - finalAngle * w * 0.5;

  // Barra LED
  ctx.strokeStyle = METAL_SHADOW;
  ctx.lineWidth = 6;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(innerX, innerY);
  ctx.lineTo(outerX, outerY);
  ctx.stroke();

  // LED interno che brilla
  ctx.strokeStyle = ledColor;
  ctx.lineWidth = 3;
  ctx.shadowBlur = 12;
  ctx.shadowColor = ledGlow;
  ctx.beginPath();
  ctx.moveTo(innerX, innerY);
  ctx.lineTo(outerX, outerY);
  ctx.stroke();

  ctx.restore();
}

// === OCCHIO ROBOT (fotorecettore) ===
function drawEyeRobot(x, y, radius, side) {
  ctx.save();

  // Base dell'occhio (anello metallico)
  const ringGrad = ctx.createRadialGradient(x, y, radius * 0.3, x, y, radius);
  ringGrad.addColorStop(0, METAL_LIGHT);
  ringGrad.addColorStop(0.7, METAL_MID);
  ringGrad.addColorStop(1, METAL_SHADOW);

  ctx.fillStyle = ringGrad;
  ctx.beginPath();
  ctx.arc(x, y, radius * 1.1, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = METAL_EDGE;
  ctx.lineWidth = 2;
  ctx.stroke();

  // Viti sull'anello
  for (let i = 0; i < 4; i++) {
    const angle = (i / 4) * Math.PI * 2 + Math.PI / 4;
    drawRivet(x + Math.cos(angle) * radius * 1.05, y + Math.sin(angle) * radius * 1.05);
  }

  // Interno occhio scuro
  ctx.fillStyle = '#0a0808';
  ctx.beginPath();
  ctx.arc(x, y, radius * 0.9, 0, Math.PI * 2);
  ctx.fill();

  // Se chiuso (blink), disegna solo una linea LED
  if (eyeBlink > 0.5) {
    ctx.strokeStyle = ledColor;
    ctx.lineWidth = 2.5;
    ctx.shadowBlur = 15;
    ctx.shadowColor = ledGlow;
    ctx.beginPath();
    ctx.moveTo(x - radius * 0.7, y);
    ctx.lineTo(x + radius * 0.7, y);
    ctx.stroke();
  } else {
    // LED centrale (iride)
    const pupilX = x + eyeCurrentX + saccadeX + Math.sin(time * 0.7) * 1.2;
    const pupilY = y + eyeCurrentY + saccadeY + Math.sin(time * 1.1) * 1.2;
    const ledRadius = radius * 0.5 * pupilScale;

    // Glow del LED
    ctx.fillStyle = ledColor;
    ctx.shadowBlur = 20;
    ctx.shadowColor = ledGlow;
    ctx.beginPath();
    ctx.arc(pupilX, pupilY, ledRadius, 0, Math.PI * 2);
    ctx.fill();

    // Alone luminoso più ampio
    ctx.globalAlpha = 0.3;
    ctx.beginPath();
    ctx.arc(pupilX, pupilY, ledRadius * 1.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;

    // Punto luminoso centrale (riflesso)
    ctx.fillStyle = '#ffffff';
    ctx.shadowBlur = 10;
    ctx.shadowColor = '#ffffff';
    ctx.beginPath();
    ctx.arc(pupilX - ledRadius * 0.2, pupilY - ledRadius * 0.2, ledRadius * 0.25, 0, Math.PI * 2);
    ctx.fill();
  }

  // Overlay blink parziale (palpebra che scende)
  if (eyeBlink > 0 && eyeBlink <= 0.5) {
    ctx.fillStyle = METAL_MID;
    const lidY = y - radius * 0.9 + radius * 1.8 * eyeBlink;
    ctx.beginPath();
    ctx.rect(x - radius * 1.1, y - radius * 1.1, radius * 2.2, lidY - (y - radius * 1.1));
    ctx.fill();
    ctx.strokeStyle = METAL_EDGE;
    ctx.lineWidth = 1;
    ctx.strokeRect(x - radius * 1.1, y - radius * 1.1, radius * 2.2, lidY - (y - radius * 1.1));
  }

  ctx.restore();
}

// === NASO MECCANICO ===
function drawNoseMech(cx, cy, eyeY) {
  ctx.save();
  const noseY = eyeY + 45;

  // Piccolo triangolo metallico
  ctx.fillStyle = METAL_DARK;
  ctx.strokeStyle = METAL_EDGE;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(cx, noseY - 8);
  ctx.lineTo(cx - 8, noseY + 8);
  ctx.lineTo(cx + 8, noseY + 8);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // LED rosso sotto
  ctx.fillStyle = ledColor;
  ctx.shadowBlur = 8;
  ctx.shadowColor = ledGlow;
  ctx.beginPath();
  ctx.arc(cx, noseY + 12, 2, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

// === GUANCE (pannelli con viti) ===
function drawCheeks(cx, cy) {
  ctx.save();
  const headW = 115;

  // Guancia sinistra
  ctx.fillStyle = METAL_DARK;
  ctx.strokeStyle = METAL_EDGE;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.rect(cx - headW + 10, cy + 20, 30, 40);
  ctx.fill();
  ctx.stroke();

  // Viti
  drawRivet(cx - headW + 15, cy + 25);
  drawRivet(cx - headW + 35, cy + 25);
  drawRivet(cx - headW + 15, cy + 55);
  drawRivet(cx - headW + 35, cy + 55);

  // Guancia destra
  ctx.fillStyle = METAL_DARK;
  ctx.beginPath();
  ctx.rect(cx + headW - 40, cy + 20, 30, 40);
  ctx.fill();
  ctx.stroke();

  drawRivet(cx + headW - 35, cy + 25);
  drawRivet(cx + headW - 15, cy + 25);
  drawRivet(cx + headW - 35, cy + 55);
  drawRivet(cx + headW - 15, cy + 55);

  ctx.restore();
}

// === BOCCA (griglia speaker) ===
function drawMouthRobot(x, y) {
  ctx.save();

  const yawnOpen = yawnActive * 0.9;
  const combinedOpen = Math.max(mouthOpen, yawnOpen);
  const mouthWidth = currentEmotion.mouthWidth;
  const mouthHeight = 30;
  const reflectionCurve = reflectionActive * -0.3;

  // Base della griglia speaker
  ctx.fillStyle = METAL_DARK;
  ctx.strokeStyle = METAL_EDGE;
  ctx.lineWidth = 2;
  ctx.beginPath();
  roundRect(ctx, x - mouthWidth / 2 - 5, y - mouthHeight / 2 - 5, mouthWidth + 10, mouthHeight + 10, 6);
  ctx.fill();
  ctx.stroke();

  // Linee della griglia (speaker)
  ctx.strokeStyle = METAL_SHADOW;
  ctx.lineWidth = 1.5;
  const gridLines = 5;
  for (let i = 0; i < gridLines; i++) {
    const ly = y - mouthHeight / 2 + (mouthHeight / (gridLines - 1)) * i;
    ctx.beginPath();
    ctx.moveTo(x - mouthWidth / 2, ly);
    ctx.lineTo(x + mouthWidth / 2, ly);
    ctx.stroke();
  }

  // LED che si accendono in sequenza quando parla
  if (combinedOpen > 0.15 || yawnActive > 0) {
    const litCount = Math.floor(combinedOpen * gridLines);
    for (let i = 0; i < litCount; i++) {
      const ly = y - mouthHeight / 2 + (mouthHeight / (gridLines - 1)) * i + 1;
      ctx.strokeStyle = ledColor;
      ctx.lineWidth = 1.5;
      ctx.shadowBlur = 12;
      ctx.shadowColor = ledGlow;
      ctx.beginPath();
      ctx.moveTo(x - mouthWidth / 2 + 2, ly);
      ctx.lineTo(x + mouthWidth / 2 - 2, ly);
      ctx.stroke();
    }
  }

  // Cornice luminosa attorno alla bocca
  ctx.strokeStyle = ledColor;
  ctx.globalAlpha = combinedOpen > 0.1 ? 0.8 : 0.3;
  ctx.lineWidth = 1.5;
  ctx.shadowBlur = 10;
  ctx.shadowColor = ledGlow;
  ctx.beginPath();
  roundRect(ctx, x - mouthWidth / 2 - 5, y - mouthHeight / 2 - 5, mouthWidth + 10, mouthHeight + 10, 6);
  ctx.stroke();
  ctx.globalAlpha = 1;

  // LED agli angoli della bocca
  ctx.fillStyle = ledColor;
  ctx.shadowBlur = 10;
  ctx.shadowColor = ledGlow;
  ctx.beginPath(); ctx.arc(x - mouthWidth / 2 - 3, y, 2, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(x + mouthWidth / 2 + 3, y, 2, 0, Math.PI * 2); ctx.fill();

  ctx.restore();
}

// === LED SPARSI ===
function drawScatteredLeds(cx, cy) {
  ctx.save();
  scatteredLeds.forEach(led => {
    const x = cx + Math.cos(led.angle + led.phase * 0.1) * led.radius;
    const y = cy + Math.sin(led.angle + led.phase * 0.1) * led.radius * 0.8;
    const brightness = 0.4 + Math.abs(Math.sin(led.phase)) * 0.6;

    ctx.globalAlpha = brightness * 0.7;
    ctx.fillStyle = led.color;
    ctx.shadowBlur = 8;
    ctx.shadowColor = led.color;
    ctx.beginPath();
    ctx.arc(x, y, led.size, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.restore();
}

// === VENTOLA ===
function drawFan(cx, cy) {
  ctx.save();
  const headW = 115;
  const headH = 135;
  const fanX = cx - headW + 25;
  const fanY = cy - headH + 100;

  // Base della ventola
  ctx.fillStyle = METAL_DARK;
  ctx.strokeStyle = METAL_EDGE;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(fanX, fanY, 14, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  // Lame rotanti
  ctx.fillStyle = METAL_MID;
  ctx.translate(fanX, fanY);
  ctx.rotate(fanAngle);
  for (let i = 0; i < 5; i++) {
    ctx.save();
    ctx.rotate((i / 5) * Math.PI * 2);
    ctx.beginPath();
    ctx.ellipse(0, -7, 3, 7, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // Centro
  ctx.rotate(-fanAngle);
  ctx.fillStyle = METAL_LIGHT;
  ctx.beginPath();
  ctx.arc(0, 0, 3, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

// === BARRE AUDIO ===
function drawAudioBars(cx, cy) {
  ctx.save();
  const headW = 115;
  const barsX = cx + headW + 20;
  const barsY = cy - 60;
  const barW = 5;
  const barMaxH = 20;
  const barGap = 2;

  // Cornice
  ctx.fillStyle = METAL_DARK;
  ctx.strokeStyle = METAL_EDGE;
  ctx.lineWidth = 1;
  ctx.fillRect(barsX - 3, barsY - 3, barW + 6, barMaxH + 6);
  ctx.strokeRect(barsX - 3, barsY - 3, barW + 6, barMaxH + 6);

  // Barra che rappresenta il livello audio
  const level = audioLevelBars[0] || 0;
  const barH = level * barMaxH;

  // Gradiente della barra (dal basso)
  const grad = ctx.createLinearGradient(0, barsY + barMaxH, 0, barsY);
  grad.addColorStop(0, LED_BLUE);
  grad.addColorStop(0.6, '#ffcc44');
  grad.addColorStop(1, LED_RED);
  ctx.fillStyle = grad;
  ctx.shadowBlur = 8;
  ctx.shadowColor = ledGlow;

  ctx.fillRect(barsX, barsY + barMaxH - barH, barW, barH);

  // Etichetta "LVL"
  ctx.fillStyle = METAL_LIGHT;
  ctx.font = 'bold 8px Courier New';
  ctx.textAlign = 'center';
  ctx.fillText('LVL', barsX + barW / 2, barsY + barMaxH + 12);

  ctx.restore();
}

// Helper: rettangolo con angoli arrotondati
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

// ============================================================
// LOOP
// ============================================================
function renderLoop() {
  drawAvatar();
  requestAnimationFrame(renderLoop);
}

// ============================================================
// SINTESI VOCALE + TOGGLE
// ============================================================
let utterance = null;
let fallbackWordInterval = null;

function updateStatus(text, cls) {
  statusEl.innerText = text;
  statusEl.classList.remove('speaking', 'done');
  if (cls) statusEl.classList.add(cls);
}

function speak() {
  if (!('speechSynthesis' in window)) {
    updateStatus('sintesi vocale non supportata');
    return;
  }
  window.speechSynthesis.cancel();
  if (fallbackWordInterval) { clearInterval(fallbackWordInterval); fallbackWordInterval = null; }

  initAudioContext();
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

  syllables = getSyllables(TESTO);
  wordsInText = extractWords(TESTO);
  currentSyllableIndex = 0;
  syllableTimer = 0;
  framesPerSyllable = 8;
  wordCursor = 0;
  activeEmotion = 'neutro';
  emotionHoldFrames = 0;
  lastBeepedSyllable = -1;
  infoDisplayText = 'SPEAKING';

  utterance = new SpeechSynthesisUtterance(TESTO);
  utterance.lang = 'it-IT';
  utterance.rate = 0.9;
  utterance.pitch = 0.85;   // pitch basso, robotico
  utterance.volume = 1;
  if (selectedVoice) utterance.voice = selectedVoice;

  utterance.onstart = () => {
    isSpeaking = true;
    container.classList.add('speaking');
    updateStatus('clicca per fermare', 'speaking');
    playStartBeep();
    startAmbient();
  };

  utterance.onboundary = (e) => {
    if (e.name === 'word') processNextWord();
  };

  utterance.onend = () => {
    isSpeaking = false;
    targetMouthOpen = 0;
    activeEmotion = 'neutro';
    emotionHoldFrames = 0;
    updateLedColor('neutro');
    infoDisplayText = 'STANDBY';
    container.classList.remove('speaking');
    updateStatus('fine — clicca per riascoltare', 'done');
    playEndBeep();
    stopAmbient();
    if (fallbackWordInterval) { clearInterval(fallbackWordInterval); fallbackWordInterval = null; }
  };

  utterance.onerror = (e) => {
    console.error(e);
    isSpeaking = false;
    targetMouthOpen = 0;
    activeEmotion = 'neutro';
    emotionHoldFrames = 0;
    updateLedColor('neutro');
    infoDisplayText = 'ERROR';
    container.classList.remove('speaking');
    updateStatus('errore — clicca per riprovare', 'done');
    stopAmbient();
    if (fallbackWordInterval) { clearInterval(fallbackWordInterval); fallbackWordInterval = null; }
  };

  fallbackWordInterval = setInterval(() => {
    if (!isSpeaking) { clearInterval(fallbackWordInterval); fallbackWordInterval = null; return; }
    processNextWord();
  }, 350);

  speechSynthesis.speak(utterance);
}

function stopSpeaking() {
  speechSynthesis.cancel();
  if (fallbackWordInterval) { clearInterval(fallbackWordInterval); fallbackWordInterval = null; }
  isSpeaking = false;
  targetMouthOpen = 0;
  activeEmotion = 'neutro';
  emotionHoldFrames = 0;
  updateLedColor('neutro');
  infoDisplayText = 'STANDBY';
  container.classList.remove('speaking');
  updateStatus('clicca o premi un tasto');
  stopAmbient();
}

function toggleSpeech() {
  if (isSpeaking) stopSpeaking();
  else speak();
}

document.body.addEventListener('click', toggleSpeech);
document.body.addEventListener('touchstart', function(e) {
  e.preventDefault();
  toggleSpeech();
}, { passive: false });

document.addEventListener('keydown', (e) => {
  if (e.key === ' ' || e.key === 'Enter') {
    e.preventDefault();
    toggleSpeech();
  } else if (e.key === 'Escape') {
    if (isSpeaking) stopSpeaking();
  }
});

// ============================================================
// AVVIO
// ============================================================
renderLoop();
updateUptime();
</script>
