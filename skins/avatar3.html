<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Talking Avatar - Radar</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background-color: #000800;
    color: #00ff66;
    font-family: 'Courier New', Courier, monospace;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    background-image:
      radial-gradient(circle at 50% 50%, rgba(0,255,102,0.10) 0%, transparent 70%);
    cursor: pointer;
    position: relative;
  }
  /* Scanline CRT verde */
  .crt-overlay {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    background:
      linear-gradient(rgba(0,0,0,0) 50%, rgba(0,40,10,0.35) 50%),
      linear-gradient(90deg, rgba(0,255,80,0.05), rgba(0,255,100,0.02), rgba(0,200,80,0.05));
    background-size: 100% 4px, 6px 100%;
    pointer-events: none; z-index: 9999;
    animation: flicker 0.15s infinite;
  }
  @keyframes flicker { 0%{opacity:.96} 50%{opacity:.88} 100%{opacity:.96} }

  /* Vignette + curvatura schermo radar */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,0.85) 100%);
    pointer-events: none;
    z-index: 9998;
  }

  .avatar-container {
    position: relative; width: 600px; height: 600px;
    display: flex; justify-content: center; align-items: center;
    flex-shrink: 0;
    pointer-events: none;
    z-index: 1;
  }
  canvas { display: block; }

  .status {
    position: fixed;
    bottom: 60px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 13px; color: #00ff66; text-transform: uppercase;
    letter-spacing: 4px;
    text-shadow: 0 0 10px #00ff66, 0 0 3px #aaffaa;
    text-align: center;
    pointer-events: none;
    animation: breathe 2.5s ease-in-out infinite;
    z-index: 10;
  }
  @keyframes breathe {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }
  .status.speaking { animation: none; opacity: 1; color: #88ffaa; }
  .status.done { animation: none; opacity: 0.45; }
</style>
</head>
<body>
<div class="crt-overlay"></div>

<div class="avatar-container" id="avatarContainer">
  <canvas id="avatarCanvas" width="600" height="600"></canvas>
</div>

<div class="status" id="status">▶ clicca o premi un tasto per iniziare</div>

<script>
// ============================================================
// TESTO DA PRONUNCIARE — modifica qui
// ============================================================
const TESTO = "Ciao e benvenuto! Questo è un testo di prova per il mio avatar. Purtroppo a volte ci sono piccoli problemi, ma nessun errore grave. Attenzione però: il testo verrà letto utilizzando la sintesi vocale del browser. Wow, incredibile, vediamo se tutto funziona correttamente. Grazie e arrivederci!";

// ============================================================
// PALETTE RADAR
// ============================================================
const COLOR_MAIN = '#00ff66';       // verde fosforo
const COLOR_DIM  = '#00aa44';
const COLOR_BRIGHT = '#aaffaa';
const COLOR_GLOW = 'rgba(0,255,102,0.9)';
const COLOR_GLOW_SOFT = 'rgba(0,255,102,0.4)';

const RADAR_RADIUS = 260;
const CX = 300;   // centro canvas (600/2)
const CY = 300;

// ============================================================
// CONFIGURAZIONE AUDIO
// ============================================================
const AUDIO_CONFIG = {
  ambientVolume: 0.025,
  syllableVolume: 0.09,
  startBeepVolume: 0.14,
  endBeepVolume: 0.14,
  enabled: true
};

// ============================================================
// DOM
// ============================================================
const canvas = document.getElementById('avatarCanvas');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');
const container = document.getElementById('avatarContainer');

// ============================================================
// STATO
// ============================================================
let isSpeaking = false;
let mouthOpen = 0;
let targetMouthOpen = 0;
let time = 0;

// Blink
let eyeBlink = 0;
let blinkTimer = 0;
let nextBlinkAt = 150 + Math.random() * 200;
let doubleBlink = false;
let doubleBlinkDelay = 0;

// Sbadiglio
let yawnTimer = 0;
let yawnCooldown = 800 + Math.random() * 800;
let yawnActive = 0;
let yawnPhase = 0;

// Micro-smorfie bocca
let mouthTwitchTimer = 0;
let mouthTwitchNextAt = 120 + Math.random() * 180;
let mouthTwitchActive = 0;
let mouthTwitchPhase = 0;
let mouthTwitchDir = 1;

// Micro-movimenti sopracciglia
let browTwitchTimer = 0;
let browTwitchNextAt = 100 + Math.random() * 200;
let browTwitchActive = 0;
let browTwitchPhase = 0;
let browTwitchAmount = 0;

// Micro-drift capo
let headDriftTimer = 0;
let headDriftNextAt = 90 + Math.random() * 150;
let headDriftTarget = 0;
let headDriftCurrent = 0;

// Dilatazione pupille
let pupilScale = 1;
let pupilScaleTarget = 1;
let pupilTimer = 0;
let pupilNextAt = 180 + Math.random() * 240;

// Wander
let wanderActive = false;
let wanderTimer = 0;
let wanderNextAt = 120 + Math.random() * 180;
let wanderTargetX = 0;
let wanderTargetY = 0;
let wanderReturnTimer = 0;

// Saccadi
let saccadeTimer = 0;
let saccadeNextAt = 15 + Math.random() * 25;
let saccadeX = 0, saccadeY = 0;
let saccadeTargetX = 0, saccadeTargetY = 0;

// Riflessione
let reflectionTimer = 0;
let reflectionNextAt = 1500 + Math.random() * 1500;
let reflectionActive = 0;
let reflectionPhase = 0;
let reflectionTotalFrames = 180;

// Respirazione irregolare
let breathPhaseA = 0;
let breathPhaseB = 0;
let breathPhaseC = 0;
let breathCycleTimer = 0;
let breathCycleDuration = 180 + Math.random() * 120;
let currentBreathOffset = 0;

// === SPECIFICO RADAR ===
// Raggio rotante
let sweepAngle = 0;
let sweepSpeed = 0.025;   // radianti per frame

// Anelli sonar che si propagano
let sonarRings = [];
let sonarTimer = 0;
let sonarNextAt = 60;

// Echi sonar (puntini che appaiono e svaniscono)
let echoes = [];

// Contatti radar (blip che appaiono ogni tanto)
let contacts = [];
let contactTimer = 0;
let contactNextAt = 200 + Math.random() * 300;

// Sguardo
let eyeTargetX = 0, eyeTargetY = 0;
let eyeCurrentX = 0, eyeCurrentY = 0;
let mouseIsActive = false;
let mouseMovedTimer = 0;

// Emozione
let currentEmotion = { browAngle: 0, browHeight: 0, mouthCurve: 0, eyeOpen: 1, mouthWidth: 80, headTilt: 0 };
let targetEmotion = { ...currentEmotion };

const EMOTION_KEYWORDS = {
  felice: ['ciao','benvenuto','grazie','felice','bene','ottimo','grande','bello','amore','contento','evviva','bravo','sorriso','piacere'],
  triste: ['purtroppo','triste','male','problema','difficile','brutto','dispiace','sofferenza','dolore','solo','perdere'],
  arrabbiato: ['attenzione','pericolo','errore','grave','rabbia','basta','no','mai','inaccettabile','sbagliato'],
  sorpreso: ['wow','incredibile','davvero','improvviso','inaspettato','sorpresa','caspita','accidenti','oh']
};
let activeEmotion = 'neutro';

// ============================================================
// WEB AUDIO
// ============================================================
let audioCtx = null;
let ambientOsc = null;
let ambientGain = null;
let ambientFilter = null;

function initAudioContext() {
  if (audioCtx) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  } catch (e) {
    console.warn('Web Audio non disponibile', e);
  }
}

function startAmbient() {
  if (!audioCtx || !AUDIO_CONFIG.enabled) return;
  if (ambientOsc) return;
  ambientOsc = audioCtx.createOscillator();
  ambientOsc.type = 'sawtooth';
  ambientOsc.frequency.value = 45;
  ambientGain = audioCtx.createGain();
  ambientGain.gain.value = 0;
  ambientGain.gain.linearRampToValueAtTime(AUDIO_CONFIG.ambientVolume, audioCtx.currentTime + 0.4);
  ambientFilter = audioCtx.createBiquadFilter();
  ambientFilter.type = 'lowpass';
  ambientFilter.frequency.value = 180;
  ambientOsc.connect(ambientFilter);
  ambientFilter.connect(ambientGain);
  ambientGain.connect(audioCtx.destination);
  ambientOsc.start();
}

function stopAmbient() {
  if (!ambientOsc) return;
  const now = audioCtx.currentTime;
  ambientGain.gain.cancelScheduledValues(now);
  ambientGain.gain.linearRampToValueAtTime(0, now + 0.3);
  const osc = ambientOsc;
  const gain = ambientGain;
  ambientOsc = null;
  ambientGain = null;
  ambientFilter = null;
  setTimeout(() => {
    try { osc.stop(); } catch(e){}
    try { osc.disconnect(); } catch(e){}
    try { gain.disconnect(); } catch(e){}
  }, 400);
}

function playBeep(freq, duration, volume, type) {
  if (!audioCtx || !AUDIO_CONFIG.enabled) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type || 'square';
  osc.frequency.value = freq;
  gain.gain.value = 0;
  gain.gain.linearRampToValueAtTime(volume, audioCtx.currentTime + 0.008);
  gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration + 0.05);
}

function playSyllableBeep(syllable) {
  if (!audioCtx || !AUDIO_CONFIG.enabled) return;
  let freq = 440;
  if (syllable.includes('a')) freq = 330;
  else if (syllable.includes('o')) freq = 294;
  else if (syllable.includes('e')) freq = 370;
  else if (syllable.includes('u')) freq = 262;
  else if (syllable.includes('i')) freq = 494;
  else freq = 220;
  freq += (Math.random() - 0.5) * 30;
  playBeep(freq, 0.05, AUDIO_CONFIG.syllableVolume, 'square');
}

function playStartBeep() {
  if (!audioCtx || !AUDIO_CONFIG.enabled) return;
  playBeep(660, 0.10, AUDIO_CONFIG.startBeepVolume, 'sine');
  setTimeout(() => playBeep(880, 0.10, AUDIO_CONFIG.startBeepVolume, 'sine'), 100);
  setTimeout(() => playBeep(1320, 0.12, AUDIO_CONFIG.startBeepVolume, 'sine'), 200);
}

function playEndBeep() {
  if (!audioCtx || !AUDIO_CONFIG.enabled) return;
  playBeep(1320, 0.09, AUDIO_CONFIG.endBeepVolume, 'sine');
  setTimeout(() => playBeep(880, 0.11, AUDIO_CONFIG.endBeepVolume, 'sine'), 100);
  setTimeout(() => playBeep(660, 0.13, AUDIO_CONFIG.endBeepVolume, 'sine'), 200);
}

// Suono "ping" del sonar
function playSonarPing() {
  if (!audioCtx || !AUDIO_CONFIG.enabled) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.value = 880;
  osc.frequency.exponentialRampToValueAtTime(440, audioCtx.currentTime + 0.4);
  gain.gain.value = 0.05;
  gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.5);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.55);
}

// ============================================================
// PARTICELLE (piccole, poche, in stile radar)
// ============================================================
let particles = [];
class Particle {
  constructor() { this.reset(); this.y = Math.random() * canvas.height; }
  reset() {
    this.x = Math.random() * canvas.width;
    this.y = canvas.height + 20;
    this.sizeBase = Math.random() * 1.8 + 0.3;
    this.size = this.sizeBase;
    this.speedBase = Math.random() * 0.3 + 0.15;
    this.speed = this.speedBase;
    this.alphaBase = Math.random() * 0.3 + 0.1;
    this.alpha = this.alphaBase;
    this.wobble = Math.random() * Math.PI * 2;
    this.wobbleSpeed = Math.random() * 0.015 + 0.005;
  }
  update(intensity) {
    this.speed = this.speedBase * (1 + intensity * 2);
    this.size = this.sizeBase * (1 + intensity * 1.2);
    this.alpha = Math.min(1, this.alphaBase * (1 + intensity * 1.5));
    this.wobble += this.wobbleSpeed * (1 + intensity * 1.5);
    this.y -= this.speed;
    this.x += Math.sin(this.wobble) * (0.3 + intensity * 1);
    if (this.y < -20) this.reset();
  }
  draw() {
    ctx.save();
    ctx.globalAlpha = this.alpha;
    ctx.fillStyle = COLOR_MAIN;
    ctx.shadowBlur = 6;
    ctx.shadowColor = COLOR_MAIN;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}
for (let i = 0; i < 25; i++) particles.push(new Particle());

// ============================================================
// SILLABE
// ============================================================
function getSyllables(text) {
  const words = text.toLowerCase().match(/[a-zàèéìòù]+/g) || [];
  const result = [];
  const vowels = 'aeiouàèéìòù';
  for (const word of words) {
    let currentSyl = '';
    for (let i = 0; i < word.length; i++) {
      currentSyl += word[i];
      const isVowel = vowels.includes(word[i]);
      const nextIsVowel = i + 1 < word.length && vowels.includes(word[i + 1]);
      if (isVowel && !nextIsVowel) { result.push(currentSyl); currentSyl = ''; }
    }
    if (currentSyl) result.push(currentSyl);
  }
  return result;
}

function extractWords(text) {
  const words = [];
  const regex = /[a-zA-ZàèéìòùÀÈÉÌÒÙ]+/g;
  let m;
  while ((m = regex.exec(text)) !== null) {
    words.push({ word: m[0].toLowerCase(), index: m.index });
  }
  return words;
}

// ============================================================
// VOCI
// ============================================================
let selectedVoice = null;
function pickItalianVoice() {
  const voices = speechSynthesis.getVoices();
  if (!voices.length) return null;
  let v = voices.find(v => v.lang === 'it-IT');
  if (!v) v = voices.find(v => v.lang && v.lang.startsWith('it'));
  if (!v) v = voices.find(v => v.lang && v.lang.startsWith('en'));
  return v || voices[0];
}
function loadVoices() {
  const v = pickItalianVoice();
  if (v) { selectedVoice = v; console.log('[Avatar] Voce:', v.name, v.lang); }
}
if ('speechSynthesis' in window) {
  speechSynthesis.onvoiceschanged = loadVoices;
  loadVoices();
}

// ============================================================
// EMOZIONI
// ============================================================
function detectEmotionForWord(word) {
  for (const [emotion, keywords] of Object.entries(EMOTION_KEYWORDS)) {
    if (keywords.includes(word)) return emotion;
  }
  return null;
}
function emotionParams(emotion) {
  switch (emotion) {
    case 'felice':    return { browAngle: 0.3, browHeight: -5, mouthCurve: 1, eyeOpen: 0.95, mouthWidth: 90, headTilt: 0.02 };
    case 'triste':    return { browAngle: -0.8, browHeight: 8, mouthCurve: -1, eyeOpen: 0.75, mouthWidth: 70, headTilt: -0.05 };
    case 'arrabbiato':return { browAngle: -1.2, browHeight: 5, mouthCurve: -0.7, eyeOpen: 0.7, mouthWidth: 80, headTilt: 0 };
    case 'sorpreso':  return { browAngle: 0.6, browHeight: -14, mouthCurve: 0, eyeOpen: 1.5, mouthWidth: 75, headTilt: 0 };
    default:          return { browAngle: 0, browHeight: 0, mouthCurve: 0, eyeOpen: 1, mouthWidth: 80, headTilt: 0 };
  }
}

let wordsInText = [];
let wordCursor = 0;
let emotionHoldFrames = 0;

function processNextWord() {
  if (wordCursor >= wordsInText.length) return;
  const w = wordsInText[wordCursor];
  const detected = detectEmotionForWord(w.word);
  if (detected) { activeEmotion = detected; emotionHoldFrames = 90; }
  wordCursor++;
}

// ============================================================
// BOCCA
// ============================================================
let syllables = [];
let currentSyllableIndex = 0;
let syllableTimer = 0;
let framesPerSyllable = 8;
let lastBeepedSyllable = -1;

function updateMouthAnimation() {
  if (!isSpeaking) {
    targetMouthOpen = 0.02 + Math.abs(Math.sin(time * 0.6)) * 0.04;
    return;
  }
  syllableTimer++;
  if (syllableTimer >= framesPerSyllable) {
    syllableTimer = 0;
    currentSyllableIndex++;
    if (currentSyllableIndex >= syllables.length) currentSyllableIndex = 0;
    if (currentSyllableIndex !== lastBeepedSyllable) {
      lastBeepedSyllable = currentSyllableIndex;
      playSyllableBeep(syllables[currentSyllableIndex] || '');
    }
    const syl = syllables[currentSyllableIndex] || '';
    framesPerSyllable = 6 + Math.random() * 4 + Math.min(4, syl.length);
  }
  const syl = syllables[currentSyllableIndex] || '';
  let openness = 0.4;
  if (syl.includes('a')) openness = 1.0;
  else if (syl.includes('o')) openness = 0.9;
  else if (syl.includes('e')) openness = 0.75;
  else if (syl.includes('u')) openness = 0.6;
  else if (syl.includes('i')) openness = 0.5;
  else openness = 0.25;
  openness += (Math.random() - 0.5) * 0.15;
  targetMouthOpen = Math.max(0.05, Math.min(1, openness));
}

// ============================================================
// ANIMAZIONI
// ============================================================
function lerp(a, b, t) { return a + (b - a) * t; }

function updateEmotionAnimation() {
  if (emotionHoldFrames > 0) {
    emotionHoldFrames--;
    if (emotionHoldFrames === 0) activeEmotion = 'neutro';
  }
  const params = emotionParams(activeEmotion);
  Object.keys(params).forEach(k => targetEmotion[k] = params[k]);
  Object.keys(currentEmotion).forEach(k => {
    currentEmotion[k] = lerp(currentEmotion[k], targetEmotion[k], 0.12);
  });
}

function updateBreath() {
  breathPhaseA += 0.018;
  breathPhaseB += 0.037;
  breathPhaseC += 0.008;
  const base = Math.sin(breathPhaseA) * 2.5;
  const harmonic = Math.sin(breathPhaseB) * 0.8;
  const drift = Math.sin(breathPhaseC) * 1.2;
  currentBreathOffset = base + harmonic + drift;
  breathCycleTimer++;
  if (breathCycleTimer > breathCycleDuration) {
    breathCycleTimer = 0;
    breathCycleDuration = 180 + Math.random() * 180;
    currentBreathOffset += (Math.random() - 0.5) * 2;
  }
}
function getBreathOffset() { return currentBreathOffset; }

function updateBlink() {
  blinkTimer++;
  if (doubleBlink) {
    doubleBlinkDelay++;
    if (doubleBlinkDelay > 15 && doubleBlinkDelay < 20) eyeBlink = 1;
    else if (doubleBlinkDelay >= 20 && doubleBlinkDelay < 25) eyeBlink = 0;
    else if (doubleBlinkDelay >= 25 && doubleBlinkDelay < 30) eyeBlink = 1;
    else if (doubleBlinkDelay >= 30) {
      eyeBlink = 0; doubleBlink = false; doubleBlinkDelay = 0;
      nextBlinkAt = blinkTimer + 150 + Math.random() * 200;
    }
    return;
  }
  if (blinkTimer >= nextBlinkAt) {
    eyeBlink = 1;
    if (blinkTimer >= nextBlinkAt + 6) {
      eyeBlink = 0;
      if (Math.random() < 0.2) { doubleBlink = true; doubleBlinkDelay = 0; }
      else nextBlinkAt = blinkTimer + 150 + Math.random() * 200;
    }
  }
}

function updateYawn() {
  if (isSpeaking) { yawnActive = 0; return; }
  yawnTimer++;
  if (yawnTimer > yawnCooldown && yawnActive === 0) { yawnActive = 0.01; yawnPhase = 0; }
  if (yawnActive > 0) {
    yawnPhase++;
    const totalFrames = 120;
    if (yawnPhase < 40) yawnActive = yawnPhase / 40;
    else if (yawnPhase < 80) yawnActive = 1;
    else if (yawnPhase < totalFrames) yawnActive = 1 - (yawnPhase - 80) / 40;
    else { yawnActive = 0; yawnTimer = 0; yawnCooldown = 800 + Math.random() * 800; }
  }
}

function updateMouthTwitch() {
  if (isSpeaking) {
    mouthTwitchActive = lerp(mouthTwitchActive, 0, 0.15);
    mouthTwitchTimer = 0;
    return;
  }
  mouthTwitchTimer++;
  if (mouthTwitchTimer > mouthTwitchNextAt && mouthTwitchActive < 0.01) {
    mouthTwitchActive = 0.01;
    mouthTwitchPhase = 0;
    mouthTwitchDir = Math.random() < 0.5 ? 1 : -1;
  }
  if (mouthTwitchActive > 0) {
    mouthTwitchPhase++;
    const totalFrames = 45 + Math.random() * 20;
    if (mouthTwitchPhase < totalFrames * 0.35) {
      mouthTwitchActive = mouthTwitchPhase / (totalFrames * 0.35);
    } else if (mouthTwitchPhase < totalFrames * 0.65) {
      mouthTwitchActive = 1;
    } else if (mouthTwitchPhase < totalFrames) {
      mouthTwitchActive = 1 - (mouthTwitchPhase - totalFrames * 0.65) / (totalFrames * 0.35);
    } else {
      mouthTwitchActive = 0;
      mouthTwitchTimer = 0;
      mouthTwitchNextAt = 180 + Math.random() * 300;
    }
  }
}

function updateBrowTwitch() {
  if (isSpeaking) {
    browTwitchActive = lerp(browTwitchActive, 0, 0.15);
    browTwitchAmount = lerp(browTwitchAmount, 0, 0.1);
    return;
  }
  browTwitchTimer++;
  if (browTwitchTimer > browTwitchNextAt && browTwitchActive < 0.01) {
    browTwitchActive = 0.01;
    browTwitchPhase = 0;
  }
  if (browTwitchActive > 0) {
    browTwitchPhase++;
    const totalFrames = 40 + Math.random() * 30;
    if (browTwitchPhase < totalFrames * 0.4) {
      browTwitchActive = browTwitchPhase / (totalFrames * 0.4);
    } else if (browTwitchPhase < totalFrames * 0.6) {
      browTwitchActive = 1;
    } else if (browTwitchPhase < totalFrames) {
      browTwitchActive = 1 - (browTwitchPhase - totalFrames * 0.6) / (totalFrames * 0.4);
    } else {
      browTwitchActive = 0;
      browTwitchTimer = 0;
      browTwitchNextAt = 150 + Math.random() * 250;
    }
  }
  const targetAmount = browTwitchActive * (2 + Math.random() * 2);
  browTwitchAmount = lerp(browTwitchAmount, targetAmount, 0.15);
}

function updateHeadDrift() {
  if (isSpeaking) {
    headDriftTarget = 0;
    headDriftCurrent = lerp(headDriftCurrent, 0, 0.08);
    return;
  }
  headDriftTimer++;
  if (headDriftTimer > headDriftNextAt) {
    headDriftTarget = (Math.random() - 0.5) * 0.06;
    headDriftTimer = 0;
    headDriftNextAt = 120 + Math.random() * 200;
  }
  headDriftCurrent = lerp(headDriftCurrent, headDriftTarget, 0.02);
}

function updatePupilDilation() {
  pupilTimer++;
  if (pupilTimer > pupilNextAt) {
    pupilScaleTarget = 0.85 + Math.random() * 0.30;
    pupilTimer = 0;
    pupilNextAt = 120 + Math.random() * 240;
  }
  pupilScale = lerp(pupilScale, pupilScaleTarget, 0.02);
}

function updateWander() {
  if (isSpeaking) { wanderActive = false; return; }
  if (mouseIsActive) { wanderActive = false; return; }
  wanderTimer++;
  if (wanderTimer > wanderNextAt) {
    wanderTargetX = (Math.random() - 0.5) * 10;
    wanderTargetY = (Math.random() - 0.5) * 6;
    wanderTimer = 0;
    wanderNextAt = 90 + Math.random() * 180;
    wanderActive = true;
    wanderReturnTimer = 0;
  }
  if (wanderActive) {
    wanderReturnTimer++;
    if (wanderReturnTimer > 120) {
      wanderTargetX = 0; wanderTargetY = 0;
      wanderActive = false;
    }
  }
}

function updateSaccades() {
  if (isSpeaking) {
    saccadeX = lerp(saccadeX, 0, 0.2);
    saccadeY = lerp(saccadeY, 0, 0.2);
    return;
  }
  saccadeTimer++;
  if (saccadeTimer > saccadeNextAt) {
    saccadeTargetX = (Math.random() - 0.5) * 2;
    saccadeTargetY = (Math.random() - 0.5) * 1.5;
    saccadeTimer = 0;
    saccadeNextAt = 15 + Math.random() * 25;
  }
  saccadeX = lerp(saccadeX, saccadeTargetX, 0.4);
  saccadeY = lerp(saccadeY, saccadeTargetY, 0.4);
}

function updateReflection() {
  if (isSpeaking) {
    reflectionActive = 0;
    reflectionTimer = 0;
    return;
  }
  reflectionTimer++;
  if (reflectionTimer > reflectionNextAt && reflectionActive === 0) {
    reflectionActive = 0.01;
    reflectionPhase = 0;
  }
  if (reflectionActive > 0) {
    reflectionPhase++;
    const totalFrames = reflectionTotalFrames;
    if (reflectionPhase < totalFrames * 0.2) {
      reflectionActive = reflectionPhase / (totalFrames * 0.2);
    } else if (reflectionPhase < totalFrames * 0.7) {
      reflectionActive = 1;
    } else if (reflectionPhase < totalFrames) {
      reflectionActive = 1 - (reflectionPhase - totalFrames * 0.7) / (totalFrames * 0.3);
    } else {
      reflectionActive = 0;
      reflectionTimer = 0;
      reflectionNextAt = 1500 + Math.random() * 1500;
    }
  }
}

document.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  const ccx = rect.left + rect.width / 2;
  const ccy = rect.top + rect.height / 2;
  const dx = e.clientX - ccx, dy = e.clientY - ccy;
  const dist = Math.sqrt(dx*dx + dy*dy);
  const maxOffset = 6;
  if (dist > 0) {
    const factor = Math.min(1, dist / 400);
    eyeTargetX = (dx / dist) * maxOffset * factor;
    eyeTargetY = (dy / dist) * maxOffset * factor;
  }
  mouseIsActive = true;
  mouseMovedTimer = 0;
});

function updateGaze() {
  mouseMovedTimer++;
  if (mouseMovedTimer > 180) mouseIsActive = false;
  if (isSpeaking) {
    eyeTargetX = Math.sin(time * 0.5) * 1.5;
    eyeTargetY = Math.sin(time * 0.7) * 1.0;
  } else if (mouseIsActive) {
    // già aggiornato
  } else if (wanderActive) {
    eyeTargetX = wanderTargetX;
    eyeTargetY = wanderTargetY;
  } else {
    eyeTargetX = lerp(eyeTargetX, 0, 0.03);
    eyeTargetY = lerp(eyeTargetY, 0, 0.03);
  }
  eyeCurrentX = lerp(eyeCurrentX, eyeTargetX, 0.08);
  eyeCurrentY = lerp(eyeCurrentY, eyeTargetY, 0.08);
}

// === SPECIFICO RADAR ===
function updateSweep() {
  sweepAngle += sweepSpeed;
  if (sweepAngle > Math.PI * 2) sweepAngle -= Math.PI * 2;
}

function updateSonarRings() {
  sonarTimer++;
  if (sonarTimer > sonarNextAt) {
    sonarTimer = 0;
    sonarNextAt = isSpeaking ? 25 : 60;
    sonarRings.push({
      radius: 30,
      maxRadius: RADAR_RADIUS,
      alpha: isSpeaking ? 0.6 : 0.35,
      speed: isSpeaking ? 2.5 : 1.6
    });
    // Suono sonar occasionale
    if (Math.random() < 0.15) playSonarPing();
  }
  for (let i = sonarRings.length - 1; i >= 0; i--) {
    const r = sonarRings[i];
    r.radius += r.speed;
    r.alpha -= 0.008;
    if (r.alpha <= 0 || r.radius >= r.maxRadius) sonarRings.splice(i, 1);
  }
}

function updateEchoes() {
  // Genera piccoli echi sparsi (puntini che si illuminano e svaniscono)
  if (Math.random() < 0.03) {
    const angle = Math.random() * Math.PI * 2;
    const distance = 60 + Math.random() * (RADAR_RADIUS - 80);
    echoes.push({
      x: CX + Math.cos(angle) * distance,
      y: CY + Math.sin(angle) * distance,
      alpha: 0.8,
      size: 1.5 + Math.random() * 2,
      life: 60
    });
  }
  for (let i = echoes.length - 1; i >= 0; i--) {
    echoes[i].alpha -= 0.012;
    echoes[i].life--;
    if (echoes[i].alpha <= 0) echoes.splice(i, 1);
  }
}

function updateContacts() {
  contactTimer++;
  if (contactTimer > contactNextAt) {
    contactTimer = 0;
    contactNextAt = 300 + Math.random() * 400;
    const angle = Math.random() * Math.PI * 2;
    const distance = 80 + Math.random() * (RADAR_RADIUS - 100);
    contacts.push({
      x: CX + Math.cos(angle) * distance,
      y: CY + Math.sin(angle) * distance,
      alpha: 1,
      life: 200,
      blink: 0,
      id: Math.floor(Math.random() * 9000 + 1000)
    });
  }
  for (let i = contacts.length - 1; i >= 0; i--) {
    contacts[i].life--;
    contacts[i].blink += 0.15;
    // Fade out negli ultimi 40 frame
    if (contacts[i].life < 40) contacts[i].alpha = contacts[i].life / 40;
    if (contacts[i].life <= 0) contacts.splice(i, 1);
  }
}

// ============================================================
// DISEGNO
// ============================================================
function drawAvatar() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  time += 0.02;

  updateMouthAnimation();
  updateEmotionAnimation();
  updateBreath();
  updateBlink();
  updateYawn();
  updateMouthTwitch();
  updateBrowTwitch();
  updateHeadDrift();
  updatePupilDilation();
  updateWander();
  updateSaccades();
  updateReflection();
  updateGaze();
  updateSweep();
  updateSonarRings();
  updateEchoes();
  updateContacts();

  const baseIntensity = 0.15;
  const speakIntensity = isSpeaking ? Math.min(1, 0.3 + mouthOpen * 0.7) : 0;
  const intensity = Math.max(baseIntensity, speakIntensity);
  particles.forEach(p => { p.update(intensity); p.draw(); });

  // === SFONDO RADAR: cerchi concentrici, raggi, quadrante ===
  drawRadarBackground();

  // === SWEEP (fascio rotante) ===
  drawSweep();

  // === ANELLI SONAR ===
  drawSonarRings();

  // === ECHI ===
  drawEchoes();

  // === CONTATTI ===
  drawContacts();

  // === CROSSHAIR al centro ===
  drawCrosshair();

  // === IL VISO (all'interno del radar) ===
  drawFace();

  // === COORDINATE + info tecniche ===
  drawInfoPanel();
}

function drawRadarBackground() {
  ctx.save();

  // Cerchio esterno (bordo radar)
  ctx.strokeStyle = COLOR_MAIN;
  ctx.lineWidth = 2;
  ctx.shadowBlur = 15;
  ctx.shadowColor = COLOR_GLOW;
  ctx.beginPath();
  ctx.arc(CX, CY, RADAR_RADIUS, 0, Math.PI * 2);
  ctx.stroke();

  // Anelli concentrici
  ctx.shadowBlur = 5;
  ctx.lineWidth = 1;
  const ringCount = 4;
  for (let i = 1; i <= ringCount; i++) {
    const r = (RADAR_RADIUS / ringCount) * i;
    ctx.globalAlpha = 0.4 - i * 0.05;
    ctx.beginPath();
    ctx.arc(CX, CY, r, 0, Math.PI * 2);
    ctx.stroke();
  }

  // Raggi (linee radiali a 30°)
  ctx.globalAlpha = 0.25;
  for (let i = 0; i < 12; i++) {
    const angle = (i / 12) * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(CX, CY);
    ctx.lineTo(CX + Math.cos(angle) * RADAR_RADIUS, CY + Math.sin(angle) * RADAR_RADIUS);
    ctx.stroke();
  }

  // Tacca 0°/90°/180°/270° più marcata
  ctx.globalAlpha = 0.6;
  ctx.lineWidth = 2;
  for (let i = 0; i < 4; i++) {
    const angle = (i / 4) * Math.PI * 2 - Math.PI / 2;
    const x1 = CX + Math.cos(angle) * (RADAR_RADIUS - 15);
    const y1 = CY + Math.sin(angle) * (RADAR_RADIUS - 15);
    const x2 = CX + Math.cos(angle) * RADAR_RADIUS;
    const y2 = CY + Math.sin(angle) * RADAR_RADIUS;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
  }

  // Etichette cardinali
  ctx.globalAlpha = 0.7;
  ctx.fillStyle = COLOR_MAIN;
  ctx.font = 'bold 12px Courier New';
  ctx.textAlign = 'center';
  ctx.fillText('N', CX, CY - RADAR_RADIUS - 10);
  ctx.fillText('E', CX + RADAR_RADIUS + 15, CY + 4);
  ctx.fillText('S', CX, CY + RADAR_RADIUS + 20);
  ctx.fillText('W', CX - RADAR_RADIUS - 15, CY + 4);

  // Cerchio interno (zona "safe")
  ctx.globalAlpha = 0.5;
  ctx.strokeStyle = COLOR_BRIGHT;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(CX, CY, 90, 0, Math.PI * 2);
  ctx.stroke();

  ctx.restore();
}

function drawSweep() {
  ctx.save();

  // Il fascio è un settore circolare che ruota
  const sweepLength = RADAR_RADIUS;
  const sweepWidth = 0.5;  // ~30 gradi di apertura

  // Gradiente radiale dal centro verso fuori
  const grad = ctx.createRadialGradient(CX, CY, 0, CX, CY, sweepLength);
  grad.addColorStop(0, 'rgba(0,255,102,0.6)');
  grad.addColorStop(0.6, 'rgba(0,255,102,0.15)');
  grad.addColorStop(1, 'rgba(0,255,102,0)');

  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.moveTo(CX, CY);
  ctx.arc(CX, CY, sweepLength, sweepAngle - sweepWidth, sweepAngle + sweepWidth);
  ctx.closePath();
  ctx.fill();

  // Linea del bordo principale del fascio
  ctx.strokeStyle = COLOR_BRIGHT;
  ctx.lineWidth = 2;
  ctx.shadowBlur = 15;
  ctx.shadowColor = COLOR_GLOW;
  ctx.beginPath();
  ctx.moveTo(CX, CY);
  ctx.lineTo(CX + Math.cos(sweepAngle) * sweepLength, CY + Math.sin(sweepAngle) * sweepLength);
  ctx.stroke();

  // Scia luminosa dietro il fascio
  ctx.globalAlpha = 0.4;
  ctx.strokeStyle = COLOR_MAIN;
  ctx.lineWidth = 1;
  for (let i = 1; i <= 4; i++) {
    const trailAngle = sweepAngle - i * 0.08;
    ctx.globalAlpha = 0.4 / i;
    ctx.beginPath();
    ctx.moveTo(CX, CY);
    ctx.lineTo(CX + Math.cos(trailAngle) * sweepLength, CY + Math.sin(trailAngle) * sweepLength);
    ctx.stroke();
  }

  ctx.restore();
}

function drawSonarRings() {
  sonarRings.forEach(r => {
    ctx.save();
    ctx.strokeStyle = COLOR_MAIN;
    ctx.globalAlpha = r.alpha;
    ctx.lineWidth = 1.5;
    ctx.shadowBlur = 12;
    ctx.shadowColor = COLOR_GLOW;
    ctx.beginPath();
    ctx.arc(CX, CY, r.radius, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  });
}

function drawEchoes() {
  echoes.forEach(e => {
    ctx.save();
    ctx.globalAlpha = e.alpha;
    ctx.fillStyle = COLOR_BRIGHT;
    ctx.shadowBlur = 10;
    ctx.shadowColor = COLOR_GLOW;
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  });
}

function drawContacts() {
  contacts.forEach(c => {
    ctx.save();
    // Blip lampeggiante
    const blinkAlpha = 0.5 + Math.abs(Math.sin(c.blink)) * 0.5;
    ctx.globalAlpha = c.alpha * blinkAlpha;
    ctx.fillStyle = COLOR_BRIGHT;
    ctx.shadowBlur = 20;
    ctx.shadowColor = COLOR_GLOW;
    ctx.beginPath();
    ctx.arc(c.x, c.y, 4, 0, Math.PI * 2);
    ctx.fill();

    // Anello intorno al contatto
    ctx.globalAlpha = c.alpha * 0.4;
    ctx.strokeStyle = COLOR_BRIGHT;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(c.x, c.y, 8 + Math.sin(c.blink) * 2, 0, Math.PI * 2);
    ctx.stroke();

    // Etichetta ID
    ctx.globalAlpha = c.alpha * 0.7;
    ctx.fillStyle = COLOR_MAIN;
    ctx.font = '9px Courier New';
    ctx.textAlign = 'left';
    ctx.fillText('T' + c.id, c.x + 12, c.y - 2);
    ctx.restore();
  });
}

function drawCrosshair() {
  ctx.save();
  ctx.strokeStyle = COLOR_BRIGHT;
  ctx.globalAlpha = 0.5;
  ctx.lineWidth = 1;
  ctx.shadowBlur = 8;
  ctx.shadowColor = COLOR_GLOW;

  // Croce centrale
  ctx.beginPath();
  ctx.moveTo(CX - 12, CY); ctx.lineTo(CX - 4, CY);
  ctx.moveTo(CX + 4, CY); ctx.lineTo(CX + 12, CY);
  ctx.moveTo(CX, CY - 12); ctx.lineTo(CX, CY - 4);
  ctx.moveTo(CX, CY + 4); ctx.lineTo(CX, CY + 12);
  ctx.stroke();

  // Piccolo cerchio al centro
  ctx.beginPath();
  ctx.arc(CX, CY, 3, 0, Math.PI * 2);
  ctx.stroke();

  ctx.restore();
}

function drawFace() {
  // Head tilt + drift
  ctx.save();
  ctx.translate(CX, CY);
  ctx.rotate(currentEmotion.headTilt + headDriftCurrent);
  ctx.translate(-CX, -CY);

  // Occhi
  const reflectionOffsetY = reflectionActive * -4;
  const eyeY = CY - 30 + reflectionOffsetY;
  const eyeOffsetX = 55;
  const baseEyeRadius = 18;
  const reflectionEyeFactor = 1 - reflectionActive * 0.25;
  const eyeRadius = baseEyeRadius * currentEmotion.eyeOpen * reflectionEyeFactor;

  drawEye(CX - eyeOffsetX, eyeY, eyeRadius);
  drawEye(CX + eyeOffsetX, eyeY, eyeRadius);

  const reflectionBrowOffset = reflectionActive * 3;
  drawEyebrow(CX - eyeOffsetX, eyeY - eyeRadius - 12 - reflectionBrowOffset, 1);
  drawEyebrow(CX + eyeOffsetX, eyeY - eyeRadius - 12 - reflectionBrowOffset, -1);

  // Naso
  ctx.save();
  ctx.strokeStyle = COLOR_DIM;
  ctx.lineWidth = 2;
  ctx.shadowBlur = 8;
  ctx.shadowColor = COLOR_GLOW_SOFT;
  ctx.beginPath();
  ctx.moveTo(CX, eyeY + 28);
  ctx.lineTo(CX, CY + 28);
  ctx.stroke();
  ctx.restore();

  // Bocca
  drawMouth(CX, CY + 75);
  mouthOpen += (targetMouthOpen - mouthOpen) * 0.35;

  ctx.restore();
}

function drawEye(x, y, radius) {
  ctx.save();
  ctx.strokeStyle = COLOR_MAIN;
  ctx.lineWidth = 2;
  ctx.shadowBlur = 15;
  ctx.shadowColor = COLOR_GLOW;
  ctx.beginPath();
  if (eyeBlink > 0) {
    ctx.moveTo(x - radius, y);
    ctx.lineTo(x + radius, y);
    ctx.stroke();
  } else {
    ctx.arc(x, y, radius, 0, Math.PI * 2);
    ctx.stroke();
    const pupilX = x + eyeCurrentX + saccadeX + Math.sin(time * 0.7) * 1.5;
    const pupilY = y + eyeCurrentY + saccadeY + Math.sin(time * 1.1) * 1.5;
    const pupilRadius = radius * 0.4 * pupilScale;
    ctx.beginPath();
    ctx.arc(pupilX, pupilY, pupilRadius, 0, Math.PI * 2);
    ctx.fillStyle = COLOR_BRIGHT;
    ctx.shadowBlur = 20;
    ctx.fill();
    // Riflesso
    ctx.beginPath();
    ctx.arc(pupilX - 3, pupilY - 3, Math.max(1.5, radius * 0.15), 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff';
    ctx.shadowBlur = 12;
    ctx.fill();
  }
  ctx.restore();
}

function drawEyebrow(x, y, side) {
  const w = 30;
  const angle = currentEmotion.browAngle * 0.35;
  const offsetY = currentEmotion.browHeight - browTwitchAmount;
  const reflectAngle = reflectionActive * -0.15 * side;
  const finalAngle = angle + reflectAngle;

  ctx.save();
  ctx.strokeStyle = COLOR_MAIN;
  ctx.lineWidth = 3.5;
  ctx.lineCap = 'round';
  ctx.shadowBlur = 12;
  ctx.shadowColor = COLOR_GLOW;
  const innerX = x - side * w / 2;
  const outerX = x + side * w / 2;
  const innerY = y + offsetY + finalAngle * w * 0.5;
  const outerY = y + offsetY - finalAngle * w * 0.5;
  ctx.beginPath();
  ctx.moveTo(innerX, innerY);
  ctx.lineTo(outerX, outerY);
  ctx.stroke();
  ctx.restore();
}

function drawMouth(x, y) {
  ctx.save();
  ctx.strokeStyle = COLOR_MAIN;
  ctx.lineWidth = 2.5;
  ctx.shadowBlur = 15;
  ctx.shadowColor = COLOR_GLOW;
  const yawnOpen = yawnActive * 0.9;
  const combinedOpen = Math.max(mouthOpen, yawnOpen);
  const mouthWidth = currentEmotion.mouthWidth;
  const maxOpenHeight = 55;
  const openHeight = maxOpenHeight * combinedOpen;
  const reflectionCurve = reflectionActive * -0.4;

  if (openHeight > 8) {
    const twitchOffsetY = mouthTwitchActive * mouthTwitchDir * 1.5;
    ctx.beginPath();
    ctx.ellipse(x, y + twitchOffsetY, mouthWidth / 2, openHeight / 2, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(x, y + twitchOffsetY, mouthWidth / 2 - 3, openHeight / 2 - 3, 0, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(0,20,10,${0.5 + combinedOpen * 0.5})`;
    ctx.fill();
    if (combinedOpen > 0.5) {
      ctx.beginPath();
      ctx.ellipse(x, y + twitchOffsetY + openHeight * 0.15, mouthWidth / 3, openHeight / 4, 0, 0, Math.PI * 2);
      ctx.fillStyle = COLOR_MAIN + '99';
      ctx.fill();
    }
  } else {
    const curve = currentEmotion.mouthCurve + reflectionCurve;
    const twitchCurve = mouthTwitchActive * mouthTwitchDir * 0.7;
    const totalCurve = curve + twitchCurve;
    const halfW = mouthWidth / 2;
    const controlY = y + totalCurve * 22;
    ctx.beginPath();
    ctx.moveTo(x - halfW, y);
    ctx.quadraticCurveTo(x, controlY, x + halfW, y);
    ctx.stroke();
  }
  ctx.restore();
}

// Coordinate + info tecniche in basso
function drawInfoPanel() {
  ctx.save();
  ctx.fillStyle = COLOR_MAIN;
  ctx.font = '11px Courier New';
  ctx.textAlign = 'left';
  ctx.globalAlpha = 0.7;

  const headingDeg = ((sweepAngle * 180 / Math.PI) % 360 + 360) % 360;
  const status = isSpeaking ? 'TALKING' : (isSpeaking ? 'ACTIVE' : 'IDLE');
  const contactsCount = contacts.length;
  const echoesCount = echoes.length;

  const baseY = canvas.height - 20;

  ctx.fillText('HEADING: ' + headingDeg.toFixed(1).padStart(5, '0') + '°', 20, baseY - 30);
  ctx.fillText('SWEEP:   ' + (sweepSpeed * 60).toFixed(1).padStart(5, '0') + ' rpm', 20, baseY - 15);
  ctx.fillText('CONTATTI: ' + String(contactsCount).padStart(2, '0'), 20, baseY);

  ctx.textAlign = 'right';
  ctx.fillText('ECHI: ' + String(echoesCount).padStart(3, '0'), canvas.width - 20, baseY - 30);
  ctx.fillText('STATO: ' + status, canvas.width - 20, baseY - 15);
  ctx.fillText('SIG: ' + (isSpeaking ? 'STRONG' : 'STABLE'), canvas.width - 20, baseY);

  ctx.restore();
}

// ============================================================
// LOOP
// ============================================================
function renderLoop() {
  drawAvatar();
  requestAnimationFrame(renderLoop);
}

// ============================================================
// SINTESI VOCALE + TOGGLE
// ============================================================
let utterance = null;
let fallbackWordInterval = null;

function updateStatus(text, cls) {
  statusEl.innerText = text;
  statusEl.classList.remove('speaking', 'done');
  if (cls) statusEl.classList.add(cls);
}

function speak() {
  if (!('speechSynthesis' in window)) {
    updateStatus('⚠ sintesi vocale non supportata');
    return;
  }
  window.speechSynthesis.cancel();
  if (fallbackWordInterval) { clearInterval(fallbackWordInterval); fallbackWordInterval = null; }

  initAudioContext();
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

  syllables = getSyllables(TESTO);
  wordsInText = extractWords(TESTO);
  currentSyllableIndex = 0;
  syllableTimer = 0;
  framesPerSyllable = 8;
  wordCursor = 0;
  activeEmotion = 'neutro';
  emotionHoldFrames = 0;
  lastBeepedSyllable = -1;

  utterance = new SpeechSynthesisUtterance(TESTO);
  utterance.lang = 'it-IT';
  utterance.rate = 0.95;
  utterance.pitch = 1.1;
  utterance.volume = 1;
  if (selectedVoice) utterance.voice = selectedVoice;

  utterance.onstart = () => {
    isSpeaking = true;
    container.classList.add('speaking');
    updateStatus('■ clicca per fermare', 'speaking');
    playStartBeep();
    startAmbient();
  };

  utterance.onboundary = (e) => {
    if (e.name === 'word') processNextWord();
  };

  utterance.onend = () => {
    isSpeaking = false;
    targetMouthOpen = 0;
    activeEmotion = 'neutro';
    emotionHoldFrames = 0;
    container.classList.remove('speaking');
    updateStatus('✓ fine — clicca per riascoltare', 'done');
    playEndBeep();
    stopAmbient();
    if (fallbackWordInterval) { clearInterval(fallbackWordInterval); fallbackWordInterval = null; }
  };

  utterance.onerror = (e) => {
    console.error(e);
    isSpeaking = false;
    targetMouthOpen = 0;
    activeEmotion = 'neutro';
    emotionHoldFrames = 0;
    container.classList.remove('speaking');
    updateStatus('✗ errore — clicca per riprovare', 'done');
    stopAmbient();
    if (fallbackWordInterval) { clearInterval(fallbackWordInterval); fallbackWordInterval = null; }
  };

  fallbackWordInterval = setInterval(() => {
    if (!isSpeaking) { clearInterval(fallbackWordInterval); fallbackWordInterval = null; return; }
    processNextWord();
  }, 350);

  speechSynthesis.speak(utterance);
}

function stopSpeaking() {
  speechSynthesis.cancel();
  if (fallbackWordInterval) { clearInterval(fallbackWordInterval); fallbackWordInterval = null; }
  isSpeaking = false;
  targetMouthOpen = 0;
  activeEmotion = 'neutro';
  emotionHoldFrames = 0;
  container.classList.remove('speaking');
  updateStatus('▶ clicca per iniziare');
  stopAmbient();
}

function toggleSpeech() {
  if (isSpeaking) stopSpeaking();
  else speak();
}

document.body.addEventListener('click', toggleSpeech);
document.body.addEventListener('touchstart', function(e) {
  e.preventDefault();
  toggleSpeech();
}, { passive: false });

document.addEventListener('keydown', (e) => {
  if (e.key === ' ' || e.key === 'Enter') {
    e.preventDefault();
    toggleSpeech();
  } else if (e.key === 'Escape') {
    if (isSpeaking) stopSpeaking();
  }
});

// ============================================================
// AVVIO
// ============================================================
renderLoop();
</script>
