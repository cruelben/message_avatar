<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Talking Avatar - Tron</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background-color: #000000;
    color: #00d4ff;
    font-family: 'Courier New', Courier, monospace;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    /* Griglia diagonale Tron sottile */
    background-image:
      repeating-linear-gradient(45deg, rgba(0,212,255,0.02) 0, rgba(0,212,255,0.02) 1px, transparent 1px, transparent 40px),
      repeating-linear-gradient(-45deg, rgba(0,212,255,0.02) 0, rgba(0,212,255,0.02) 1px, transparent 1px, transparent 40px);
    cursor: pointer;
    position: relative;
  }
  /* Scanline CRT molto sottili */
  .crt-overlay {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    background:
      linear-gradient(rgba(0,0,0,0) 50%, rgba(0,10,20,0.25) 50%);
    background-size: 100% 3px;
    pointer-events: none; z-index: 9999;
    animation: flicker 0.2s infinite;
  }
  @keyframes flicker { 0%{opacity:.98} 50%{opacity:.94} 100%{opacity:.98} }

  .avatar-container {
    position: relative; width: 500px; height: 500px;
    display: flex; justify-content: center; align-items: center;
    flex-shrink: 0;
    pointer-events: none;
    z-index: 1;
  }
  canvas { display: block; }

  .status {
    position: fixed;
    bottom: 60px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    color: #00d4ff;
    text-transform: uppercase;
    letter-spacing: 6px;
    text-align: center;
    pointer-events: none;
    animation: breathe 3s ease-in-out infinite;
    z-index: 10;
    font-weight: 300;
    text-shadow: 0 0 6px rgba(0,212,255,0.6);
  }
  @keyframes breathe {
    0%, 100% { opacity: 0.35; }
    50% { opacity: 0.85; }
  }
  .status.speaking { animation: none; opacity: 1; }
  .status.done { animation: none; opacity: 0.35; }

  /* Piccolo testo decorativo in alto a sinistra (stile Tron) */
  .hud-top {
    position: fixed;
    top: 30px;
    left: 30px;
    font-size: 9px;
    color: #00d4ff;
    opacity: 0.5;
    letter-spacing: 3px;
    pointer-events: none;
    z-index: 10;
    line-height: 1.6;
  }
  .hud-top-right {
    position: fixed;
    top: 30px;
    right: 30px;
    font-size: 9px;
    color: #00d4ff;
    opacity: 0.5;
    letter-spacing: 3px;
    pointer-events: none;
    text-align: right;
    z-index: 10;
    line-height: 1.6;
  }
</style>
</head>
<body>
<div class="crt-overlay"></div>

<div class="hud-top">
  SYS://ENCOM-75<br>
  NODE 04 · ACTIVE<br>
  UPTIME: <span id="uptime">00:00</span>
</div>
<div class="hud-top-right">
  USER: FLYNN<br>
  RENDER: 60 FPS<br>
  MODE: LINE-ART
</div>

<div class="avatar-container" id="avatarContainer">
  <canvas id="avatarCanvas" width="500" height="500"></canvas>
</div>

<div class="status" id="status">clicca o premi un tasto</div>

<script>
// ============================================================
// TESTO DA PRONUNCIARE — modifica qui
// ============================================================
const TESTO = "Ciao e benvenuto! Questo è un testo di prova per il mio avatar. Purtroppo a volte ci sono piccoli problemi, ma nessun errore grave. Attenzione però: il testo verrà letto utilizzando la sintesi vocale del browser. Wow, incredibile, vediamo se tutto funziona correttamente. Grazie e arrivederci!";

// ============================================================
// PALETTE TRON
// ============================================================
const COLOR_MAIN = '#ffffff';       // bianco puro per linee principali
const COLOR_ACCENT = '#00d4ff';     // ciano Tron per dettagli
const COLOR_DIM  = 'rgba(255,255,255,0.35)';
const COLOR_GLOW = 'rgba(0,212,255,0.5)';   // glow molto soft

// ============================================================
// CONFIGURAZIONE AUDIO
// ============================================================
const AUDIO_CONFIG = {
  ambientVolume: 0.020,
  syllableVolume: 0.075,
  startBeepVolume: 0.12,
  endBeepVolume: 0.12,
  enabled: true
};

// ============================================================
// DOM
// ============================================================
const canvas = document.getElementById('avatarCanvas');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');
const container = document.getElementById('avatarContainer');
const uptimeEl = document.getElementById('uptime');

// ============================================================
// STATO
// ============================================================
let isSpeaking = false;
let mouthOpen = 0;
let targetMouthOpen = 0;
let time = 0;
let startTime = Date.now();

// Blink
let eyeBlink = 0;
let blinkTimer = 0;
let nextBlinkAt = 150 + Math.random() * 200;
let doubleBlink = false;
let doubleBlinkDelay = 0;

// Sbadiglio
let yawnTimer = 0;
let yawnCooldown = 800 + Math.random() * 800;
let yawnActive = 0;
let yawnPhase = 0;

// Micro-smorfie bocca
let mouthTwitchTimer = 0;
let mouthTwitchNextAt = 120 + Math.random() * 180;
let mouthTwitchActive = 0;
let mouthTwitchPhase = 0;
let mouthTwitchDir = 1;

// Micro-movimenti sopracciglia
let browTwitchTimer = 0;
let browTwitchNextAt = 100 + Math.random() * 200;
let browTwitchActive = 0;
let browTwitchPhase = 0;
let browTwitchAmount = 0;

// Micro-drift capo
let headDriftTimer = 0;
let headDriftNextAt = 90 + Math.random() * 150;
let headDriftTarget = 0;
let headDriftCurrent = 0;

// Dilatazione pupille
let pupilScale = 1;
let pupilScaleTarget = 1;
let pupilTimer = 0;
let pupilNextAt = 180 + Math.random() * 240;

// Wander
let wanderActive = false;
let wanderTimer = 0;
let wanderNextAt = 120 + Math.random() * 180;
let wanderTargetX = 0;
let wanderTargetY = 0;
let wanderReturnTimer = 0;

// Saccadi
let saccadeTimer = 0;
let saccadeNextAt = 15 + Math.random() * 25;
let saccadeX = 0, saccadeY = 0;
let saccadeTargetX = 0, saccadeTargetY = 0;

// Riflessione
let reflectionTimer = 0;
let reflectionNextAt = 1500 + Math.random() * 1500;
let reflectionActive = 0;
let reflectionPhase = 0;
let reflectionTotalFrames = 180;

// Respirazione irregolare
let breathPhaseA = 0;
let breathPhaseB = 0;
let breathPhaseC = 0;
let breathCycleTimer = 0;
let breathCycleDuration = 180 + Math.random() * 120;
let currentBreathOffset = 0;

// === SPECIFICO TRON ===
// Riflessi digitali che scorrono lungo il viso
let digitalScanPos = 0;
let digitalScanSpeed = 0.8;

// Pannelli tecnici che appaiono e scompaiono
let panels = [];
let panelTimer = 0;
let panelNextAt = 200 + Math.random() * 300;

// Linee decorative sulla testa
let circuitPulse = 0;

// Sguardo
let eyeTargetX = 0, eyeTargetY = 0;
let eyeCurrentX = 0, eyeCurrentY = 0;
let mouseIsActive = false;
let mouseMovedTimer = 0;

// Emozione
let currentEmotion = { browAngle: 0, browHeight: 0, mouthCurve: 0, eyeOpen: 1, mouthWidth: 80, headTilt: 0 };
let targetEmotion = { ...currentEmotion };

const EMOTION_KEYWORDS = {
  felice: ['ciao','benvenuto','grazie','felice','bene','ottimo','grande','bello','amore','contento','evviva','bravo','sorriso','piacere'],
  triste: ['purtroppo','triste','male','problema','difficile','brutto','dispiace','sofferenza','dolore','solo','perdere'],
  arrabbiato: ['attenzione','pericolo','errore','grave','rabbia','basta','no','mai','inaccettabile','sbagliato'],
  sorpreso: ['wow','incredibile','davvero','improvviso','inaspettato','sorpresa','caspita','accidenti','oh']
};
let activeEmotion = 'neutro';

// ============================================================
// WEB AUDIO
// ============================================================
let audioCtx = null;
let ambientOsc = null;
let ambientGain = null;
let ambientFilter = null;

function initAudioContext() {
  if (audioCtx) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  } catch (e) {
    console.warn('Web Audio non disponibile', e);
  }
}

function startAmbient() {
  if (!audioCtx || !AUDIO_CONFIG.enabled) return;
  if (ambientOsc) return;
  ambientOsc = audioCtx.createOscillator();
  ambientOsc.type = 'sine';
  ambientOsc.frequency.value = 70;
  ambientGain = audioCtx.createGain();
  ambientGain.gain.value = 0;
  ambientGain.gain.linearRampToValueAtTime(AUDIO_CONFIG.ambientVolume, audioCtx.currentTime + 0.5);
  ambientFilter = audioCtx.createBiquadFilter();
  ambientFilter.type = 'lowpass';
  ambientFilter.frequency.value = 200;
  ambientOsc.connect(ambientFilter);
  ambientFilter.connect(ambientGain);
  ambientGain.connect(audioCtx.destination);
  ambientOsc.start();
}

function stopAmbient() {
  if (!ambientOsc) return;
  const now = audioCtx.currentTime;
  ambientGain.gain.cancelScheduledValues(now);
  ambientGain.gain.linearRampToValueAtTime(0, now + 0.4);
  const osc = ambientOsc;
  const gain = ambientGain;
  ambientOsc = null;
  ambientGain = null;
  ambientFilter = null;
  setTimeout(() => {
    try { osc.stop(); } catch(e){}
    try { osc.disconnect(); } catch(e){}
    try { gain.disconnect(); } catch(e){}
  }, 500);
}

function playBeep(freq, duration, volume, type) {
  if (!audioCtx || !AUDIO_CONFIG.enabled) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type || 'sine';
  osc.frequency.value = freq;
  gain.gain.value = 0;
  gain.gain.linearRampToValueAtTime(volume, audioCtx.currentTime + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration + 0.05);
}

function playSyllableBeep(syllable) {
  if (!audioCtx || !AUDIO_CONFIG.enabled) return;
  // Tono pulito, sinusoidale, per lo stile Tron
  let freq = 440;
  if (syllable.includes('a')) freq = 440;
  else if (syllable.includes('o')) freq = 392;
  else if (syllable.includes('e')) freq = 494;
  else if (syllable.includes('u')) freq = 349;
  else if (syllable.includes('i')) freq = 523;
  else freq = 294;
  freq += (Math.random() - 0.5) * 20;
  playBeep(freq, 0.06, AUDIO_CONFIG.syllableVolume, 'sine');
}

function playStartBeep() {
  if (!audioCtx || !AUDIO_CONFIG.enabled) return;
  playBeep(523, 0.10, AUDIO_CONFIG.startBeepVolume, 'sine');
  setTimeout(() => playBeep(784, 0.12, AUDIO_CONFIG.startBeepVolume, 'sine'), 100);
  setTimeout(() => playBeep(1046, 0.14, AUDIO_CONFIG.startBeepVolume, 'sine'), 200);
}

function playEndBeep() {
  if (!audioCtx || !AUDIO_CONFIG.enabled) return;
  playBeep(1046, 0.10, AUDIO_CONFIG.endBeepVolume, 'sine');
  setTimeout(() => playBeep(784, 0.12, AUDIO_CONFIG.endBeepVolume, 'sine'), 100);
  setTimeout(() => playBeep(523, 0.14, AUDIO_CONFIG.endBeepVolume, 'sine'), 200);
}

// ============================================================
// PARTICELLE (pochissime, minime)
// ============================================================
let particles = [];
class Particle {
  constructor() { this.reset(); this.y = Math.random() * canvas.height; }
  reset() {
    this.x = Math.random() * canvas.width;
    this.y = canvas.height + 20;
    this.sizeBase = Math.random() * 1 + 0.3;
    this.size = this.sizeBase;
    this.speedBase = Math.random() * 0.2 + 0.1;
    this.speed = this.speedBase;
    this.alphaBase = Math.random() * 0.25 + 0.08;
    this.alpha = this.alphaBase;
    this.wobble = Math.random() * Math.PI * 2;
    this.wobbleSpeed = Math.random() * 0.01 + 0.005;
  }
  update(intensity) {
    this.speed = this.speedBase * (1 + intensity * 1.5);
    this.size = this.sizeBase * (1 + intensity * 1);
    this.alpha = Math.min(0.6, this.alphaBase * (1 + intensity * 1.2));
    this.wobble += this.wobbleSpeed * (1 + intensity * 1.2);
    this.y -= this.speed;
    this.x += Math.sin(this.wobble) * (0.2 + intensity * 0.8);
    if (this.y < -20) this.reset();
  }
  draw() {
    ctx.save();
    ctx.globalAlpha = this.alpha;
    ctx.fillStyle = COLOR_ACCENT;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}
for (let i = 0; i < 15; i++) particles.push(new Particle());

// ============================================================
// SILLABE
// ============================================================
function getSyllables(text) {
  const words = text.toLowerCase().match(/[a-zàèéìòù]+/g) || [];
  const result = [];
  const vowels = 'aeiouàèéìòù';
  for (const word of words) {
    let currentSyl = '';
    for (let i = 0; i < word.length; i++) {
      currentSyl += word[i];
      const isVowel = vowels.includes(word[i]);
      const nextIsVowel = i + 1 < word.length && vowels.includes(word[i + 1]);
      if (isVowel && !nextIsVowel) { result.push(currentSyl); currentSyl = ''; }
    }
    if (currentSyl) result.push(currentSyl);
  }
  return result;
}

function extractWords(text) {
  const words = [];
  const regex = /[a-zA-ZàèéìòùÀÈÉÌÒÙ]+/g;
  let m;
  while ((m = regex.exec(text)) !== null) {
    words.push({ word: m[0].toLowerCase(), index: m.index });
  }
  return words;
}

// ============================================================
// VOCI
// ============================================================
let selectedVoice = null;
function pickItalianVoice() {
  const voices = speechSynthesis.getVoices();
  if (!voices.length) return null;
  let v = voices.find(v => v.lang === 'it-IT');
  if (!v) v = voices.find(v => v.lang && v.lang.startsWith('it'));
  if (!v) v = voices.find(v => v.lang && v.lang.startsWith('en'));
  return v || voices[0];
}
function loadVoices() {
  const v = pickItalianVoice();
  if (v) { selectedVoice = v; console.log('[Avatar] Voce:', v.name, v.lang); }
}
if ('speechSynthesis' in window) {
  speechSynthesis.onvoiceschanged = loadVoices;
  loadVoices();
}

// ============================================================
// EMOZIONI
// ============================================================
function detectEmotionForWord(word) {
  for (const [emotion, keywords] of Object.entries(EMOTION_KEYWORDS)) {
    if (keywords.includes(word)) return emotion;
  }
  return null;
}
function emotionParams(emotion) {
  // Nello stile Tron le espressioni sono più sottili
  switch (emotion) {
    case 'felice':    return { browAngle: 0.25, browHeight: -4, mouthCurve: 0.85, eyeOpen: 0.95, mouthWidth: 85, headTilt: 0.015 };
    case 'triste':    return { browAngle: -0.6, browHeight: 6, mouthCurve: -0.85, eyeOpen: 0.8, mouthWidth: 70, headTilt: -0.04 };
    case 'arrabbiato':return { browAngle: -1.0, browHeight: 4, mouthCurve: -0.6, eyeOpen: 0.75, mouthWidth: 80, headTilt: 0 };
    case 'sorpreso':  return { browAngle: 0.5, browHeight: -11, mouthCurve: 0, eyeOpen: 1.4, mouthWidth: 75, headTilt: 0 };
    default:          return { browAngle: 0, browHeight: 0, mouthCurve: 0, eyeOpen: 1, mouthWidth: 80, headTilt: 0 };
  }
}

let wordsInText = [];
let wordCursor = 0;
let emotionHoldFrames = 0;

function processNextWord() {
  if (wordCursor >= wordsInText.length) return;
  const w = wordsInText[wordCursor];
  const detected = detectEmotionForWord(w.word);
  if (detected) { activeEmotion = detected; emotionHoldFrames = 90; }
  wordCursor++;
}

// ============================================================
// BOCCA
// ============================================================
let syllables = [];
let currentSyllableIndex = 0;
let syllableTimer = 0;
let framesPerSyllable = 8;
let lastBeepedSyllable = -1;

function updateMouthAnimation() {
  if (!isSpeaking) {
    targetMouthOpen = 0.02 + Math.abs(Math.sin(time * 0.5)) * 0.03;
    return;
  }
  syllableTimer++;
  if (syllableTimer >= framesPerSyllable) {
    syllableTimer = 0;
    currentSyllableIndex++;
    if (currentSyllableIndex >= syllables.length) currentSyllableIndex = 0;
    if (currentSyllableIndex !== lastBeepedSyllable) {
      lastBeepedSyllable = currentSyllableIndex;
      playSyllableBeep(syllables[currentSyllableIndex] || '');
    }
    const syl = syllables[currentSyllableIndex] || '';
    framesPerSyllable = 6 + Math.random() * 4 + Math.min(4, syl.length);
  }
  const syl = syllables[currentSyllableIndex] || '';
  let openness = 0.4;
  if (syl.includes('a')) openness = 0.95;
  else if (syl.includes('o')) openness = 0.85;
  else if (syl.includes('e')) openness = 0.7;
  else if (syl.includes('u')) openness = 0.55;
  else if (syl.includes('i')) openness = 0.45;
  else openness = 0.2;
  openness += (Math.random() - 0.5) * 0.1;
  targetMouthOpen = Math.max(0.04, Math.min(0.9, openness));
}

// ============================================================
// ANIMAZIONI
// ============================================================
function lerp(a, b, t) { return a + (b - a) * t; }

function updateEmotionAnimation() {
  if (emotionHoldFrames > 0) {
    emotionHoldFrames--;
    if (emotionHoldFrames === 0) activeEmotion = 'neutro';
  }
  const params = emotionParams(activeEmotion);
  Object.keys(params).forEach(k => targetEmotion[k] = params[k]);
  Object.keys(currentEmotion).forEach(k => {
    currentEmotion[k] = lerp(currentEmotion[k], targetEmotion[k], 0.1);
  });
}

function updateBreath() {
  breathPhaseA += 0.016;
  breathPhaseB += 0.034;
  breathPhaseC += 0.007;
  const base = Math.sin(breathPhaseA) * 2;
  const harmonic = Math.sin(breathPhaseB) * 0.6;
  const drift = Math.sin(breathPhaseC) * 1.0;
  currentBreathOffset = base + harmonic + drift;
  breathCycleTimer++;
  if (breathCycleTimer > breathCycleDuration) {
    breathCycleTimer = 0;
    breathCycleDuration = 180 + Math.random() * 180;
  }
}
function getBreathOffset() { return currentBreathOffset; }

function updateBlink() {
  blinkTimer++;
  if (doubleBlink) {
    doubleBlinkDelay++;
    if (doubleBlinkDelay > 15 && doubleBlinkDelay < 20) eyeBlink = 1;
    else if (doubleBlinkDelay >= 20 && doubleBlinkDelay < 25) eyeBlink = 0;
    else if (doubleBlinkDelay >= 25 && doubleBlinkDelay < 30) eyeBlink = 1;
    else if (doubleBlinkDelay >= 30) {
      eyeBlink = 0; doubleBlink = false; doubleBlinkDelay = 0;
      nextBlinkAt = blinkTimer + 150 + Math.random() * 200;
    }
    return;
  }
  if (blinkTimer >= nextBlinkAt) {
    eyeBlink = 1;
    if (blinkTimer >= nextBlinkAt + 6) {
      eyeBlink = 0;
      if (Math.random() < 0.2) { doubleBlink = true; doubleBlinkDelay = 0; }
      else nextBlinkAt = blinkTimer + 150 + Math.random() * 200;
    }
  }
}

function updateYawn() {
  if (isSpeaking) { yawnActive = 0; return; }
  yawnTimer++;
  if (yawnTimer > yawnCooldown && yawnActive === 0) { yawnActive = 0.01; yawnPhase = 0; }
  if (yawnActive > 0) {
    yawnPhase++;
    const totalFrames = 120;
    if (yawnPhase < 40) yawnActive = yawnPhase / 40;
    else if (yawnPhase < 80) yawnActive = 1;
    else if (yawnPhase < totalFrames) yawnActive = 1 - (yawnPhase - 80) / 40;
    else { yawnActive = 0; yawnTimer = 0; yawnCooldown = 800 + Math.random() * 800; }
  }
}

function updateMouthTwitch() {
  if (isSpeaking) {
    mouthTwitchActive = lerp(mouthTwitchActive, 0, 0.15);
    mouthTwitchTimer = 0;
    return;
  }
  mouthTwitchTimer++;
  if (mouthTwitchTimer > mouthTwitchNextAt && mouthTwitchActive < 0.01) {
    mouthTwitchActive = 0.01;
    mouthTwitchPhase = 0;
    mouthTwitchDir = Math.random() < 0.5 ? 1 : -1;
  }
  if (mouthTwitchActive > 0) {
    mouthTwitchPhase++;
    const totalFrames = 45 + Math.random() * 20;
    if (mouthTwitchPhase < totalFrames * 0.35) {
      mouthTwitchActive = mouthTwitchPhase / (totalFrames * 0.35);
    } else if (mouthTwitchPhase < totalFrames * 0.65) {
      mouthTwitchActive = 1;
    } else if (mouthTwitchPhase < totalFrames) {
      mouthTwitchActive = 1 - (mouthTwitchPhase - totalFrames * 0.65) / (totalFrames * 0.35);
    } else {
      mouthTwitchActive = 0;
      mouthTwitchTimer = 0;
      mouthTwitchNextAt = 180 + Math.random() * 300;
    }
  }
}

function updateBrowTwitch() {
  if (isSpeaking) {
    browTwitchActive = lerp(browTwitchActive, 0, 0.15);
    browTwitchAmount = lerp(browTwitchAmount, 0, 0.1);
    return;
  }
  browTwitchTimer++;
  if (browTwitchTimer > browTwitchNextAt && browTwitchActive < 0.01) {
    browTwitchActive = 0.01;
    browTwitchPhase = 0;
  }
  if (browTwitchActive > 0) {
    browTwitchPhase++;
    const totalFrames = 40 + Math.random() * 30;
    if (browTwitchPhase < totalFrames * 0.4) {
      browTwitchActive = browTwitchPhase / (totalFrames * 0.4);
    } else if (browTwitchPhase < totalFrames * 0.6) {
      browTwitchActive = 1;
    } else if (browTwitchPhase < totalFrames) {
      browTwitchActive = 1 - (browTwitchPhase - totalFrames * 0.6) / (totalFrames * 0.4);
    } else {
      browTwitchActive = 0;
      browTwitchTimer = 0;
      browTwitchNextAt = 150 + Math.random() * 250;
    }
  }
  // Movimento più piccolo, stile Tron
  const targetAmount = browTwitchActive * (1.5 + Math.random() * 1.5);
  browTwitchAmount = lerp(browTwitchAmount, targetAmount, 0.15);
}

function updateHeadDrift() {
  if (isSpeaking) {
    headDriftTarget = 0;
    headDriftCurrent = lerp(headDriftCurrent, 0, 0.08);
    return;
  }
  headDriftTimer++;
  if (headDriftTimer > headDriftNextAt) {
    headDriftTarget = (Math.random() - 0.5) * 0.04;
    headDriftTimer = 0;
    headDriftNextAt = 120 + Math.random() * 200;
  }
  headDriftCurrent = lerp(headDriftCurrent, headDriftTarget, 0.02);
}

function updatePupilDilation() {
  pupilTimer++;
  if (pupilTimer > pupilNextAt) {
    pupilScaleTarget = 0.9 + Math.random() * 0.2;
    pupilTimer = 0;
    pupilNextAt = 120 + Math.random() * 240;
  }
  pupilScale = lerp(pupilScale, pupilScaleTarget, 0.02);
}

function updateWander() {
  if (isSpeaking) { wanderActive = false; return; }
  if (mouseIsActive) { wanderActive = false; return; }
  wanderTimer++;
  if (wanderTimer > wanderNextAt) {
    wanderTargetX = (Math.random() - 0.5) * 8;
    wanderTargetY = (Math.random() - 0.5) * 5;
    wanderTimer = 0;
    wanderNextAt = 90 + Math.random() * 180;
    wanderActive = true;
    wanderReturnTimer = 0;
  }
  if (wanderActive) {
    wanderReturnTimer++;
    if (wanderReturnTimer > 120) {
      wanderTargetX = 0; wanderTargetY = 0;
      wanderActive = false;
    }
  }
}

function updateSaccades() {
  if (isSpeaking) {
    saccadeX = lerp(saccadeX, 0, 0.2);
    saccadeY = lerp(saccadeY, 0, 0.2);
    return;
  }
  saccadeTimer++;
  if (saccadeTimer > saccadeNextAt) {
    saccadeTargetX = (Math.random() - 0.5) * 1.5;
    saccadeTargetY = (Math.random() - 0.5) * 1.2;
    saccadeTimer = 0;
    saccadeNextAt = 15 + Math.random() * 25;
  }
  saccadeX = lerp(saccadeX, saccadeTargetX, 0.4);
  saccadeY = lerp(saccadeY, saccadeTargetY, 0.4);
}

function updateReflection() {
  if (isSpeaking) {
    reflectionActive = 0;
    reflectionTimer = 0;
    return;
  }
  reflectionTimer++;
  if (reflectionTimer > reflectionNextAt && reflectionActive === 0) {
    reflectionActive = 0.01;
    reflectionPhase = 0;
  }
  if (reflectionActive > 0) {
    reflectionPhase++;
    const totalFrames = reflectionTotalFrames;
    if (reflectionPhase < totalFrames * 0.2) {
      reflectionActive = reflectionPhase / (totalFrames * 0.2);
    } else if (reflectionPhase < totalFrames * 0.7) {
      reflectionActive = 1;
    } else if (reflectionPhase < totalFrames) {
      reflectionActive = 1 - (reflectionPhase - totalFrames * 0.7) / (totalFrames * 0.3);
    } else {
      reflectionActive = 0;
      reflectionTimer = 0;
      reflectionNextAt = 1500 + Math.random() * 1500;
    }
  }
}

document.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  const ccx = rect.left + rect.width / 2;
  const ccy = rect.top + rect.height / 2;
  const dx = e.clientX - ccx, dy = e.clientY - ccy;
  const dist = Math.sqrt(dx*dx + dy*dy);
  const maxOffset = 5;
  if (dist > 0) {
    const factor = Math.min(1, dist / 400);
    eyeTargetX = (dx / dist) * maxOffset * factor;
    eyeTargetY = (dy / dist) * maxOffset * factor;
  }
  mouseIsActive = true;
  mouseMovedTimer = 0;
});

function updateGaze() {
  mouseMovedTimer++;
  if (mouseMovedTimer > 180) mouseIsActive = false;
  if (isSpeaking) {
    eyeTargetX = Math.sin(time * 0.5) * 1.2;
    eyeTargetY = Math.sin(time * 0.7) * 0.8;
  } else if (mouseIsActive) {
    // già aggiornato
  } else if (wanderActive) {
    eyeTargetX = wanderTargetX;
    eyeTargetY = wanderTargetY;
  } else {
    eyeTargetX = lerp(eyeTargetX, 0, 0.03);
    eyeTargetY = lerp(eyeTargetY, 0, 0.03);
  }
  eyeCurrentX = lerp(eyeCurrentX, eyeTargetX, 0.08);
  eyeCurrentY = lerp(eyeCurrentY, eyeTargetY, 0.08);
}

// === SPECIFICO TRON ===
function updateDigitalScan() {
  digitalScanPos += digitalScanSpeed;
  if (digitalScanPos > 500) digitalScanPos = -20;
}

function updatePanels() {
  panelTimer++;
  if (panelTimer > panelNextAt) {
    panelTimer = 0;
    panelNextAt = 200 + Math.random() * 400;
    // Crea un piccolo pannello tecnico attorno al viso
    const angle = Math.random() * Math.PI * 2;
    const radius = 150 + Math.random() * 40;
    panels.push({
      x: 250 + Math.cos(angle) * radius,
      y: 250 + Math.sin(angle) * radius,
      w: 20 + Math.random() * 30,
      h: 6 + Math.random() * 8,
      alpha: 1,
      life: 120,
      text: Math.random() < 0.5 ? '/' : '.'
    });
  }
  for (let i = panels.length - 1; i >= 0; i--) {
    panels[i].life--;
    if (panels[i].life < 30) panels[i].alpha = panels[i].life / 30;
    if (panels[i].life <= 0) panels.splice(i, 1);
  }
}

function updateCircuitPulse() {
  circuitPulse += 0.04;
}

function updateUptime() {
  const elapsed = Math.floor((Date.now() - startTime) / 1000);
  const m = String(Math.floor(elapsed / 60)).padStart(2, '0');
  const s = String(elapsed % 60).padStart(2, '0');
  uptimeEl.textContent = m + ':' + s;
}
setInterval(updateUptime, 1000);

// ============================================================
// DISEGNO — STILE TRON LINE-ART
// ============================================================
function drawAvatar() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  time += 0.02;

  updateMouthAnimation();
  updateEmotionAnimation();
  updateBreath();
  updateBlink();
  updateYawn();
  updateMouthTwitch();
  updateBrowTwitch();
  updateHeadDrift();
  updatePupilDilation();
  updateWander();
  updateSaccades();
  updateReflection();
  updateGaze();
  updateDigitalScan();
  updatePanels();
  updateCircuitPulse();

  const baseIntensity = 0.1;
  const speakIntensity = isSpeaking ? Math.min(1, 0.3 + mouthOpen * 0.7) : 0;
  const intensity = Math.max(baseIntensity, speakIntensity);
  particles.forEach(p => { p.update(intensity); p.draw(); });

  const cx = canvas.width / 2;
  const cy = canvas.height / 2 + getBreathOffset();

  // === SCHELETRO DEL VISO ===
  drawFaceOutline(cx, cy);

  // === HEAD TILT + DRIFT ===
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(currentEmotion.headTilt + headDriftCurrent);
  ctx.translate(-cx, -cy);

  // Occhi (linee sottili)
  const reflectionOffsetY = reflectionActive * -4;
  const eyeY = cy - 30 + reflectionOffsetY;
  const eyeOffsetX = 55;
  const baseEyeRadius = 16;
  const reflectionEyeFactor = 1 - reflectionActive * 0.2;
  const eyeRadius = baseEyeRadius * currentEmotion.eyeOpen * reflectionEyeFactor;

  drawEye(cx - eyeOffsetX, eyeY, eyeRadius);
  drawEye(cx + eyeOffsetX, eyeY, eyeRadius);

  // Sopracciglia (linee precise)
  const reflectionBrowOffset = reflectionActive * 2;
  drawEyebrow(cx - eyeOffsetX, eyeY - eyeRadius - 10 - reflectionBrowOffset, 1);
  drawEyebrow(cx + eyeOffsetX, eyeY - eyeRadius - 10 - reflectionBrowOffset, -1);

  // Naso (linea breve sottile)
  ctx.save();
  ctx.strokeStyle = COLOR_MAIN;
  ctx.globalAlpha = 0.5;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(cx, eyeY + 22);
  ctx.lineTo(cx, cy + 22);
  ctx.stroke();
  ctx.restore();

  // Bocca
  drawMouth(cx, cy + 70);
  mouthOpen += (targetMouthOpen - mouthOpen) * 0.3;

  ctx.restore();

  // === SCANSIONE DIGITALE ===
  drawDigitalScan(cx, cy);

  // === PANNELLI TECNICI ===
  drawPanels();

  // === LINEE DECORATIVE ===
  drawDecorativeLines(cx, cy);
}

// Contorno del viso (profilo stilizzato in stile Tron)
function drawFaceOutline(cx, cy) {
  ctx.save();
  ctx.strokeStyle = COLOR_MAIN;
  ctx.lineWidth = 1.2;
  ctx.globalAlpha = 0.85;

  // Non un cerchio ma un "profilo" con spigoli
  // Forma a goccia / ottagono allungato
  ctx.beginPath();
  const points = [
    { x: cx - 90, y: cy - 90 },     // tempia sinistra alta
    { x: cx - 105, y: cy - 30 },    // tempia sinistra media
    { x: cx - 95, y: cy + 30 },     // zigomo sinistro
    { x: cx - 70, y: cy + 80 },     // guancia sinistra
    { x: cx - 30, y: cy + 110 },    // mento sinistro
    { x: cx + 30, y: cy + 110 },    // mento destro
    { x: cx + 70, y: cy + 80 },     // guancia destra
    { x: cx + 95, y: cy + 30 },     // zigomo destro
    { x: cx + 105, y: cy - 30 },    // tempia destra media
    { x: cx + 90, y: cy - 90 },     // tempia destra alta
    { x: cx + 55, y: cy - 120 },    // fronte destra
    { x: cx - 55, y: cy - 120 }     // fronte sinistra
  ];
  points.forEach((p, i) => {
    if (i === 0) ctx.moveTo(p.x, p.y);
    else ctx.lineTo(p.x, p.y);
  });
  ctx.closePath();
  ctx.stroke();

  // Linee interne decorative (circuiti stilizzati)
  ctx.globalAlpha = 0.35;
  ctx.lineWidth = 0.8;

  // Linea frontale
  ctx.beginPath();
  ctx.moveTo(cx - 55, cy - 120);
  ctx.lineTo(cx - 40, cy - 135);
  ctx.lineTo(cx + 40, cy - 135);
  ctx.lineTo(cx + 55, cy - 120);
  ctx.stroke();

  // Segmenti laterali (tempie)
  ctx.beginPath();
  ctx.moveTo(cx - 90, cy - 90);
  ctx.lineTo(cx - 120, cy - 60);
  ctx.moveTo(cx - 105, cy - 30);
  ctx.lineTo(cx - 125, cy - 10);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(cx + 90, cy - 90);
  ctx.lineTo(cx + 120, cy - 60);
  ctx.moveTo(cx + 105, cy - 30);
  ctx.lineTo(cx + 125, cy - 10);
  ctx.stroke();

  // Punto al centro della fronte
  ctx.globalAlpha = 0.6;
  ctx.fillStyle = COLOR_ACCENT;
  ctx.beginPath();
  ctx.arc(cx, cy - 130, 1.5, 0, Math.PI * 2);
  ctx.fill();

  // Linea "collo" sotto
  ctx.globalAlpha = 0.5;
  ctx.strokeStyle = COLOR_MAIN;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(cx - 40, cy + 110);
  ctx.lineTo(cx - 30, cy + 150);
  ctx.lineTo(cx + 30, cy + 150);
  ctx.lineTo(cx + 40, cy + 110);
  ctx.stroke();

  ctx.restore();
}

function drawEye(x, y, radius) {
  ctx.save();
  ctx.strokeStyle = COLOR_MAIN;
  ctx.lineWidth = 1.3;
  ctx.globalAlpha = 0.9;

  if (eyeBlink > 0) {
    // Palpebra chiusa = linea orizzontale
    ctx.beginPath();
    ctx.moveTo(x - radius, y);
    ctx.lineTo(x + radius, y);
    ctx.stroke();
  } else {
    // Occhio = due archi (non cerchio completo) per stile Tron
    ctx.beginPath();
    ctx.arc(x, y, radius, 0, Math.PI * 2);
    ctx.stroke();

    // Pupilla: un piccolo cerchio pieno ciano con un alone
    const pupilX = x + eyeCurrentX + saccadeX + Math.sin(time * 0.7) * 1.2;
    const pupilY = y + eyeCurrentY + saccadeY + Math.sin(time * 1.1) * 1.2;
    const pupilRadius = radius * 0.35 * pupilScale;

    ctx.fillStyle = COLOR_ACCENT;
    ctx.globalAlpha = 0.9;
    ctx.beginPath();
    ctx.arc(pupilX, pupilY, pupilRadius, 0, Math.PI * 2);
    ctx.fill();

    // Punto bianco
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(pupilX - 2, pupilY - 2, Math.max(0.8, radius * 0.08), 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function drawEyebrow(x, y, side) {
  const w = 26;
  const angle = currentEmotion.browAngle * 0.3;
  const offsetY = currentEmotion.browHeight - browTwitchAmount;
  const reflectAngle = reflectionActive * -0.1 * side;
  const finalAngle = angle + reflectAngle;

  ctx.save();
  ctx.strokeStyle = COLOR_MAIN;
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  ctx.globalAlpha = 0.85;

  const innerX = x - side * w / 2;
  const outerX = x + side * w / 2;
  const innerY = y + offsetY + finalAngle * w * 0.5;
  const outerY = y + offsetY - finalAngle * w * 0.5;

  ctx.beginPath();
  ctx.moveTo(innerX, innerY);
  ctx.lineTo(outerX, outerY);
  ctx.stroke();
  ctx.restore();
}

function drawMouth(x, y) {
  ctx.save();
  ctx.strokeStyle = COLOR_MAIN;
  ctx.lineWidth = 1.4;
  ctx.globalAlpha = 0.9;

  const yawnOpen = yawnActive * 0.9;
  const combinedOpen = Math.max(mouthOpen, yawnOpen);
  const mouthWidth = currentEmotion.mouthWidth;
  const maxOpenHeight = 42;   // più piccola della versione precedente
  const openHeight = maxOpenHeight * combinedOpen;
  const reflectionCurve = reflectionActive * -0.4;

  if (openHeight > 5) {
    // Bocca aperta: ellisse sottile
    const twitchOffsetY = mouthTwitchActive * mouthTwitchDir * 1;
    ctx.beginPath();
    ctx.ellipse(x, y + twitchOffsetY, mouthWidth / 2, openHeight / 2, 0, 0, Math.PI * 2);
    ctx.stroke();
    // Piccola linea interna per profondità
    if (combinedOpen > 0.4) {
      ctx.globalAlpha = 0.5;
      ctx.beginPath();
      ctx.ellipse(x, y + twitchOffsetY, mouthWidth / 2 - 3, openHeight / 2 - 3, 0, 0, Math.PI * 2);
      ctx.stroke();
    }
  } else {
    // Bocca chiusa: linea curva precisa
    const curve = currentEmotion.mouthCurve + reflectionCurve;
    const twitchCurve = mouthTwitchActive * mouthTwitchDir * 0.5;
    const totalCurve = curve + twitchCurve;
    const halfW = mouthWidth / 2;
    const controlY = y + totalCurve * 18;
    ctx.beginPath();
    ctx.moveTo(x - halfW, y);
    ctx.quadraticCurveTo(x, controlY, x + halfW, y);
    ctx.stroke();
  }
  ctx.restore();
}

// Scansione digitale che attraversa il viso
function drawDigitalScan(cx, cy) {
  const x0 = cx - 110;
  const x1 = cx + 110;
  const yScan = cy - 140 + (digitalScanPos % 280);

  ctx.save();
  ctx.strokeStyle = COLOR_ACCENT;
  ctx.globalAlpha = 0.4;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(x0, yScan);
  ctx.lineTo(x1, yScan);
  ctx.stroke();

  // Bagliore
  ctx.globalAlpha = 0.15;
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(x0, yScan);
  ctx.lineTo(x1, yScan);
  ctx.stroke();
  ctx.restore();
}

// Pannelli tecnici
function drawPanels() {
  ctx.save();
  panels.forEach(p => {
    ctx.globalAlpha = p.alpha * 0.6;
    ctx.strokeStyle = COLOR_ACCENT;
    ctx.lineWidth = 0.8;

    // Cornice
    ctx.strokeRect(p.x - p.w / 2, p.y - p.h / 2, p.w, p.h);

    // Piccola linea diagonale decorativa
    ctx.beginPath();
    ctx.moveTo(p.x - p.w / 2, p.y);
    ctx.lineTo(p.x + p.w / 2, p.y);
    ctx.stroke();
  });
  ctx.restore();
}

// Linee decorative (circuiti)
function drawDecorativeLines(cx, cy) {
  ctx.save();
  ctx.strokeStyle = COLOR_ACCENT;
  ctx.globalAlpha = 0.25 + Math.sin(circuitPulse) * 0.1;
  ctx.lineWidth = 0.6;

  // Rettangoli concentrici molto sottili attorno al viso
  const pulse = 1 + Math.sin(circuitPulse) * 0.02;
  ctx.beginPath();
  ctx.rect(cx - 140 * pulse, cy - 140 * pulse, 280 * pulse, 280 * pulse);
  ctx.stroke();

  ctx.beginPath();
  ctx.rect(cx - 160 * pulse, cy - 160 * pulse, 320 * pulse, 320 * pulse);
  ctx.globalAlpha = 0.15;
  ctx.stroke();

  // Piccoli trattini sugli angoli
  ctx.globalAlpha = 0.5;
  const c = 8;
  const s = 140 * pulse;
  // Top-left
  ctx.beginPath();
  ctx.moveTo(cx - s, cy - s + c); ctx.lineTo(cx - s, cy - s); ctx.lineTo(cx - s + c, cy - s);
  ctx.stroke();
  // Top-right
  ctx.beginPath();
  ctx.moveTo(cx + s - c, cy - s); ctx.lineTo(cx + s, cy - s); ctx.lineTo(cx + s, cy - s + c);
  ctx.stroke();
  // Bottom-left
  ctx.beginPath();
  ctx.moveTo(cx - s, cy + s - c); ctx.lineTo(cx - s, cy + s); ctx.lineTo(cx - s + c, cy + s);
  ctx.stroke();
  // Bottom-right
  ctx.beginPath();
  ctx.moveTo(cx + s - c, cy + s); ctx.lineTo(cx + s, cy + s); ctx.lineTo(cx + s, cy + s - c);
  ctx.stroke();

  ctx.restore();
}

// ============================================================
// LOOP
// ============================================================
function renderLoop() {
  drawAvatar();
  requestAnimationFrame(renderLoop);
}

// ============================================================
// SINTESI VOCALE + TOGGLE
// ============================================================
let utterance = null;
let fallbackWordInterval = null;

function updateStatus(text, cls) {
  statusEl.innerText = text;
  statusEl.classList.remove('speaking', 'done');
  if (cls) statusEl.classList.add(cls);
}

function speak() {
  if (!('speechSynthesis' in window)) {
    updateStatus('sintesi vocale non supportata');
    return;
  }
  window.speechSynthesis.cancel();
  if (fallbackWordInterval) { clearInterval(fallbackWordInterval); fallbackWordInterval = null; }

  initAudioContext();
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

  syllables = getSyllables(TESTO);
  wordsInText = extractWords(TESTO);
  currentSyllableIndex = 0;
  syllableTimer = 0;
  framesPerSyllable = 8;
  wordCursor = 0;
  activeEmotion = 'neutro';
  emotionHoldFrames = 0;
  lastBeepedSyllable = -1;

  utterance = new SpeechSynthesisUtterance(TESTO);
  utterance.lang = 'it-IT';
  utterance.rate = 0.95;
  utterance.pitch = 1.05;
  utterance.volume = 1;
  if (selectedVoice) utterance.voice = selectedVoice;

  utterance.onstart = () => {
    isSpeaking = true;
    container.classList.add('speaking');
    updateStatus('clicca per fermare', 'speaking');
    playStartBeep();
    startAmbient();
  };

  utterance.onboundary = (e) => {
    if (e.name === 'word') processNextWord();
  };

  utterance.onend = () => {
    isSpeaking = false;
    targetMouthOpen = 0;
    activeEmotion = 'neutro';
    emotionHoldFrames = 0;
    container.classList.remove('speaking');
    updateStatus('fine — clicca per riascoltare', 'done');
    playEndBeep();
    stopAmbient();
    if (fallbackWordInterval) { clearInterval(fallbackWordInterval); fallbackWordInterval = null; }
  };

  utterance.onerror = (e) => {
    console.error(e);
    isSpeaking = false;
    targetMouthOpen = 0;
    activeEmotion = 'neutro';
    emotionHoldFrames = 0;
    container.classList.remove('speaking');
    updateStatus('errore — clicca per riprovare', 'done');
    stopAmbient();
    if (fallbackWordInterval) { clearInterval(fallbackWordInterval); fallbackWordInterval = null; }
  };

  fallbackWordInterval = setInterval(() => {
    if (!isSpeaking) { clearInterval(fallbackWordInterval); fallbackWordInterval = null; return; }
    processNextWord();
  }, 350);

  speechSynthesis.speak(utterance);
}

function stopSpeaking() {
  speechSynthesis.cancel();
  if (fallbackWordInterval) { clearInterval(fallbackWordInterval); fallbackWordInterval = null; }
  isSpeaking = false;
  targetMouthOpen = 0;
  activeEmotion = 'neutro';
  emotionHoldFrames = 0;
  container.classList.remove('speaking');
  updateStatus('clicca o premi un tasto');
  stopAmbient();
}

function toggleSpeech() {
  if (isSpeaking) stopSpeaking();
  else speak();
}

document.body.addEventListener('click', toggleSpeech);
document.body.addEventListener('touchstart', function(e) {
  e.preventDefault();
  toggleSpeech();
}, { passive: false });

document.addEventListener('keydown', (e) => {
  if (e.key === ' ' || e.key === 'Enter') {
    e.preventDefault();
    toggleSpeech();
  } else if (e.key === 'Escape') {
    if (isSpeaking) stopSpeaking();
  }
});

// ============================================================
// AVVIO
// ============================================================
renderLoop();
updateUptime();
</script>
