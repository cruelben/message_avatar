<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Desk Avatar — Tamagotchi</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background-color: #000d06; color: #00ff88;
    font-family: 'Courier New', Courier, monospace;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    background-image:
      radial-gradient(circle at 50% 50%, rgba(0,255,136,0.06) 0%, transparent 60%),
      linear-gradient(rgba(0,255,136,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,255,136,0.04) 1px, transparent 1px);
    background-size: 100% 100%, 30px 30px, 30px 30px;
    cursor: pointer;
    transition: background-color 1.5s ease;
    position: relative;
  }
  body.sleeping { background-color: #000a04; }

  #app {
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    transition: filter 1.2s ease;
    position: relative;
  }
  body.sleeping #app { filter: brightness(0.68); }

  .crt-overlay {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    background:
      linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.22) 50%),
      linear-gradient(90deg, rgba(255,0,0,0.05), rgba(0,255,0,0.02), rgba(0,0,255,0.05));
    background-size: 100% 4px, 6px 100%;
    pointer-events: none; z-index: 9999;
    animation: flicker 0.15s infinite;
    transition: opacity 1.2s ease;
  }
  body.sleeping .crt-overlay { opacity: 0.35; }
  @keyframes flicker { 0%{opacity:.95} 50%{opacity:.85} 100%{opacity:.95} }

  .avatar-container {
    position: relative;
    width: var(--size, 700px);
    height: var(--size, 700px);
    display: flex; justify-content: center; align-items: center;
    border: 1px solid rgba(0,255,157,0.28); border-radius: 28px; overflow: hidden;
    box-shadow: 0 0 30px rgba(0,255,157,0.08), inset 0 0 50px rgba(0,255,157,0.04);
    background: radial-gradient(circle at 50% 46%, rgba(0,255,157,0.10), rgba(0,0,0,0.14) 60%), rgba(0,0,0,0.20);
    transition: box-shadow 0.8s ease, border-color 0.8s ease;
    flex-shrink: 0;
    pointer-events: none;
  }
  .avatar-container.speaking {
    box-shadow: 0 0 60px rgba(0,255,157,0.22), inset 0 0 80px rgba(0,255,157,0.10);
  }
  .avatar-container.sleeping {
    box-shadow: 0 0 20px rgba(0,255,157,0.06), inset 0 0 36px rgba(0,255,157,0.03);
    border-color: rgba(0,85,51,0.7);
  }
  .avatar-container.greeting {
    box-shadow: 0 0 55px rgba(0,255,157,0.30), inset 0 0 70px rgba(0,255,157,0.14);
    border-color: rgba(0,255,157,0.8);
  }

  canvas {
    display: block;
    border-radius: 27px;
    width: 100%;
    height: 100%;
    cursor: pointer;
    touch-action: manipulation;
  }

  .status {
    position: fixed;
    bottom: 4vh;
    left: 50%;
    transform: translateX(-50%);
    font-size: clamp(10px, 1.4vw, 13px);
    color: #00cc66; text-transform: uppercase;
    letter-spacing: 3px; text-shadow: 0 0 10px #00ff88;
    text-align: center;
    pointer-events: none;
    transition: color 0.5s ease, opacity 0.8s ease;
    max-width: 90vw;
    padding: 0 12px;
    opacity: 0.35;
  }
  .status.sleeping { opacity: 0.22; color: #008855; }
  .status.talking { opacity: 0.75; color: #00ff88; }
  .status.greeting { opacity: 0.9; color: #00ffaa; }
  .status.muted { opacity: 0.9; color: #ffaa44; }
  .status.ready { opacity: 0.5; color: #00ff88; }
  .status.unlock { opacity: 0.95; color: #00ff88; }

  @media (max-height: 500px) {
    .status { bottom: 2vh; letter-spacing: 2px; }
    .avatar-container { border-radius: 22px; }
    canvas { border-radius: 21px; }
  }
</style>
</head>
<body>
<div id="app">
  <div class="avatar-container" id="avatarContainer">
    <canvas id="avatarCanvas" width="420" height="420" aria-label="Interactive neon avatar"></canvas>
  </div>
</div>
<div class="crt-overlay"></div>

<div class="status unlock" id="status">▶ tap once to enable sound</div>

<script>
// ============================================================
// CONFIG
// ============================================================
const MOOD_CONFIG = {
  // Micro-naps (rare short sleep while sitting at desk)
  microsleepMinMs: 3 * 60 * 1000,
  microsleepMaxMs: 12 * 60 * 1000,
  microsleepDurationMinMs: 3000,
  microsleepDurationMaxMs: 10000,

  // Idle behaviours while awake
  yawnMinMs: 90 * 1000,
  yawnMaxMs: 6 * 60 * 1000,

  expressionMinMs: 20 * 1000,
  expressionMaxMs: 70 * 1000,

  // Self-talk (rare, low voice)
  selfTalkMinMs: 45 * 60 * 1000,
  selfTalkMaxMs: 2 * 60 * 60 * 1000,

  greetDurationMs: 5000
};

const AUDIO_CONFIG = {
  chirpVolume: 0.045,
  greetVolume: 0.055,
  yawnVolume: 0.035,
  selfTalkVolume: 0.15,
  scheduledVolume: 0.85,
  enabled: true
};

const SELF_TALK_PHRASES = [
  "che ore sono?",
  "ho fame",
  "che palle",
  "mi annoio",
  "ancora qui?",
  "quasi ora di staccare",
  "un caffè, dai",
  "basta guardarmi",
  "quanto manca?",
  "che sonno"
];

const AWAKE_EXPRESSIONS = ['neutro', 'neutro', 'neutro', 'felice', 'annoiato', 'assonnato', 'sorpreso'];

const SCHEDULED_EVENTS = [
  { h: 11, m: 0,  text: " è l'ora del caffe, non fare lo stacanovista del cazzo" },
  { h: 12, m: 30, text: "tra un po chiudi e fai a farti la pausa fuori" },
  { h: 15, m: 0,  text: "che pomeriggio di m." },
  { h: 16, m: 0,  text: " è quasi finita" },
  { h: 16, m: 45, sequence: [
    "E' ora di fare un",
    "Lento",
    "SHAT DAAUNN!!!",
    "E' stato bello lavorare con voi",
    "chiudo",
    "E",
    "Mi levo dai coglioni",
    "Ciao Piera",
    "Ciao Marino",
    "quando uscite spegnete tutto",
    "",
    "cazzo!"
  ]}
];

const COLOR_MAIN = '#00ff88';
const COLOR_GLOW = 'rgba(0,255,136,0.8)';

// ============================================================
// DOM
// ============================================================
const canvas = document.getElementById('avatarCanvas');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');
const container = document.getElementById('avatarContainer');

// ============================================================
// HELPERS
// ============================================================
function rand(min, max) { return min + Math.random() * (max - min); }
function lerp(a, b, t) { return a + (b - a) * t; }

// ============================================================
// RESPONSIVE
// ============================================================
const LOGICAL_SIZE = 420;
function fitAvatar() {
  const availableW = window.innerWidth * 0.96;
  const availableH = window.innerHeight * 0.76;
  const sizeCss = Math.max(160, Math.min(availableW, availableH, 700));
  document.documentElement.style.setProperty('--size', sizeCss + 'px');
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  const needed = Math.round(sizeCss * dpr);
  if (canvas.width !== needed || canvas.height !== needed) {
    canvas.width = needed;
    canvas.height = needed;
  }
  const scale = canvas.width / LOGICAL_SIZE;
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
}
window.addEventListener('resize', fitAvatar);
window.addEventListener('orientationchange', () => setTimeout(fitAvatar, 100));
fitAvatar();

// ============================================================
// STATE
// ============================================================
// Moods: 'awake' (base) | 'sleeping' (micro-nap) | 'talking' | 'greeting'
let currentMood = 'awake';
let moodStartTime = Date.now();
let moodDurationMs = 0;

let nextMicrosleepAt = Date.now() + rand(MOOD_CONFIG.microsleepMinMs, MOOD_CONFIG.microsleepMaxMs);
let nextYawnAt = Date.now() + rand(MOOD_CONFIG.yawnMinMs, MOOD_CONFIG.yawnMaxMs);
let nextExpressionAt = Date.now() + rand(MOOD_CONFIG.expressionMinMs, MOOD_CONFIG.expressionMaxMs);
let nextSelfTalkAt = Date.now() + rand(MOOD_CONFIG.selfTalkMinMs, MOOD_CONFIG.selfTalkMaxMs);

let audioUnlocked = false;
let muted = false;

let isSpeaking = false;
let mouthOpen = 0;
let targetMouthOpen = 0;
let time = 0;

let clickTargetX = 0;
let clickTargetY = 0;

let sleepZs = [];
let zSpawnTimer = 0;

// Blink
let eyeBlink = 0;
let blinkPhase = 'idle';
let blinkPhaseTimer = 0;
let blinkCloseDuration = 4;
let blinkOpenDuration = 4;
let blinkPauseMin = 150;
let blinkPauseMax = 350;
let blinkNextDelay = 0;
let blinkWantsDouble = false;
let blinkDoubleGapDuration = 8;
let forcedBlinkQueue = 0;

// Idle
let yawnActive = 0;
let yawnPhase = 0;
let mouthTwitchTimer = 0;
let mouthTwitchNextAt = rand(20, 60) * 60;
let mouthTwitchActive = 0;
let mouthTwitchPhase = 0;
let mouthTwitchDir = 1;
let browTwitchTimer = 0;
let browTwitchNextAt = rand(15, 45) * 60;
let browTwitchActive = 0;
let browTwitchPhase = 0;
let browTwitchAmount = 0;
let headDriftTimer = 0;
let headDriftNextAt = 90 + Math.random() * 150;
let headDriftTarget = 0;
let headDriftCurrent = 0;
let pupilScale = 1;
let pupilScaleTarget = 1;
let pupilTimer = 0;
let pupilNextAt = 180 + Math.random() * 240;
let wanderActive = false;
let wanderTimer = 0;
let wanderNextAt = 120 + Math.random() * 180;
let wanderTargetX = 0;
let wanderTargetY = 0;
let wanderReturnTimer = 0;
let saccadeTimer = 0;
let saccadeNextAt = 15 + Math.random() * 25;
let saccadeX = 0, saccadeY = 0;
let saccadeTargetX = 0, saccadeTargetY = 0;
let reflectionTimer = 0;
let reflectionNextAt = 1500 + Math.random() * 1500;
let reflectionActive = 0;
let reflectionPhase = 0;
let reflectionTotalFrames = 180;
let breathPhaseA = 0, breathPhaseB = 0, breathPhaseC = 0;
let breathCycleTimer = 0;
let breathCycleDuration = 180 + Math.random() * 120;
let currentBreathOffset = 0;
let glitchTimer = 0;
let glitchNextAt = 600 + Math.random() * 1200;
let glitchIntensity = 0;
let eyeTargetX = 0, eyeTargetY = 0;
let eyeCurrentX = 0, eyeCurrentY = 0;
let mouseMovedTimer = 0;
let mouseIsActive = false;

let currentEmotion = { browAngle: 0, browHeight: 0, mouthCurve: 0, eyeOpen: 1, mouthWidth: 80, headTilt: 0 };
let targetEmotion = { ...currentEmotion };

// ============================================================
// AUDIO
// ============================================================
let audioCtx = null;
function initAudioContext() {
  if (audioCtx) return;
  try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
}
function tone(freq, duration, volume, type, freqEnd) {
  if (!audioCtx || !AUDIO_CONFIG.enabled || muted) return;
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type || 'sine';
  osc.frequency.setValueAtTime(freq, t);
  if (freqEnd) osc.frequency.linearRampToValueAtTime(freqEnd, t + duration);
  gain.gain.setValueAtTime(0, t);
  gain.gain.linearRampToValueAtTime(volume, t + 0.03);
  gain.gain.linearRampToValueAtTime(0, t + duration);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(t); osc.stop(t + duration + 0.05);
}
function playChirp() {
  tone(720, 0.09, AUDIO_CONFIG.chirpVolume, 'sine', 620);
  setTimeout(() => tone(560, 0.12, AUDIO_CONFIG.chirpVolume, 'sine', 480), 95);
}
function playGreet() {
  tone(440, 0.07, AUDIO_CONFIG.greetVolume, 'sine');
  setTimeout(() => tone(660, 0.07, AUDIO_CONFIG.greetVolume, 'sine'), 80);
  setTimeout(() => tone(880, 0.13, AUDIO_CONFIG.greetVolume, 'sine', 820), 160);
}
function playYawn() {
  if (!audioCtx || !AUDIO_CONFIG.enabled || muted) return;
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  const filter = audioCtx.createBiquadFilter();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(180, t);
  osc.frequency.linearRampToValueAtTime(300, t + 0.45);
  osc.frequency.linearRampToValueAtTime(160, t + 1.0);
  filter.type = 'lowpass'; filter.frequency.value = 480;
  gain.gain.setValueAtTime(0, t);
  gain.gain.linearRampToValueAtTime(AUDIO_CONFIG.yawnVolume, t + 0.25);
  gain.gain.linearRampToValueAtTime(0, t + 1.0);
  osc.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
  osc.start(t); osc.stop(t + 1.05);
}

// ============================================================
// PARTICLES
// ============================================================
let particles = [];
class Particle {
  constructor() { this.reset(); this.y = Math.random() * LOGICAL_SIZE; }
  reset() {
    this.x = Math.random() * LOGICAL_SIZE;
    this.y = LOGICAL_SIZE + 20;
    this.sizeBase = Math.random() * 2.5 + 0.5;
    this.size = this.sizeBase;
    this.speedBase = Math.random() * 0.4 + 0.2;
    this.speed = this.speedBase;
    this.alphaBase = Math.random() * 0.4 + 0.15;
    this.alpha = this.alphaBase;
    this.wobble = Math.random() * Math.PI * 2;
    this.wobbleSpeed = Math.random() * 0.02 + 0.008;
  }
  update(intensity) {
    this.speed = this.speedBase * (1 + intensity * 2.5);
    this.size = this.sizeBase * (1 + intensity * 1.5);
    this.alpha = Math.min(1, this.alphaBase * (1 + intensity * 2));
    this.wobble += this.wobbleSpeed * (1 + intensity * 2);
    this.y -= this.speed;
    this.x += Math.sin(this.wobble) * (0.4 + intensity * 1.5);
    if (this.y < -20) this.reset();
  }
  draw() {
    ctx.save();
    ctx.globalAlpha = this.alpha;
    ctx.fillStyle = COLOR_MAIN;
    ctx.shadowBlur = 6 + 10 * (this.size / this.sizeBase - 1);
    ctx.shadowColor = COLOR_MAIN;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}
for (let i = 0; i < 50; i++) particles.push(new Particle());

// ============================================================
// WAVES
// ============================================================
let waves = [];
let waveSpawnTimer = 0;
function spawnWave(baseAlpha, baseSpeed) {
  waves.push({
    radius: 180, maxRadius: 260 + Math.random() * 60,
    alpha: baseAlpha, speed: baseSpeed + Math.random() * 0.6,
    width: 1.5 + Math.random() * 1
  });
}
function updateWaves() {
  waveSpawnTimer++;
  const spawnInterval = isSpeaking ? 10 : (currentMood === 'sleeping' ? 130 : 55);
  const baseAlpha = isSpeaking ? 0.65 : (currentMood === 'sleeping' ? 0.12 : 0.30);
  const baseSpeed = isSpeaking ? 1.2 : (currentMood === 'sleeping' ? 0.35 : 0.65);
  if (waveSpawnTimer >= spawnInterval) {
    waveSpawnTimer = 0;
    spawnWave(baseAlpha, baseSpeed);
  }
  for (let i = waves.length - 1; i >= 0; i--) {
    const w = waves[i];
    w.radius += w.speed;
    w.alpha -= 0.010;
    if (w.alpha <= 0 || w.radius >= w.maxRadius) waves.splice(i, 1);
  }
}
function drawWaves(cx, cy) {
  waves.forEach(w => {
    ctx.save();
    ctx.strokeStyle = COLOR_MAIN;
    ctx.globalAlpha = w.alpha;
    ctx.lineWidth = w.width;
    ctx.shadowBlur = 15;
    ctx.shadowColor = COLOR_GLOW;
    ctx.beginPath();
    ctx.arc(cx, cy, w.radius, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  });
}

// ============================================================
// SYLLABLES / WORDS / VOICES
// ============================================================
function getSyllables(text) {
  const words = text.toLowerCase().match(/[a-zàèéìòù]+/g) || [];
  const result = [];
  const vowels = 'aeiouàèéìòù';
  for (const word of words) {
    let cur = '';
    for (let i = 0; i < word.length; i++) {
      cur += word[i];
      const isV = vowels.includes(word[i]);
      const nextV = i + 1 < word.length && vowels.includes(word[i + 1]);
      if (isV && !nextV) { result.push(cur); cur = ''; }
    }
    if (cur) result.push(cur);
  }
  return result;
}
function extractWords(text) {
  const words = [];
  const regex = /[a-zA-ZàèéìòùÀÈÉÌÒÙ]+/g;
  let m;
  while ((m = regex.exec(text)) !== null) {
    words.push({ word: m[0].toLowerCase(), index: m.index });
  }
  return words;
}

let selectedVoice = null;
function pickVoice() {
  const voices = speechSynthesis.getVoices();
  if (!voices.length) return null;
  let v = voices.find(v => v.lang === 'it-IT');
  if (!v) v = voices.find(v => v.lang && v.lang.startsWith('it'));
  if (!v) v = voices.find(v => v.lang && v.lang.startsWith('en'));
  return v || voices[0];
}
function loadVoices() {
  const v = pickVoice();
  if (v) selectedVoice = v;
}
if ('speechSynthesis' in window) {
  speechSynthesis.onvoiceschanged = loadVoices;
  loadVoices();
}

// ============================================================
// EMOTIONS
// ============================================================
const EMOTION_KEYWORDS = {
  felice: ['ciao','benvenuto','grazie','felice','bene','ottimo','grande','bello','amore','contento','evviva','bravo','sorriso','piacere','caffe','caffè'],
  triste: ['purtroppo','triste','male','problema','difficile','brutto','dispiace','sofferenza','dolore','solo','perdere','staccare'],
  arrabbiato: ['attenzione','pericolo','errore','grave','rabbia','basta','no','mai','inaccettabile','sbagliato','cazzo','palle','coglioni'],
  sorpreso: ['wow','incredibile','davvero','improvviso','inaspettato','sorpresa','caspita','accidenti','oh']
};
let activeEmotion = 'neutro';
let emotionHoldFrames = 0;
let wordsInText = [];
let wordCursor = 0;

function detectEmotionForWord(word) {
  for (const [emotion, keywords] of Object.entries(EMOTION_KEYWORDS)) {
    if (keywords.includes(word)) return emotion;
  }
  return null;
}
function emotionParams(emotion) {
  switch (emotion) {
    case 'felice':    return { browAngle: 0.3, browHeight: -5, mouthCurve: 1, eyeOpen: 0.95, mouthWidth: 90, headTilt: 0.02 };
    case 'triste':    return { browAngle: -0.8, browHeight: 8, mouthCurve: -1, eyeOpen: 0.75, mouthWidth: 70, headTilt: -0.05 };
    case 'arrabbiato':return { browAngle: -1.2, browHeight: 5, mouthCurve: -0.7, eyeOpen: 0.7, mouthWidth: 80, headTilt: 0 };
    case 'sorpreso':  return { browAngle: 0.6, browHeight: -14, mouthCurve: 0, eyeOpen: 1.5, mouthWidth: 75, headTilt: 0 };
    case 'annoiato':  return { browAngle: -0.3, browHeight: 2, mouthCurve: -0.25, eyeOpen: 0.82, mouthWidth: 76, headTilt: 0.03 };
    case 'assonnato': return { browAngle: 0, browHeight: 5, mouthCurve: -0.1, eyeOpen: 0.55, mouthWidth: 72, headTilt: 0.06 };
    default:          return { browAngle: 0, browHeight: 0, mouthCurve: 0, eyeOpen: 1, mouthWidth: 80, headTilt: 0 };
  }
}
function processNextWord() {
  if (wordCursor >= wordsInText.length) return;
  const w = wordsInText[wordCursor];
  const detected = detectEmotionForWord(w.word);
  if (detected) { activeEmotion = detected; emotionHoldFrames = 90; }
  wordCursor++;
}

// ============================================================
// MOUTH
// ============================================================
let syllables = [];
let currentSyllableIndex = 0;
let syllableTimer = 0;
let framesPerSyllable = 8;

function updateMouthAnimation() {
  if (currentMood === 'sleeping') {
    targetMouthOpen = 0.03 + Math.abs(Math.sin(time * 0.3)) * 0.02;
    return;
  }
  if (!isSpeaking) {
    // idle breathing mouth + occasional twitch
    let base = 0.02 + Math.abs(Math.sin(time * 0.6)) * 0.04;
    if (yawnActive > 0) base = Math.max(base, yawnActive * 0.9);
    targetMouthOpen = base;
    return;
  }
  syllableTimer++;
  if (syllableTimer >= framesPerSyllable) {
    syllableTimer = 0;
    currentSyllableIndex++;
    if (currentSyllableIndex >= syllables.length) currentSyllableIndex = 0;
    const syl = syllables[currentSyllableIndex] || '';
    framesPerSyllable = 6 + Math.random() * 4 + Math.min(4, syl.length);
  }
  const syl = syllables[currentSyllableIndex] || '';
  let openness = 0.4;
  if (syl.includes('a')) openness = 1.0;
  else if (syl.includes('o')) openness = 0.9;
  else if (syl.includes('e')) openness = 0.75;
  else if (syl.includes('u')) openness = 0.6;
  else if (syl.includes('i')) openness = 0.5;
  else openness = 0.25;
  openness += (Math.random() - 0.5) * 0.15;
  targetMouthOpen = Math.max(0.05, Math.min(1, openness));
}

// ============================================================
// ANIMATIONS
// ============================================================
function updateEmotionAnimation() {
  if (emotionHoldFrames > 0) {
    emotionHoldFrames--;
    if (emotionHoldFrames === 0) activeEmotion = 'neutro';
  }
  const params = emotionParams(activeEmotion);
  Object.keys(params).forEach(k => targetEmotion[k] = params[k]);

  if (currentMood === 'sleeping') {
    targetEmotion.eyeOpen = 0;
    targetEmotion.browHeight = 3;
    targetEmotion.mouthCurve = 0;
    targetEmotion.headTilt = 0.05;
  } else if (currentMood === 'greeting') {
    targetEmotion.eyeOpen = 1.1;
    targetEmotion.browHeight = -3;
    targetEmotion.mouthCurve = 0.5;
    targetEmotion.headTilt = 0.02;
  }
  // For 'awake' we let the current expression pass through unchanged

  const speed = currentMood === 'greeting' ? 0.20 : (currentMood === 'sleeping' ? 0.06 : 0.10);
  Object.keys(currentEmotion).forEach(k => {
    currentEmotion[k] = lerp(currentEmotion[k], targetEmotion[k], speed);
  });
}

function updateBreath() {
  const speedFactor = currentMood === 'sleeping' ? 0.45 : 1;
  breathPhaseA += 0.018 * speedFactor;
  breathPhaseB += 0.037 * speedFactor;
  breathPhaseC += 0.008 * speedFactor;
  currentBreathOffset = Math.sin(breathPhaseA) * 2.5 + Math.sin(breathPhaseB) * 0.8 + Math.sin(breathPhaseC) * 1.2;
  breathCycleTimer++;
  if (breathCycleTimer > breathCycleDuration) {
    breathCycleTimer = 0;
    breathCycleDuration = 180 + Math.random() * 180;
  }
}
function getBreathOffset() { return currentBreathOffset; }

function startBlink(double) {
  blinkPhase = 'closing';
  blinkPhaseTimer = 0;
  blinkCloseDuration = 4 + Math.floor(Math.random() * 3);
  blinkOpenDuration = 4 + Math.floor(Math.random() * 3);

    forcedBlinkQueue--;
  }
  switch (blinkPhase) {
    case 'idle':
      blinkNextDelay++;
      if (blinkNextDelay >= blinkPauseMin) {
        blinkNextDelay = 0;
        startBlink(Math.random() < 0.2);
      }
      eyeBlink = lerp(eyeBlink, 0, 0.5);
      break;
    case 'closing':
      blinkPhaseTimer++;
      eyeBlink = Math.min(1, blinkPhaseTimer / blinkCloseDuration);
      if (blinkPhaseTimer >= blinkCloseDuration) { blinkPhase = 'opening'; blinkPhaseTimer = 0; }
      break;
    case 'opening':
      blinkPhaseTimer++;
      eyeBlink = Math.max(0, 1 - blinkPhaseTimer / blinkOpenDuration);
      if (blinkPhaseTimer >= blinkOpenDuration) {

          blinkPhase = 'double-wait';
          blinkPhaseTimer = 0;

          blinkPauseMin = 150 + Math.floor(Math.random() * 200);

document.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  const ccx = rect.left + rect.width / 2;
  const ccy = rect.top + rect.height / 2;
  const dx = e.clientX - ccx, dy = e.clientY - ccy;
  const dist = Math.sqrt(dx*dx + dy*dy);
  const maxOffset = 6;
  if (dist > 0) {
    const factor = Math.min(1, dist / 400);
    eyeTargetX = (dx / dist) * maxOffset * factor;
    eyeTargetY = (dy / dist) * maxOffset * factor;
  }
  mouseIsActive = true;
  mouseMovedTimer = 0;
});
function updateGaze() {

  if (currentMood === 'sleeping') return;
  if (currentMood === 'greeting') {
    const rect = canvas.getBoundingClientRect();
    const ccx = rect.left + rect.width / 2;
    const ccy = rect.top + rect.height / 2;
    const dx = clickTargetX - ccx;
    const dy = clickTargetY - ccy;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (dist > 0) {
      const factor = Math.min(1, dist / 400);
      eyeTargetX = (dx / dist) * 8 * factor;
      eyeTargetY = (dy / dist) * 8 * factor;
    }
  } else if (isSpeaking) {
    eyeTargetX = Math.sin(time * 0.5) * 1.5;
    eyeTargetY = Math.sin(time * 0.7) * 1.0;
  } else if (mouseIsActive) {
    // mouse
  } else if (wanderActive) {
    eyeTargetX = wanderTargetX;
    eyeTargetY = wanderTargetY;
  } else {
    eyeTargetX = lerp(eyeTargetX, 0, 0.03);
    eyeTargetY = lerp(eyeTargetY, 0, 0.03);

  const gazeSpeed = currentMood === 'greeting' ? 0.10 : 0.08;

    zSpawnTimer = 0;

      x: cx + 60 + Math.random() * 30,

function drawCyberLine(x1, y1, x2, y2, alpha = 1, color = COLOR_MAIN) {

  ctx.strokeStyle = color;
  ctx.lineWidth = 1.8;

}
function drawCyberEyebrow(x, y, side, color, glow) {
  ctx.save();
  const angle = currentEmotion.browAngle * 0.22 * side;
  const offset = currentEmotion.browHeight * 0.45 - browTwitchAmount;
  ctx.strokeStyle = color;
  ctx.lineWidth = 3.2;
  ctx.lineCap = 'round';
  ctx.shadowBlur = 10;
  ctx.shadowColor = glow;

function drawCyberEye(x, y, color, glow) {
  ctx.save();

  ctx.shadowColor = glow;
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineWidth = 2.5;
  const eyeHeight = Math.max(0.12, currentEmotion.eyeOpen) * (1 - Math.min(1, eyeBlink));
  if (currentMood === 'sleeping' || eyeHeight < 0.22) {
    ctx.beginPath();
    ctx.moveTo(x - 16, y);
    ctx.quadraticCurveTo(x, y + 7, x + 16, y);
    ctx.stroke();

  ctx.moveTo(x - 17, y - halfH);
  ctx.lineTo(x + 16, y - halfH);
  ctx.lineTo(x + 11, y + halfH);
  ctx.lineTo(x - 12, y + halfH);

  ctx.fill();

  const py = y + Math.max(-3, Math.min(3, eyeCurrentY + saccadeY));

  }

}

// ============================================================

// ============================================================
function updateStatus(text, cls) {
  statusEl.innerText = text;
  statusEl.className = 'status' + (cls ? ' ' + cls : '');
}

function updateMoodUI() {
  document.body.classList.remove('sleeping');
  container.classList.remove('sleeping', 'speaking', 'greeting');
  if (currentMood === 'sleeping') {
    document.body.classList.add('sleeping');
    container.classList.add('sleeping');
    updateStatus('💤', 'sleeping');
  } else if (currentMood === 'awake') {
    if (!audioUnlocked) {
      updateStatus('🔊 tap to enable sound', 'unlock');
    } else {
      updateStatus('', 'ready');
    }
  } else if (currentMood === 'talking') {
    container.classList.add('speaking');
    updateStatus('♪ ♪ ♪', 'talking');
  } else if (currentMood === 'greeting') {
    container.classList.add('greeting');
    updateStatus('👋', 'greeting');
  }
}

function enterState(state, durationMs) {
  currentMood = state;
  moodStartTime = Date.now();
  moodDurationMs = durationMs || 0;
  updateMoodUI();
}

function updateMoodState() {
  const now = Date.now();

  if (currentMood === 'awake') {
    if (now >= nextMicrosleepAt) {
      startMicrosleep();
    } else if (now >= nextSelfTalkAt) {
      startSelfTalk();
    } else if (now >= nextYawnAt) {
      triggerYawn();
    } else if (now >= nextExpressionAt) {
      cycleExpression();
    }
  } else if (currentMood === 'sleeping') {
    if (now - moodStartTime >= moodDurationMs) {
      wakeFromMicrosleep();
    }
  } else if (currentMood === 'greeting') {
    if (now - moodStartTime >= moodDurationMs) {
      enterState('awake', 0);
    }
  }
  // 'talking' is ended by the speech callback
}

// ============================================================
// EVENT TRIGGERS
// ============================================================
function startMicrosleep() {
  const duration = rand(MOOD_CONFIG.microsleepDurationMinMs, MOOD_CONFIG.microsleepDurationMaxMs);
  enterState('sleeping', duration);
  nextMicrosleepAt = Date.now() + rand(MOOD_CONFIG.microsleepMinMs, MOOD_CONFIG.microsleepMaxMs);
}

function wakeFromMicrosleep() {
  enterState('awake', 0);
  forcedBlinkQueue = 1;
  nextMicrosleepAt = Date.now() + rand(MOOD_CONFIG.microsleepMinMs, MOOD_CONFIG.microsleepMaxMs);
  nextYawnAt = Date.now() + rand(MOOD_CONFIG.yawnMinMs, MOOD_CONFIG.yawnMaxMs);
}

function triggerYawn() {
  yawnActive = 0.01;
  yawnPhase = 0;
  playYawn();
  nextYawnAt = Date.now() + rand(MOOD_CONFIG.yawnMinMs, MOOD_CONFIG.yawnMaxMs);
}

function cycleExpression() {
  const pick = AWAKE_EXPRESSIONS[Math.floor(Math.random() * AWAKE_EXPRESSIONS.length)];
  activeEmotion = pick;
  // Hold 3–9 seconds (60 fps)
  emotionHoldFrames = 180 + Math.floor(Math.random() * 360);
  nextExpressionAt = Date.now() + rand(MOOD_CONFIG.expressionMinMs, MOOD_CONFIG.expressionMaxMs);
}

function startSelfTalk() {
  if (currentMood !== 'awake') return;
  if (document.hidden) { resetSelfTalkTimer(); return; }
  const phrase = SELF_TALK_PHRASES[Math.floor(Math.random() * SELF_TALK_PHRASES.length)];
  enterState('talking', 0);
  setTimeout(() => {
    speakText(phrase, AUDIO_CONFIG.selfTalkVolume, () => {
      setTimeout(() => {
        if (currentMood === 'talking') enterState('awake', 0);
      }, 500);
    });
  }, 300);
  resetSelfTalkTimer();
}

function resetSelfTalkTimer() {
  nextSelfTalkAt = Date.now() + rand(MOOD_CONFIG.selfTalkMinMs, MOOD_CONFIG.selfTalkMaxMs);
}

// ============================================================
// SCHEDULED EVENTS
// ============================================================
let firedEvents = new Set();
let lastFiredDate = new Date().toDateString();

function checkScheduledEvents() {
  const now = new Date();
  const dateKey = now.toDateString();
  if (dateKey !== lastFiredDate) {
    firedEvents.clear();
    lastFiredDate = dateKey;
  }
  const hh = now.getHours();
  const mm = now.getMinutes();
  for (const ev of SCHEDULED_EVENTS) {
    if (ev.h === hh && ev.m === mm) {
      const key = `${hh}-${mm}`;
      if (firedEvents.has(key)) continue;
      firedEvents.add(key);
      fireScheduledEvent(ev);
    }
  }
}

function fireScheduledEvent(ev) {
  if (document.hidden) return;
  stopSpeaking();

  const safetyMs = ev.sequence ? Math.max(45000, ev.sequence.length * 3500) : 15000;
  const returnToAwake = () => {
    if (currentMood === 'talking') enterState('awake', 0);
  };

  enterState('talking', 0);

  setTimeout(() => {
    if (ev.text) {
      speakText(ev.text, AUDIO_CONFIG.scheduledVolume, returnToAwake);
    } else if (ev.sequence) {
      speakSequence(ev.sequence, AUDIO_CONFIG.scheduledVolume, returnToAwake);
    } else {
      returnToAwake();
    }
  }, 300);

  setTimeout(() => {
    if (currentMood === 'talking') {
      stopSpeaking();
      returnToAwake();
    }
  }, safetyMs);
}

// ============================================================
// SPEECH
// ============================================================
let utterance = null;

function speakText(text, volume, onEnd) {
  if (!('speechSynthesis' in window)) { if (onEnd) onEnd(); return; }
  if (!text || !text.trim()) { if (onEnd) onEnd(); return; }

  syllables = getSyllables(text);
  wordsInText = extractWords(text);
  currentSyllableIndex = 0;
  syllableTimer = 0;
  framesPerSyllable = 8;
  wordCursor = 0;
  activeEmotion = 'neutro';
  emotionHoldFrames = 0;

  utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = 'it-IT';
  utterance.rate = 0.95;
  utterance.pitch = 1.05;
  utterance.volume = volume || 0.4;
  if (selectedVoice) utterance.voice = selectedVoice;

  let ended = false;
  const finish = () => {
    if (ended) return;
    ended = true;
    isSpeaking = false;
    targetMouthOpen = 0;
    activeEmotion = 'neutro';
    if (onEnd) onEnd();
  };

  utterance.onstart = () => { isSpeaking = true; };
  utterance.onboundary = (e) => { if (e.name === 'word') processNextWord(); };
  utterance.onend = finish;
  utterance.onerror = finish;

  speechSynthesis.speak(utterance);
}

function speakSequence(seq, volume, onDone) {
  let i = 0;
  function next() {
    if (i >= seq.length) { if (onDone) onDone(); return; }
    const text = seq[i++];
    if (!text || !text.trim()) {
      setTimeout(next, 500);
      return;
    }
    speakText(text, volume, () => {
      setTimeout(next, 550);
    });
  }
  next();
}

function stopSpeaking() {
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  isSpeaking = false;
  targetMouthOpen = 0;
  activeEmotion = 'neutro';
}

// ============================================================
// INTERACTION
// ============================================================
function handleInteraction(clickX, clickY) {
  if (!audioUnlocked) {
    initAudioContext();
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    audioUnlocked = true;
    updateMoodUI();
  }

  if (currentMood === 'talking' && isSpeaking) stopSpeaking();

  // Wake from micro-nap on click
  if (currentMood === 'sleeping') {
    wakeFromMicrosleep();
    enterState('greeting', MOOD_CONFIG.greetDurationMs);
    clickTargetX = clickX;
    clickTargetY = clickY;
    playGreet();
    forcedBlinkQueue = 2;
    return;
  }

  if (currentMood !== 'greeting') {
    enterState('greeting', MOOD_CONFIG.greetDurationMs);
    clickTargetX = clickX;
    clickTargetY = clickY;
    playGreet();
    forcedBlinkQueue = 1;
  }
}

function onTap(e) {
  let clickX = window.innerWidth / 2;
  let clickY = window.innerHeight / 2;
  if (e && typeof e.clientX === 'number') {
    clickX = e.clientX;
    clickY = e.clientY;
  }
  handleInteraction(clickX, clickY);
}

document.body.addEventListener('click', onTap);
document.body.addEventListener('touchstart', function(e) {
  e.preventDefault();
  const touch = e.touches[0];
  onTap({ clientX: touch.clientX, clientY: touch.clientY });
}, { passive: false });

document.addEventListener('keydown', (e) => {
  if (e.key === 'm' || e.key === 'M') {
    muted = !muted;
    updateStatus(muted ? '🔇 muted' : '', muted ? 'muted' : 'ready');
    try { localStorage.setItem('avatar_muted', muted ? '1' : '0'); } catch (err) {}
    setTimeout(() => { updateMoodUI(); }, 1500);
  }
});

document.addEventListener('visibilitychange', () => {
  if (document.hidden && currentMood === 'talking' && isSpeaking) {
    stopSpeaking();
    enterState('awake', 0);
  }
});

// ============================================================
// STARTUP
// ============================================================
try {
  const m = localStorage.getItem('avatar_muted');
  if (m === '1') muted = true;
} catch (e) {}

enterState('awake', 0);

setInterval(checkScheduledEvents, 5000);
checkScheduledEvents();

function renderLoop() {
  drawAvatar();
  requestAnimationFrame(renderLoop);
}
renderLoop();
</script>
