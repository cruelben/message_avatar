<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Talking Avatar - Persistent Moods</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background-color: #001a0d; color: #00ff88;
    font-family: 'Courier New', Courier, monospace;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    background-image:
      radial-gradient(circle at 50% 50%, rgba(0,255,136,0.08) 0%, transparent 60%),
      linear-gradient(rgba(0,255,136,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,255,136,0.05) 1px, transparent 1px);
    background-size: 100% 100%, 30px 30px, 30px 30px;
    cursor: pointer;
    transition: background-color 1.5s ease;
    position: relative;
  }
  body.sleeping { background-color: #000d06; }
  body.offended { background-color: #1a0a0a; }

  #app {
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    transition: filter 1s ease;
    position: relative;
  }
  body.sleeping #app { filter: brightness(0.6); }

  .crt-overlay {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    background:
      linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.25) 50%),
      linear-gradient(90deg, rgba(255,0,0,0.06), rgba(0,255,0,0.02), rgba(0,0,255,0.06));
    background-size: 100% 4px, 6px 100%;
    pointer-events: none; z-index: 9999;
    animation: flicker 0.15s infinite;
    transition: opacity 1s ease;
  }
  body.sleeping .crt-overlay { opacity: 0.4; }
  @keyframes flicker { 0%{opacity:.95} 50%{opacity:.85} 100%{opacity:.95} }

  .avatar-container {
    position: relative;
    width: var(--size, 700px);
    height: var(--size, 700px);
    display: flex; justify-content: center; align-items: center;
    border: 1px solid rgba(0,255,157,0.32); border-radius: 28px; overflow: hidden;
    box-shadow: 0 0 42px rgba(0,255,157,0.10), inset 0 0 60px rgba(0,255,157,0.05);
    background: radial-gradient(circle at 50% 46%, rgba(0,255,157,0.12), rgba(0,0,0,0.14) 60%), rgba(0,0,0,0.20);
    transition: box-shadow 0.5s ease, border-color 0.5s ease;
    flex-shrink: 0;
    pointer-events: none;
  }
  .avatar-container.speaking {
    box-shadow: 0 0 72px rgba(0,255,157,0.28), inset 0 0 90px rgba(0,255,157,0.12);
  }
  .avatar-container.sleeping {
    box-shadow: 0 0 24px rgba(0,255,157,0.08), inset 0 0 40px rgba(0,255,157,0.035);
    border-color: rgba(0,85,51,0.8);
  }
  .avatar-container.offended {
    box-shadow: 0 0 60px rgba(255,120,120,0.25), inset 0 0 80px rgba(255,80,80,0.08);
    border-color: rgba(255,136,136,0.75);
  }
  canvas {
    display: block;
    border-radius: 27px;
    width: 100%;
    height: 100%;
    cursor: pointer;
    touch-action: manipulation;
  }

  .status {
    position: fixed;
    bottom: 6vh;
    left: 50%;
    transform: translateX(-50%);
    font-size: clamp(10px, 1.6vw, 14px);
    color: #00cc66; text-transform: uppercase;
    letter-spacing: 3px; text-shadow: 0 0 10px #00ff88;
    text-align: center;
    pointer-events: none;
    animation: breathe 2.5s ease-in-out infinite;
    transition: color 0.5s ease;
    max-width: 90vw;
    padding: 0 12px;
  }
  @keyframes breathe {
    0%, 100% { opacity: 0.55; }
    50% { opacity: 1; }
  }
  .status.speaking { animation: none; opacity: 1; color: #00ff88; }
  .status.done { animation: none; opacity: 0.5; }
  .status.sleeping {
    animation: sleepBreathe 5s ease-in-out infinite;
    color: #008855;
  }
  @keyframes sleepBreathe {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 0.7; }
  }
  .status.offended {
    animation: none;
    opacity: 1;
    color: #ff8888;
    text-shadow: 0 0 10px #ff4444;
  }

  @media (max-height: 500px) {
    .status { bottom: 2vh; letter-spacing: 2px; }
    .avatar-container { border-radius: 22px; }
    canvas { border-radius: 21px; }
  }
</style>
</head>
<body>
<div id="app">
  <div class="avatar-container" id="avatarContainer">
    <canvas id="avatarCanvas" width="420" height="420" aria-label="Interactive neon avatar. Click to talk."></canvas>
  </div>
</div>
<div class="crt-overlay"></div>

<div class="status" id="status">▶ click or press a key to start</div>

<!-- Carica il testo da talk.js (deve essere nella stessa cartella) -->
<script src="talk.js"></script>

<script>
// ============================================================
// TEXT TO BE SPOKEN — loaded from talk.js
// ============================================================
const TESTO = (() => {
  if (window.TALK_LINES && Array.isArray(window.TALK_LINES) && window.TALK_LINES.length) {
    return window.TALK_LINES.join(' ').replace(/\s+/g, ' ').trim();
  }
  console.warn('⚠ talk.js mancante o malformato — uso fallback.');
  return "Ciao! Non ho trovato il file talk.js, quindi leggo questo messaggio di riserva.";
})();

// ============================================================
// MOOD CONFIGURATION
// ============================================================
const MOOD_CONFIG = {
  sleepAfterMs: 5 * 60 * 1000,
  wakeDurationMs: 2500,
  offendedDurationMs: 600,
  tirednessPerWake: 0.15,
  tirednessDecayPerMs: 1 / 60000,
  maxTiredness: 1,
  persistEnabled: true
};

const AUDIO_CONFIG = {
  ambientVolume: 0.035,
  syllableVolume: 0.10,
  startBeepVolume: 0.15,
  endBeepVolume: 0.15,
  enabled: true
};

const COLOR_MAIN = '#00ff88';
const COLOR_DIM  = '#00cc66';
const COLOR_GLOW = 'rgba(0,255,136,0.8)';

// ============================================================
// DOM
// ============================================================
const canvas = document.getElementById('avatarCanvas');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');
const container = document.getElementById('avatarContainer');

// ============================================================
// RESPONSIVE
// ============================================================
const LOGICAL_SIZE = 420;

function fitAvatar() {
  const availableW = window.innerWidth * 0.96;
  const availableH = window.innerHeight * 0.76;
  const sizeCss = Math.max(160, Math.min(availableW, availableH, 700));

  document.documentElement.style.setProperty('--size', sizeCss + 'px');

  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  const needed = Math.round(sizeCss * dpr);

  if (canvas.width !== needed || canvas.height !== needed) {
    canvas.width = needed;
    canvas.height = needed;
  }

  const scale = canvas.width / LOGICAL_SIZE;
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
}

window.addEventListener('resize', fitAvatar);
window.addEventListener('orientationchange', () => setTimeout(fitAvatar, 100));
fitAvatar();

// ============================================================
// GENERAL STATE
// ============================================================
let isSpeaking = false;
let mouthOpen = 0;
let targetMouthOpen = 0;
let time = 0;

let currentMood = 'awake';
let lastInteractionTime = Date.now();
let moodStartTime = 0;
let tiredness = 0;
let clickTargetX = 0;
let clickTargetY = 0;

let sleepZs = [];
let zSpawnTimer = 0;

// ============================================================
// BLINK — state machine
// ============================================================
let eyeBlink = 0;
let blinkPhase = 'idle';
let blinkPhaseTimer = 0;
let blinkCloseDuration = 4;
let blinkOpenDuration = 4;
let blinkPauseMin = 150;
let blinkPauseMax = 350;
let blinkNextDelay = 0;
let blinkWantsDouble = false;
let blinkDoubleGap = 0;
let blinkDoubleGapDuration = 8;

let forcedBlinkQueue = 0;

let yawnTimer = 0;
let yawnCooldown = 800 + Math.random() * 800;
let yawnActive = 0;
let yawnPhase = 0;

let mouthTwitchTimer = 0;
let mouthTwitchNextAt = 120 + Math.random() * 180;
let mouthTwitchActive = 0;
let mouthTwitchPhase = 0;
let mouthTwitchDir = 1;

let browTwitchTimer = 0;
let browTwitchNextAt = 100 + Math.random() * 200;
let browTwitchActive = 0;
let browTwitchPhase = 0;
let browTwitchAmount = 0;

let headDriftTimer = 0;
let headDriftNextAt = 90 + Math.random() * 150;
let headDriftTarget = 0;
let headDriftCurrent = 0;

let pupilScale = 1;
let pupilScaleTarget = 1;
let pupilTimer = 0;
let pupilNextAt = 180 + Math.random() * 240;

let wanderActive = false;
let wanderTimer = 0;
let wanderNextAt = 120 + Math.random() * 180;
let wanderTargetX = 0;
let wanderTargetY = 0;
let wanderReturnTimer = 0;

let saccadeTimer = 0;
let saccadeNextAt = 15 + Math.random() * 25;
let saccadeX = 0, saccadeY = 0;
let saccadeTargetX = 0, saccadeTargetY = 0;

let reflectionTimer = 0;
let reflectionNextAt = 1500 + Math.random() * 1500;
let reflectionActive = 0;
let reflectionPhase = 0;
let reflectionTotalFrames = 180;

let breathPhaseA = 0;
let breathPhaseB = 0;
let breathPhaseC = 0;
let breathCycleTimer = 0;
let breathCycleDuration = 180 + Math.random() * 120;
let currentBreathOffset = 0;

let glitchTimer = 0;
let glitchNextAt = 600 + Math.random() * 1200;
let glitchIntensity = 0;

let eyeTargetX = 0, eyeTargetY = 0;
let eyeCurrentX = 0, eyeCurrentY = 0;
let mouseMovedTimer = 0;
let mouseIsActive = false;

let currentEmotion = { browAngle: 0, browHeight: 0, mouthCurve: 0, eyeOpen: 1, mouthWidth: 80, headTilt: 0 };
let targetEmotion = { ...currentEmotion };

const EMOTION_KEYWORDS = {
  felice: ['ciao','benvenuto','grazie','felice','bene','ottimo','grande','bello','amore','contento','evviva','bravo','sorriso','piacere'],
  triste: ['purtroppo','triste','male','problema','difficile','brutto','dispiace','sofferenza','dolore','solo','perdere'],
  arrabbiato: ['attenzione','pericolo','errore','grave','rabbia','basta','no','mai','inaccettabile','sbagliato'],
  sorpreso: ['wow','incredibile','davvero','improvviso','inaspettato','sorpresa','caspita','accidenti','oh']
};
let activeEmotion = 'neutro';

// ============================================================
// PERSISTENCE
// ============================================================
function saveState() {
  if (!MOOD_CONFIG.persistEnabled) return;
  try {
    localStorage.setItem('avatar_mood', JSON.stringify({
      tiredness: tiredness,
      lastInteraction: lastInteractionTime
    }));
  } catch (e) {}
}

function loadState() {
  if (!MOOD_CONFIG.persistEnabled) return;
  try {
    const raw = localStorage.getItem('avatar_mood');
    if (!raw) return;
    const data = JSON.parse(raw);
    tiredness = Math.max(0, Math.min(1, data.tiredness || 0));
    const timeSince = Date.now() - (data.lastInteraction || Date.now());
    if (timeSince > MOOD_CONFIG.sleepAfterMs) {
      tiredness = Math.min(MOOD_CONFIG.maxTiredness, tiredness + 0.3);
    }
  } catch (e) {}
}

// ============================================================
// MOOD MANAGEMENT
// ============================================================
function enterSleep() {
  if (currentMood === 'sleeping') return;
  currentMood = 'sleeping';
  moodStartTime = Date.now();
  updateMoodUI();
}

function wakeUp(clickX, clickY) {
  if (currentMood === 'waking' || currentMood === 'awake') return;
  currentMood = 'waking';
  moodStartTime = Date.now();
  clickTargetX = clickX;
  clickTargetY = clickY;
  tiredness = Math.min(MOOD_CONFIG.maxTiredness, tiredness + MOOD_CONFIG.tirednessPerWake);
  forcedBlinkQueue = 3;
  blinkPhase = 'idle';
  blinkNextDelay = 0;
  updateMoodUI();
  saveState();
}

function getOffended() {
  if (currentMood === 'sleeping') return;
  currentMood = 'offended';
  moodStartTime = Date.now();
  updateMoodUI();
}

function becomeAwake() {
  if (currentMood === 'awake') return;
  currentMood = 'awake';
  moodStartTime = Date.now();
  updateMoodUI();
}

function updateMoodUI() {
  document.body.classList.remove('sleeping', 'offended');
  container.classList.remove('sleeping', 'offended');
  statusEl.classList.remove('sleeping', 'offended', 'speaking', 'done');

  if (currentMood === 'sleeping') {
    document.body.classList.add('sleeping');
    container.classList.add('sleeping');
    statusEl.classList.add('sleeping');
    statusEl.innerText = '💤 sleeping...';
  } else if (currentMood === 'offended') {
    document.body.classList.add('offended');
    container.classList.add('offended');
    statusEl.classList.add('offended');
    statusEl.innerText = '😠 don\'t interrupt me!';
  }
}

function registerInteraction() {
  lastInteractionTime = Date.now();
}

// ============================================================
// STATE TRANSITION LOGIC
// ============================================================
function updateMoodState() {
  const now = Date.now();
  const moodAge = now - moodStartTime;
  const idleTime = now - lastInteractionTime;

  if (currentMood === 'awake' || currentMood === 'offended') {
    tiredness = Math.max(0, tiredness - MOOD_CONFIG.tirednessDecayPerMs * 16);
  }

  if (currentMood === 'sleeping') return;

  if (currentMood === 'waking') {
    if (moodAge > MOOD_CONFIG.wakeDurationMs) becomeAwake();
    return;
  }

  if (currentMood === 'offended') {
    if (moodAge > MOOD_CONFIG.offendedDurationMs) becomeAwake();
    return;
  }

  if (idleTime > MOOD_CONFIG.sleepAfterMs) enterSleep();
}

// ============================================================
// WEB AUDIO
// ============================================================
let audioCtx = null;
let ambientOsc = null;
let ambientGain = null;
let ambientFilter = null;

function initAudioContext() {
  if (audioCtx) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  } catch (e) {}
}

function startAmbient() {
  if (!audioCtx || !AUDIO_CONFIG.enabled) return;
  if (ambientOsc) return;
  ambientOsc = audioCtx.createOscillator();
  ambientOsc.type = 'sawtooth';
  ambientOsc.frequency.value = 60;
  ambientGain = audioCtx.createGain();
  ambientGain.gain.value = 0;
  ambientGain.gain.linearRampToValueAtTime(AUDIO_CONFIG.ambientVolume, audioCtx.currentTime + 0.4);
  ambientFilter = audioCtx.createBiquadFilter();
  ambientFilter.type = 'lowpass';
  ambientFilter.frequency.value = 220;
  ambientOsc.connect(ambientFilter);
  ambientFilter.connect(ambientGain);
  ambientGain.connect(audioCtx.destination);
  ambientOsc.start();
}

function stopAmbient() {
  if (!ambientOsc || !audioCtx) return;
  const now = audioCtx.currentTime;
  ambientGain.gain.cancelScheduledValues(now);
  ambientGain.gain.linearRampToValueAtTime(0, now + 0.3);
  const osc = ambientOsc;
  const gain = ambientGain;
  ambientOsc = null;
  ambientGain = null;
  ambientFilter = null;
  setTimeout(() => {
    try { osc.stop(); } catch(e){}
    try { osc.disconnect(); } catch(e){}
    try { gain.disconnect(); } catch(e){}
  }, 400);
}

function playBeep(freq, duration, volume, type) {
  if (!audioCtx || !AUDIO_CONFIG.enabled) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type || 'square';
  osc.frequency.value = freq;
  gain.gain.value = 0;
  gain.gain.linearRampToValueAtTime(volume, audioCtx.currentTime + 0.008);
  gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration + 0.05);
}

function playSyllableBeep(syllable) {
  if (!audioCtx || !AUDIO_CONFIG.enabled) return;
  let freq = 440;
  if (syllable.includes('a')) freq = 330;
  else if (syllable.includes('o')) freq = 294;
  else if (syllable.includes('e')) freq = 370;
  else if (syllable.includes('u')) freq = 262;
  else if (syllable.includes('i')) freq = 494;
  else freq = 220;
  freq += (Math.random() - 0.5) * 30;
  playBeep(freq, 0.05, AUDIO_CONFIG.syllableVolume, 'square');
}

function playStartBeep() {
  if (!audioCtx || !AUDIO_CONFIG.enabled) return;
  playBeep(880, 0.08, AUDIO_CONFIG.startBeepVolume, 'sine');
  setTimeout(() => playBeep(1320, 0.10, AUDIO_CONFIG.startBeepVolume, 'sine'), 90);
}

function playEndBeep() {
  if (!audioCtx || !AUDIO_CONFIG.enabled) return;
  playBeep(1320, 0.08, AUDIO_CONFIG.endBeepVolume, 'sine');
  setTimeout(() => playBeep(880, 0.12, AUDIO_CONFIG.endBeepVolume, 'sine'), 90);
}

function playWakeUpSound() {
  if (!audioCtx || !AUDIO_CONFIG.enabled) return;
  playBeep(523, 0.06, 0.12, 'sine');
  setTimeout(() => playBeep(659, 0.06, 0.12, 'sine'), 70);
  setTimeout(() => playBeep(784, 0.10, 0.12, 'sine'), 140);
}

function playOffendedSound() {
  if (!audioCtx || !AUDIO_CONFIG.enabled) return;
  playBeep(180, 0.08, 0.10, 'sawtooth');
}

// ============================================================
// PARTICLES
// ============================================================
let particles = [];
class Particle {
  constructor() { this.reset(); this.y = Math.random() * LOGICAL_SIZE; }
  reset() {
    this.x = Math.random() * LOGICAL_SIZE;
    this.y = LOGICAL_SIZE + 20;
    this.sizeBase = Math.random() * 2.5 + 0.5;
    this.size = this.sizeBase;
    this.speedBase = Math.random() * 0.4 + 0.2;
    this.speed = this.speedBase;
    this.alphaBase = Math.random() * 0.4 + 0.15;
    this.alpha = this.alphaBase;
    this.wobble = Math.random() * Math.PI * 2;
    this.wobbleSpeed = Math.random() * 0.02 + 0.008;
  }
  update(intensity) {
    this.speed = this.speedBase * (1 + intensity * 2.5);
    this.size = this.sizeBase * (1 + intensity * 1.5);
    this.alpha = Math.min(1, this.alphaBase * (1 + intensity * 2));
    this.wobble += this.wobbleSpeed * (1 + intensity * 2);
    this.y -= this.speed;
    this.x += Math.sin(this.wobble) * (0.4 + intensity * 1.5);
    if (this.y < -20) this.reset();
  }
  draw() {
    ctx.save();
    ctx.globalAlpha = this.alpha;
    ctx.fillStyle = COLOR_MAIN;
    ctx.shadowBlur = 6 + 10 * (this.size / this.sizeBase - 1);
    ctx.shadowColor = COLOR_MAIN;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}
for (let i = 0; i < 50; i++) particles.push(new Particle());

// ============================================================
// WAVES
// ============================================================
let waves = [];
let waveSpawnTimer = 0;
function spawnWave(baseAlpha, baseSpeed) {
  waves.push({
    radius: 180, maxRadius: 260 + Math.random() * 60,
    alpha: baseAlpha, speed: baseSpeed + Math.random() * 0.6,
    width: 1.5 + Math.random() * 1
  });
}
function updateWaves() {
  waveSpawnTimer++;
  const spawnInterval = isSpeaking ? 10 : (currentMood === 'sleeping' ? 120 : 55);
  const baseAlpha = isSpeaking ? 0.7 : (currentMood === 'sleeping' ? 0.15 : 0.35);
  const baseSpeed = isSpeaking ? 1.2 : (currentMood === 'sleeping' ? 0.4 : 0.7);
  if (waveSpawnTimer >= spawnInterval) {
    waveSpawnTimer = 0;
    spawnWave(baseAlpha, baseSpeed);
  }
  for (let i = waves.length - 1; i >= 0; i--) {
    const w = waves[i];
    w.radius += w.speed;
    w.alpha -= 0.010;
    if (w.alpha <= 0 || w.radius >= w.maxRadius) waves.splice(i, 1);
  }
}
function drawWaves(cx, cy) {
  waves.forEach(w => {
    ctx.save();
    ctx.strokeStyle = COLOR_MAIN;
    ctx.globalAlpha = w.alpha;
    ctx.lineWidth = w.width;
    ctx.shadowBlur = 15;
    ctx.shadowColor = COLOR_GLOW;
    ctx.beginPath();
    ctx.arc(cx, cy, w.radius, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  });
}

// ============================================================
// SYLLABLES
// ============================================================
function getSyllables(text) {
  const words = text.toLowerCase().match(/[a-zàèéìòù]+/g) || [];
  const result = [];
  const vowels = 'aeiouàèéìòù';
  for (const word of words) {
    let currentSyl = '';
    for (let i = 0; i < word.length; i++) {
      currentSyl += word[i];
      const isVowel = vowels.includes(word[i]);
      const nextIsVowel = i + 1 < word.length && vowels.includes(word[i + 1]);
      if (isVowel && !nextIsVowel) { result.push(currentSyl); currentSyl = ''; }
    }
    if (currentSyl) result.push(currentSyl);
  }
  return result;
}

function extractWords(text) {
  const words = [];
  const regex = /[a-zA-ZàèéìòùÀÈÉÌÒÙ]+/g;
  let m;
  while ((m = regex.exec(text)) !== null) {
    words.push({ word: m[0].toLowerCase(), index: m.index });
  }
  return words;
}

// ============================================================
// VOICES
// ============================================================
let selectedVoice = null;
function pickItalianVoice() {
  const voices = speechSynthesis.getVoices();
  if (!voices.length) return null;
  let v = voices.find(v => v.lang === 'it-IT');
  if (!v) v = voices.find(v => v.lang && v.lang.startsWith('it'));
  if (!v) v = voices.find(v => v.lang && v.lang.startsWith('en'));
  return v || voices[0];
}
function loadVoices() {
  const v = pickItalianVoice();
  if (v) selectedVoice = v;
}
if ('speechSynthesis' in window) {
  speechSynthesis.onvoiceschanged = loadVoices;
  loadVoices();
}

// ============================================================
// EMOTIONS
// ============================================================
function detectEmotionForWord(word) {
  for (const [emotion, keywords] of Object.entries(EMOTION_KEYWORDS)) {
    if (keywords.includes(word)) return emotion;
  }
  return null;
}
function emotionParams(emotion) {
  switch (emotion) {
    case 'felice':    return { browAngle: 0.3, browHeight: -5, mouthCurve: 1, eyeOpen: 0.95, mouthWidth: 90, headTilt: 0.02 };
    case 'triste':    return { browAngle: -0.8, browHeight: 8, mouthCurve: -1, eyeOpen: 0.75, mouthWidth: 70, headTilt: -0.05 };
    case 'arrabbiato':return { browAngle: -1.2, browHeight: 5, mouthCurve: -0.7, eyeOpen: 0.7, mouthWidth: 80, headTilt: 0 };
    case 'sorpreso':  return { browAngle: 0.6, browHeight: -14, mouthCurve: 0, eyeOpen: 1.5, mouthWidth: 75, headTilt: 0 };
    default:          return { browAngle: 0, browHeight: 0, mouthCurve: 0, eyeOpen: 1, mouthWidth: 80, headTilt: 0 };
  }
}

let wordsInText = [];
let wordCursor = 0;
let emotionHoldFrames = 0;

function processNextWord() {
  if (wordCursor >= wordsInText.length) return;
  const w = wordsInText[wordCursor];
  const detected = detectEmotionForWord(w.word);
  if (detected) { activeEmotion = detected; emotionHoldFrames = 90; }
  wordCursor++;
}

// ============================================================
// MOUTH
// ============================================================
let syllables = [];
let currentSyllableIndex = 0;
let syllableTimer = 0;
let framesPerSyllable = 8;
let lastBeepedSyllable = -1;

function updateMouthAnimation() {
  if (currentMood === 'sleeping') {
    targetMouthOpen = 0.05 + Math.abs(Math.sin(time * 0.3)) * 0.02;
    return;
  }

  if (!isSpeaking) {
    targetMouthOpen = 0.02 + Math.abs(Math.sin(time * 0.6)) * 0.04;
    return;
  }
  syllableTimer++;
  const tirednessFactor = 1 + tiredness * 0.8;
  if (syllableTimer >= framesPerSyllable * tirednessFactor) {
    syllableTimer = 0;
    currentSyllableIndex++;
    if (currentSyllableIndex >= syllables.length) currentSyllableIndex = 0;
    if (currentSyllableIndex !== lastBeepedSyllable) {
      lastBeepedSyllable = currentSyllableIndex;
      playSyllableBeep(syllables[currentSyllableIndex] || '');
    }
    const syl = syllables[currentSyllableIndex] || '';
    framesPerSyllable = 6 + Math.random() * 4 + Math.min(4, syl.length);
  }
  const syl = syllables[currentSyllableIndex] || '';
  let openness = 0.4;
  if (syl.includes('a')) openness = 1.0;
  else if (syl.includes('o')) openness = 0.9;
  else if (syl.includes('e')) openness = 0.75;
  else if (syl.includes('u')) openness = 0.6;
  else if (syl.includes('i')) openness = 0.5;
  else openness = 0.25;
  openness += (Math.random() - 0.5) * 0.15;
  openness *= (1 - tiredness * 0.3);
  targetMouthOpen = Math.max(0.05, Math.min(1, openness));
}

// ============================================================
// ANIMATIONS
// ============================================================
function lerp(a, b, t) { return a + (b - a) * t; }

function updateEmotionAnimation() {
  if (emotionHoldFrames > 0) {
    emotionHoldFrames--;
    if (emotionHoldFrames === 0) activeEmotion = 'neutro';
  }

  const params = emotionParams(activeEmotion);
  Object.keys(params).forEach(k => targetEmotion[k] = params[k]);

  if (currentMood === 'sleeping') {
    targetEmotion.eyeOpen = 0;
    targetEmotion.browHeight = 3;
    targetEmotion.mouthCurve = 0;
    targetEmotion.headTilt = 0.03;
  } else if (currentMood === 'offended') {
    targetEmotion.browAngle = -1.0;
    targetEmotion.browHeight = 6;
    targetEmotion.mouthCurve = -0.8;
    targetEmotion.eyeOpen = 0.85;
  } else if (currentMood === 'waking') {
    const wakeProgress = (Date.now() - moodStartTime) / MOOD_CONFIG.wakeDurationMs;
    targetEmotion.eyeOpen = Math.min(1, 0.5 + wakeProgress * 0.5);
  }

  const speed = currentMood === 'offended' ? 0.35 : 0.08;
  Object.keys(currentEmotion).forEach(k => {
    currentEmotion[k] = lerp(currentEmotion[k], targetEmotion[k], speed);
  });
}

function updateBreath() {
  const speedFactor = currentMood === 'sleeping' ? 0.5 : 1;
  breathPhaseA += 0.018 * speedFactor;
  breathPhaseB += 0.037 * speedFactor;
  breathPhaseC += 0.008 * speedFactor;
  const base = Math.sin(breathPhaseA) * 2.5;
  const harmonic = Math.sin(breathPhaseB) * 0.8;
  const drift = Math.sin(breathPhaseC) * 1.2;
  currentBreathOffset = base + harmonic + drift;
  breathCycleTimer++;
  if (breathCycleTimer > breathCycleDuration) {
    breathCycleTimer = 0;
    breathCycleDuration = 180 + Math.random() * 180;
    currentBreathOffset += (Math.random() - 0.5) * 2;
  }
}
function getBreathOffset() { return currentBreathOffset; }

// ============================================================
// BLINK — state machine
// ============================================================
function startBlink(double) {
  blinkPhase = 'closing';
  blinkPhaseTimer = 0;
  blinkCloseDuration = 4 + Math.floor(Math.random() * 3);
  blinkOpenDuration = 4 + Math.floor(Math.random() * 3);
  blinkWantsDouble = !!double;
}

function updateBlink() {
  if (currentMood === 'sleeping') {
    eyeBlink = 0;
    blinkPhase = 'idle';
    return;
  }

  if (forcedBlinkQueue > 0 && blinkPhase === 'idle') {
    startBlink(false);
    forcedBlinkQueue--;
  }

  switch (blinkPhase) {
    case 'idle': {
      blinkNextDelay++;
      if (blinkNextDelay >= blinkPauseMin) {
        blinkNextDelay = 0;
        startBlink(Math.random() < 0.2);
      }
      eyeBlink = lerp(eyeBlink, 0, 0.5);
      break;
    }
    case 'closing': {
      blinkPhaseTimer++;
      eyeBlink = Math.min(1, blinkPhaseTimer / blinkCloseDuration);
      if (blinkPhaseTimer >= blinkCloseDuration) {
        blinkPhase = 'opening';
        blinkPhaseTimer = 0;
      }
      break;
    }
    case 'opening': {
      blinkPhaseTimer++;
      eyeBlink = Math.max(0, 1 - blinkPhaseTimer / blinkOpenDuration);
      if (blinkPhaseTimer >= blinkOpenDuration) {
        if (blinkWantsDouble) {
          blinkWantsDouble = false;
          blinkPhase = 'double-wait';
          blinkPhaseTimer = 0;
        } else {
          blinkPhase = 'idle';
          blinkNextDelay = 0;
          blinkPauseMin = 150 + Math.floor(Math.random() * 200);
        }
      }
      break;
    }
    case 'double-wait': {
      blinkPhaseTimer++;
      eyeBlink = 0;
      if (blinkPhaseTimer >= blinkDoubleGapDuration) {
        startBlink(false);
      }
      break;
    }
  }
}

function updateYawn() {
  if (isSpeaking || currentMood === 'sleeping') { yawnActive = 0; return; }

  let multiplier = 1;
  if (currentMood === 'waking') multiplier = 0.05;
  else if (tiredness > 0.5) multiplier = 0.3;

  yawnTimer += multiplier;
  if (yawnTimer > yawnCooldown && yawnActive === 0) {
    yawnActive = 0.01;
    yawnPhase = 0;
  }
  if (yawnActive > 0) {
    yawnPhase++;
    const totalFrames = 120;
    if (yawnPhase < 40) yawnActive = yawnPhase / 40;
    else if (yawnPhase < 80) yawnActive = 1;
    else if (yawnPhase < totalFrames) yawnActive = 1 - (yawnPhase - 80) / 40;
    else {
      yawnActive = 0;
      yawnTimer = 0;
      yawnCooldown = 800 + Math.random() * 800;
    }
  }
}

function updateMouthTwitch() {
  if (isSpeaking || currentMood === 'sleeping') {
    mouthTwitchActive = lerp(mouthTwitchActive, 0, 0.15);
    mouthTwitchTimer = 0;
    return;
  }
  mouthTwitchTimer++;
  if (mouthTwitchTimer > mouthTwitchNextAt && mouthTwitchActive < 0.01) {
    mouthTwitchActive = 0.01;
    mouthTwitchPhase = 0;
    mouthTwitchDir = Math.random() < 0.5 ? 1 : -1;
  }
  if (mouthTwitchActive > 0) {
    mouthTwitchPhase++;
    const totalFrames = 45 + Math.random() * 20;
    if (mouthTwitchPhase < totalFrames * 0.35) {
      mouthTwitchActive = mouthTwitchPhase / (totalFrames * 0.35);
    } else if (mouthTwitchPhase < totalFrames * 0.65) {
      mouthTwitchActive = 1;
    } else if (mouthTwitchPhase < totalFrames) {
      mouthTwitchActive = 1 - (mouthTwitchPhase - totalFrames * 0.65) / (totalFrames * 0.35);
    } else {
      mouthTwitchActive = 0;
      mouthTwitchTimer = 0;
      mouthTwitchNextAt = 180 + Math.random() * 300;
    }
  }
}

function updateBrowTwitch() {
  if (isSpeaking || currentMood === 'sleeping') {
    browTwitchActive = lerp(browTwitchActive, 0, 0.15);
    browTwitchAmount = lerp(browTwitchAmount, 0, 0.1);
    return;
  }
  browTwitchTimer++;
  if (browTwitchTimer > browTwitchNextAt && browTwitchActive < 0.01) {
    browTwitchActive = 0.01;
    browTwitchPhase = 0;
  }
  if (browTwitchActive > 0) {
    browTwitchPhase++;
    const totalFrames = 40 + Math.random() * 30;
    if (browTwitchPhase < totalFrames * 0.4) {
      browTwitchActive = browTwitchPhase / (totalFrames * 0.4);
    } else if (browTwitchPhase < totalFrames * 0.6) {
      browTwitchActive = 1;
    } else if (browTwitchPhase < totalFrames) {
      browTwitchActive = 1 - (browTwitchPhase - totalFrames * 0.6) / (totalFrames * 0.4);
    } else {
      browTwitchActive = 0;
      browTwitchTimer = 0;
      browTwitchNextAt = 150 + Math.random() * 250;
    }
  }
  const targetAmount = browTwitchActive * (2 + Math.random() * 2);
  browTwitchAmount = lerp(browTwitchAmount, targetAmount, 0.15);
}

function updateHeadDrift() {
  if (isSpeaking) {
    headDriftTarget = 0;
    headDriftCurrent = lerp(headDriftCurrent, 0, 0.08);
    return;
  }
  headDriftTimer++;
  if (headDriftTimer > headDriftNextAt) {
    headDriftTarget = (Math.random() - 0.5) * 0.06;
    headDriftTimer = 0;
    headDriftNextAt = 120 + Math.random() * 200;
  }
  headDriftCurrent = lerp(headDriftCurrent, headDriftTarget, 0.02);
}

function updatePupilDilation() {
  if (currentMood === 'sleeping') return;
  pupilTimer++;
  if (pupilTimer > pupilNextAt) {
    pupilScaleTarget = 0.85 + Math.random() * 0.30;
    pupilTimer = 0;
    pupilNextAt = 120 + Math.random() * 240;
  }
  pupilScale = lerp(pupilScale, pupilScaleTarget, 0.02);
}

function updateWander() {
  if (isSpeaking || currentMood === 'sleeping' || currentMood === 'offended') {
    wanderActive = false;
    return;
  }
  if (mouseIsActive) {
    wanderActive = false;
    return;
  }
  wanderTimer++;
  if (wanderTimer > wanderNextAt) {
    wanderTargetX = (Math.random() - 0.5) * 10;
    wanderTargetY = (Math.random() - 0.5) * 6;
    wanderTimer = 0;
    wanderNextAt = 90 + Math.random() * 180;
    wanderActive = true;
    wanderReturnTimer = 0;
  }
  if (wanderActive) {
    wanderReturnTimer++;
    if (wanderReturnTimer > 120) {
      wanderTargetX = 0;
      wanderTargetY = 0;
      wanderActive = false;
    }
  }
}

function updateSaccades() {
  if (isSpeaking || currentMood === 'sleeping') {
    saccadeX = lerp(saccadeX, 0, 0.2);
    saccadeY = lerp(saccadeY, 0, 0.2);
    return;
  }
  saccadeTimer++;
  if (saccadeTimer > saccadeNextAt) {
    saccadeTargetX = (Math.random() - 0.5) * 2;
    saccadeTargetY = (Math.random() - 0.5) * 1.5;
    saccadeTimer = 0;
    saccadeNextAt = 15 + Math.random() * 25;
  }
  saccadeX = lerp(saccadeX, saccadeTargetX, 0.4);
  saccadeY = lerp(saccadeY, saccadeTargetY, 0.4);
}

function updateReflection() {
  if (isSpeaking || currentMood === 'sleeping' || currentMood === 'offended') {
    reflectionActive = 0;
    reflectionTimer = 0;
    return;
  }
  reflectionTimer++;
  if (reflectionTimer > reflectionNextAt && reflectionActive === 0) {
    reflectionActive = 0.01;
    reflectionPhase = 0;
  }
  if (reflectionActive > 0) {
    reflectionPhase++;
    const totalFrames = reflectionTotalFrames;
    if (reflectionPhase < totalFrames * 0.2) {
      reflectionActive = reflectionPhase / (totalFrames * 0.2);
    } else if (reflectionPhase < totalFrames * 0.7) {
      reflectionActive = 1;
    } else if (reflectionPhase < totalFrames) {
      reflectionActive = 1 - (reflectionPhase - totalFrames * 0.7) / (totalFrames * 0.3);
    } else {
      reflectionActive = 0;
      reflectionTimer = 0;
      reflectionNextAt = 1500 + Math.random() * 1500;
    }
  }
}

document.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  const ccx = rect.left + rect.width / 2;
  const ccy = rect.top + rect.height / 2;
  const dx = e.clientX - ccx, dy = e.clientY - ccy;
  const dist = Math.sqrt(dx*dx + dy*dy);
  const maxOffset = 6;
  if (dist > 0) {
    const factor = Math.min(1, dist / 400);
    eyeTargetX = (dx / dist) * maxOffset * factor;
    eyeTargetY = (dy / dist) * maxOffset * factor;
  }
  mouseIsActive = true;
  mouseMovedTimer = 0;
});

function updateGaze() {
  mouseMovedTimer++;
  if (mouseMovedTimer > 180) mouseIsActive = false;

  if (currentMood === 'sleeping') return;

  if (currentMood === 'waking') {
    const rect = canvas.getBoundingClientRect();
    const ccx = rect.left + rect.width / 2;
    const ccy = rect.top + rect.height / 2;
    const dx = clickTargetX - ccx;
    const dy = clickTargetY - ccy;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (dist > 0) {
      const factor = Math.min(1, dist / 400);
      eyeTargetX = (dx / dist) * 8 * factor;
      eyeTargetY = (dy / dist) * 8 * factor;
    }
  } else if (isSpeaking) {
    eyeTargetX = Math.sin(time * 0.5) * 1.5;
    eyeTargetY = Math.sin(time * 0.7) * 1.0;
  } else if (mouseIsActive) {
    // mouse drives gaze
  } else if (wanderActive) {
    eyeTargetX = wanderTargetX;
    eyeTargetY = wanderTargetY;
  } else {
    eyeTargetX = lerp(eyeTargetX, 0, 0.03);
    eyeTargetY = lerp(eyeTargetY, 0, 0.03);
  }

  const gazeSpeed = currentMood === 'waking' ? 0.04 : 0.08;
  eyeCurrentX = lerp(eyeCurrentX, eyeTargetX, gazeSpeed);
  eyeCurrentY = lerp(eyeCurrentY, eyeTargetY, gazeSpeed);
}

function updateGlitch() {
  glitchTimer++;
  if (glitchIntensity > 0) {
    glitchIntensity -= 0.05;
    if (glitchIntensity < 0) glitchIntensity = 0;
  }
  if (currentMood === 'sleeping') return;

  if (glitchTimer > glitchNextAt) {
    glitchIntensity = 0.6 + Math.random() * 0.4;
    glitchTimer = 0;
    glitchNextAt = 600 + Math.random() * 1200;
  }
}

function updateSleepZs(cx, cy) {
  if (currentMood !== 'sleeping') {
    sleepZs = [];
    return;
  }
  zSpawnTimer++;
  if (zSpawnTimer > 60 + Math.random() * 40) {
    zSpawnTimer = 0;
    sleepZs.push({
      x: cx + 60 + Math.random() * 30,
      y: cy - 100,
      vy: -0.3 - Math.random() * 0.3,
      vx: 0.2 + Math.random() * 0.3,
      size: 0.5 + Math.random() * 0.3,
      alpha: 1,
      rotation: (Math.random() - 0.5) * 0.3
    });
  }
  for (let i = sleepZs.length - 1; i >= 0; i--) {
    const z = sleepZs[i];
    z.y += z.vy;
    z.x += z.vx;
    z.alpha -= 0.006;
    z.size += 0.003;
    if (z.alpha <= 0) sleepZs.splice(i, 1);
  }
}

function drawSleepZs() {
  ctx.save();
  sleepZs.forEach(z => {
    ctx.save();
    ctx.globalAlpha = z.alpha;
    ctx.translate(z.x, z.y);
    ctx.rotate(z.rotation);
    ctx.fillStyle = COLOR_MAIN;
    ctx.shadowBlur = 12;
    ctx.shadowColor = COLOR_GLOW;
    ctx.font = `bold ${Math.round(z.size * 40)}px 'Courier New'`;
    ctx.textAlign = 'center';
    ctx.fillText('Z', 0, 0);
    ctx.restore();
  });
  ctx.restore();
}

// ============================================================
// DRAWING
// ============================================================
function drawAvatar() {
  ctx.clearRect(0, 0, LOGICAL_SIZE, LOGICAL_SIZE);
  time += 0.02;

  updateMoodState();
  updateMouthAnimation();
  updateEmotionAnimation();
  updateBreath();
  updateBlink();
  updateYawn();
  updateMouthTwitch();
  updateBrowTwitch();
  updateHeadDrift();
  updatePupilDilation();
  updateWander();
  updateSaccades();
  updateReflection();
  updateGaze();
  updateGlitch();
  updateWaves();
  mouthOpen += (targetMouthOpen - mouthOpen) * 0.35;

  const cx = 210;
  const cy = 205 + getBreathOffset();
  const isOffended = currentMood === 'offended';
  const faceColor = isOffended ? '#ff8888' : '#00ff9d';
  const faceGlow = isOffended ? 'rgba(255,120,120,0.8)' : 'rgba(0,255,157,0.8)';

  updateSleepZs(cx, cy);

  const intensity = currentMood === 'sleeping' ? 0.045 : (isSpeaking ? 0.16 + mouthOpen * 0.12 : 0.075);
  const halo = ctx.createRadialGradient(cx, cy, 25, cx, cy, 190);
  halo.addColorStop(0, isOffended ? `rgba(255,120,120,${intensity})` : `rgba(0,255,157,${intensity})`);
  halo.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = halo;
  ctx.fillRect(0, 0, LOGICAL_SIZE, LOGICAL_SIZE);

  const particleIntensity = isSpeaking ? Math.min(1, 0.3 + mouthOpen * 0.7) : (currentMood === 'sleeping' ? 0.03 : 0.1);
  particles.forEach(p => { p.update(particleIntensity); p.draw(); });

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(currentEmotion.headTilt + headDriftCurrent);
  ctx.translate(-cx, -cy);
  ctx.translate(0, getBreathOffset());

  ctx.strokeStyle = faceColor;
  ctx.lineWidth = 2.6;
  ctx.shadowBlur = 20;
  ctx.shadowColor = faceGlow;
  ctx.beginPath();
  ctx.moveTo(125, 145);
  ctx.quadraticCurveTo(135, 85, 210, 82);
  ctx.quadraticCurveTo(285, 85, 295, 145);
  ctx.lineTo(287, 242);
  ctx.quadraticCurveTo(278, 296, 210, 310);
  ctx.quadraticCurveTo(142, 296, 133, 242);
  ctx.closePath();
  ctx.stroke();
  ctx.shadowBlur = 0;

  ctx.strokeStyle = isOffended ? 'rgba(255,120,120,0.38)' : 'rgba(0,255,157,0.38)';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(143, 150);
  ctx.quadraticCurveTo(150, 105, 210, 102);
  ctx.quadraticCurveTo(270, 105, 277, 150);
  ctx.stroke();

  ctx.strokeStyle = faceColor;
  ctx.lineWidth = 2;
  ctx.strokeRect(112, 170, 18, 48);
  ctx.strokeRect(290, 170, 18, 48);
  drawCyberLine(115, 181, 125, 181, 0.9, faceColor);
  drawCyberLine(295, 181, 305, 181, 0.9, faceColor);

  drawCyberEyebrow(174, 157, 1, faceColor, faceGlow);
  drawCyberEyebrow(246, 157, -1, faceColor, faceGlow);

  drawCyberEye(174, 183, faceColor, faceGlow);
  drawCyberEye(246, 183, faceColor, faceGlow);

  ctx.strokeStyle = isOffended ? 'rgba(255,120,120,0.7)' : 'rgba(0,255,157,0.58)';
  ctx.lineWidth = 1.7;
  ctx.beginPath();
  ctx.moveTo(210, 191);
  ctx.lineTo(203, 218);
  ctx.lineTo(215, 220);
  ctx.stroke();

  drawCyberMouth(210, 245, faceColor, faceGlow);

  drawCyberLine(149, 264, 166, 279, 0.55, faceColor);
  drawCyberLine(166, 279, 183, 279, 0.55, faceColor);
  drawCyberLine(271, 264, 254, 279, 0.55, faceColor);
  drawCyberLine(254, 279, 237, 279, 0.55, faceColor);
  drawCyberLine(185, 291, 235, 291, 0.7, faceColor);
  drawCyberLine(192, 300, 228, 300, 0.4, faceColor);
  ctx.restore();

  if (glitchIntensity > 0.2 && currentMood !== 'sleeping') {
    ctx.save();
    ctx.globalAlpha = glitchIntensity * 0.28;
    ctx.fillStyle = faceColor;
    for (let i = 0; i < 4; i++) {
      const y = Math.random() * LOGICAL_SIZE;
      ctx.fillRect(0, y, LOGICAL_SIZE, 1 + Math.random() * 3);
    }
    ctx.restore();
  }

  drawSleepZs();

  ctx.save();
  ctx.strokeStyle = isOffended ? 'rgba(255,120,120,0.6)' : 'rgba(0,255,157,0.55)';
  ctx.lineWidth = 2;
  drawCyberLine(25, 48, 25, 25, 0.9, faceColor);
  drawCyberLine(25, 25, 48, 25, 0.9, faceColor);
  drawCyberLine(372, 25, 395, 25, 0.9, faceColor);
  drawCyberLine(395, 25, 395, 48, 0.9, faceColor);
  drawCyberLine(25, 372, 25, 395, 0.9, faceColor);
  drawCyberLine(25, 395, 48, 395, 0.9, faceColor);
  drawCyberLine(372, 395, 395, 395, 0.9, faceColor);
  drawCyberLine(395, 372, 395, 395, 0.9, faceColor);
  ctx.shadowBlur = 8;
  ctx.shadowColor = faceGlow;
  ctx.fillStyle = isOffended ? '#ffaaaa' : 'rgba(0,255,157,0.72)';
  ctx.font = '11px monospace';
  ctx.textAlign = 'left';
  ctx.fillText('CB-01', 39, 45);
  ctx.textAlign = 'right';
  const systemLabel = currentMood === 'sleeping' ? 'SLEEP MODE' : (isSpeaking ? 'VOICE ACTIVE' : 'SYSTEM READY');
  ctx.fillText(systemLabel, 381, 386);
  ctx.restore();
}

function drawCyberLine(x1, y1, x2, y2, alpha = 1, color = COLOR_MAIN) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.8;
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();
  ctx.restore();
}

function drawCyberEyebrow(x, y, side, color, glow) {
  ctx.save();
  const angle = currentEmotion.browAngle * 0.22 * side;
  const offset = currentEmotion.browHeight * 0.45 - browTwitchAmount;
  ctx.strokeStyle = color;
  ctx.lineWidth = 3.2;
  ctx.lineCap = 'round';
  ctx.shadowBlur = 10;
  ctx.shadowColor = glow;
  ctx.beginPath();
  ctx.moveTo(x - 16, y + offset - angle * 15);
  ctx.lineTo(x + 16, y + offset + angle * 15);
  ctx.stroke();
  ctx.restore();
}

function drawCyberEye(x, y, color, glow) {
  ctx.save();
  ctx.shadowBlur = 13;
  ctx.shadowColor = glow;
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineWidth = 2.5;

  const eyeHeight = Math.max(0.12, currentEmotion.eyeOpen) * (1 - Math.min(1, eyeBlink));
  if (currentMood === 'sleeping' || eyeHeight < 0.22) {
    ctx.beginPath();
    ctx.moveTo(x - 16, y);
    ctx.quadraticCurveTo(x, y + 7, x + 16, y);
    ctx.stroke();
    ctx.restore();
    return;
  }

  const halfH = 10.5 * Math.min(1, eyeHeight);
  ctx.beginPath();
  ctx.moveTo(x - 17, y - halfH);
  ctx.lineTo(x + 16, y - halfH);
  ctx.lineTo(x + 11, y + halfH);
  ctx.lineTo(x - 12, y + halfH);
  ctx.closePath();
  ctx.fill();

  const px = x + Math.max(-5, Math.min(5, eyeCurrentX + saccadeX));
  const py = y + Math.max(-3, Math.min(3, eyeCurrentY + saccadeY));
  const pupilW = 7 * pupilScale;
  const pupilH = Math.max(3, 11 * pupilScale * Math.min(1, eyeHeight));
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#062016';
  ctx.fillRect(px - pupilW / 2, py - pupilH / 2, pupilW, pupilH);
  ctx.fillStyle = '#f0fff8';
  ctx.beginPath();
  ctx.arc(px - 1.5, py - 2, 1.8, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawCyberMouth(x, y, color, glow) {
  ctx.save();
  ctx.strokeStyle = color;
  ctx.fillStyle = 'rgba(0,15,9,0.94)';
  ctx.lineWidth = 2.5;
  ctx.shadowBlur = 14;
  ctx.shadowColor = glow;

  const combinedOpen = currentMood === 'sleeping' ? 0 : Math.max(mouthOpen, yawnActive * 0.9);
  const mouthWidth = 56 + (currentEmotion.mouthWidth - 80) * 0.22;
  const openHeight = 42 * combinedOpen;
  const twitchOffsetY = mouthTwitchActive * mouthTwitchDir * 1.5;

  if (openHeight > 5.5) {
    ctx.beginPath();
    ctx.ellipse(x, y + twitchOffsetY, mouthWidth / 2, Math.max(3, openHeight / 2), 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    if (combinedOpen > 0.5) {
      ctx.fillStyle = 'rgba(0,255,157,0.55)';
      ctx.beginPath();
      ctx.ellipse(x, y + twitchOffsetY + openHeight * 0.16, mouthWidth / 3, Math.max(2, openHeight / 4), 0, 0, Math.PI * 2);
      ctx.fill();
    }
  } else {
    const curve = currentEmotion.mouthCurve + reflectionActive * -0.4 + mouthTwitchActive * mouthTwitchDir * 0.7;
    ctx.beginPath();
    ctx.moveTo(x - mouthWidth / 2, y + twitchOffsetY);
    ctx.quadraticCurveTo(x, y + twitchOffsetY + curve * 5, x + mouthWidth / 2, y + twitchOffsetY);
    ctx.stroke();
  }
  ctx.restore();
}

// ============================================================
// LOOP
// ============================================================
function renderLoop() {
  drawAvatar();
  requestAnimationFrame(renderLoop);
}

// ============================================================
// SPEECH SYNTHESIS
// ============================================================
let utterance = null;
let fallbackWordInterval = null;

function updateStatus(text, cls) {
  if (currentMood === 'sleeping' && cls !== 'sleeping') return;
  if (currentMood === 'offended' && cls !== 'offended') return;

  statusEl.innerText = text;
  statusEl.classList.remove('speaking', 'done', 'sleeping', 'offended');
  if (cls) statusEl.classList.add(cls);
}

function speak() {
  if (!('speechSynthesis' in window)) {
    updateStatus('⚠ speech synthesis not supported');
    return;
  }
  if (currentMood === 'sleeping') return;

  window.speechSynthesis.cancel();
  if (fallbackWordInterval) { clearInterval(fallbackWordInterval); fallbackWordInterval = null; }

  initAudioContext();
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

  syllables = getSyllables(TESTO);
  wordsInText = extractWords(TESTO);
  currentSyllableIndex = 0;
  syllableTimer = 0;
  framesPerSyllable = 8;
  wordCursor = 0;
  activeEmotion = 'neutro';
  emotionHoldFrames = 0;
  lastBeepedSyllable = -1;

  utterance = new SpeechSynthesisUtterance(TESTO);
  utterance.lang = 'it-IT';
  utterance.rate = Math.max(0.85, 0.95 - tiredness * 0.15);
  utterance.pitch = 1.1;
  utterance.volume = 1;
  if (selectedVoice) utterance.voice = selectedVoice;

  utterance.onstart = () => {
    isSpeaking = true;
    container.classList.add('speaking');
    updateStatus('■ click to stop', 'speaking');
    playStartBeep();
    startAmbient();
  };

  utterance.onboundary = (e) => {
    if (e.name === 'word') processNextWord();
  };

  utterance.onend = () => {
    isSpeaking = false;
    targetMouthOpen = 0;
    activeEmotion = 'neutro';
    emotionHoldFrames = 0;
    container.classList.remove('speaking');
    updateStatus('✓ done — click to replay', 'done');
    playEndBeep();
    stopAmbient();
    registerInteraction();
    if (fallbackWordInterval) { clearInterval(fallbackWordInterval); fallbackWordInterval = null; }
  };

  utterance.onerror = (e) => {
    console.error(e);
    isSpeaking = false;
    targetMouthOpen = 0;
    activeEmotion = 'neutro';
    emotionHoldFrames = 0;
    container.classList.remove('speaking');
    updateStatus('✗ error — click to retry', 'done');
    stopAmbient();
    if (fallbackWordInterval) { clearInterval(fallbackWordInterval); fallbackWordInterval = null; }
  };

  fallbackWordInterval = setInterval(() => {
    if (!isSpeaking) { clearInterval(fallbackWordInterval); fallbackWordInterval = null; return; }
    processNextWord();
  }, 350);

  speechSynthesis.speak(utterance);
}

function stopSpeaking() {
  speechSynthesis.cancel();
  if (fallbackWordInterval) { clearInterval(fallbackWordInterval); fallbackWordInterval = null; }
  isSpeaking = false;
  targetMouthOpen = 0;
  activeEmotion = 'neutro';
  emotionHoldFrames = 0;
  container.classList.remove('speaking');
  stopAmbient();
}

// ============================================================
// INTERACTION
// ============================================================
function handleInteraction(clickX, clickY) {
  registerInteraction();

  if (currentMood === 'sleeping') {
    wakeUp(clickX, clickY);
    playWakeUpSound();
    return;
  }

  if (currentMood === 'waking') return;

  if (currentMood === 'offended') {
    becomeAwake();
    return;
  }

  if (isSpeaking) {
    stopSpeaking();
    getOffended();
    playOffendedSound();
    updateStatus('😠 don\'t interrupt me!', 'offended');
    return;
  }

  speak();
}

function toggleSpeech(e) {
  let clickX = window.innerWidth / 2;
  let clickY = window.innerHeight / 2;
  if (e && typeof e.clientX === 'number') {
    clickX = e.clientX;
    clickY = e.clientY;
  }
  handleInteraction(clickX, clickY);
}

document.body.addEventListener('click', toggleSpeech);
document.body.addEventListener('touchstart', function(e) {
  e.preventDefault();
  const touch = e.touches[0];
  toggleSpeech({ clientX: touch.clientX, clientY: touch.clientY });
}, { passive: false });

document.addEventListener('keydown', (e) => {
  if (e.key === ' ' || e.key === 'Enter') {
    e.preventDefault();
    toggleSpeech();
  } else if (e.key === 'Escape') {
    if (isSpeaking) {
      stopSpeaking();
      registerInteraction();
      updateStatus('■ stopped');
    }
  }
});

// ============================================================
// STARTUP
// ============================================================
loadState();
updateMoodUI();
renderLoop();
saveState();
setInterval(saveState, 30000);
</script>
