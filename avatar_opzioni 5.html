function load(n){if(loaded.has(n))return Promise.resolve();return new Promise(r=>{const f=document.getElementById('f-'+n);f.onload=()=>{loaded.add(n);r()};f.srcdoc=dec(embedded[n])})}
async function activate(n){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===n));document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.id==='p-'+n));document.getElementById('landing').hidden=(n==='source'||!!avatarText);document.getElementById('sharedBar').style.display=(n==='source'||!avatarText)?'none':'flex';await load(n);if(n!=='source'&&avatarText){const w=document.getElementById('f-'+n).contentWindow;await w.loadSharedAvatar(avatarName,avatarText)}}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>activate(b.dataset.tab));
async function handleAvatarFile(file){if(!file)return;avatarName=file.name;avatarText=await file.text();await Promise.all(['schedule','audio'].map(async n=>{await load(n);await document.getElementById('f-'+n).contentWindow.loadSharedAvatar(avatarName,avatarText)}));document.getElementById('status').textContent='📄 '+avatarName+' caricato in entrambe le schede';document.getElementById('saveAll').disabled=false;document.getElementById('landing').hidden=true;document.getElementById('sharedBar').classList.remove('before-load');document.getElementById('sharedBar').style.display='flex'}
document.getElementById('avatarFile').onchange=async e=>{await handleAvatarFile(e.target.files[0]);e.target.value=''};
document.getElementById('landingFile').onchange=async e=>{await handleAvatarFile(e.target.files[0]);e.target.value=''}
document.getElementById('saveAll').onclick=()=>{try{const aw=document.getElementById('f-audio').contentWindow,sw=document.getElementById('f-schedule').contentWindow;let out=aw.buildNewHtml(avatarText);out=sw.buildNewHtml(out);const blob=new Blob([out],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='index.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),5000)}catch(e){alert('Errore: '+e.message)}};
activate('schedule');</script></body></html>
