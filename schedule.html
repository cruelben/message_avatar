<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schedule Editor — Avatar</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    background-color: #000d06;
    color: #00ff88;
    font-family: 'Courier New', Courier, monospace;
    background-image:
      radial-gradient(circle at 50% 0%, rgba(0,255,136,0.08) 0%, transparent 60%),
      linear-gradient(rgba(0,255,136,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,255,136,0.04) 1px, transparent 1px);
    background-size: 100% 100%, 30px 30px, 30px 30px;
    padding: 24px 16px 60px;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  header {
    text-align: center;
    margin-bottom: 28px;
  }
  h1 {
    font-size: clamp(18px, 3vw, 26px);
    letter-spacing: 4px;
    text-shadow: 0 0 14px rgba(0,255,136,0.7);
    margin-bottom: 6px;
  }
  .sub {
    color: #00cc66;
    font-size: 12px;
    letter-spacing: 2px;
    opacity: 0.75;
  }

  main {
    max-width: 900px;
    margin: 0 auto;
  }

  /* Loader */
  .loader {
    border: 1px solid rgba(0,255,157,0.3);
    border-radius: 12px;
    padding: 40px 24px;
    text-align: center;
    background: rgba(0,255,157,0.03);
    box-shadow: 0 0 30px rgba(0,255,157,0.06), inset 0 0 40px rgba(0,255,157,0.03);
  }
  .loader p { margin-bottom: 16px; font-size: 14px; letter-spacing: 1px; }
  .loader .hint {
    font-size: 11px;
    opacity: 0.6;
    margin-top: 18px;
    letter-spacing: 1px;
  }
  .loader code {
    background: rgba(0,255,136,0.1);
    padding: 2px 6px;
    border-radius: 4px;
    color: #00ffaa;
  }

  .file-btn {
    display: inline-block;
    padding: 12px 28px;
    border: 1px solid #00ff88;
    border-radius: 8px;
    color: #00ff88;
    background: rgba(0,255,136,0.08);
    cursor: pointer;
    font-family: inherit;
    font-size: 14px;
    letter-spacing: 2px;
    transition: all 0.2s;
    text-transform: uppercase;
  }
  .file-btn:hover {
    background: rgba(0,255,136,0.18);
    box-shadow: 0 0 20px rgba(0,255,136,0.3);
  }

  /* Editor */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
    padding: 12px 16px;
    border: 1px solid rgba(0,255,157,0.2);
    border-radius: 10px;
    background: rgba(0,255,157,0.03);
    flex-wrap: wrap;
  }
  .toolbar .filename {
    flex: 1;
    font-size: 12px;
    letter-spacing: 1px;
    opacity: 0.85;
    min-width: 140px;
  }

  button {
    font-family: inherit;
    background: transparent;
    color: #00ff88;
    border: 1px solid rgba(0,255,136,0.45);
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    transition: all 0.15s;
  }
  button:hover {
    background: rgba(0,255,136,0.12);
    border-color: #00ff88;
    box-shadow: 0 0 12px rgba(0,255,136,0.3);
  }
  button:active { transform: scale(0.97); }

  /* Event cards */
  .event-card {
    border: 1px solid rgba(0,255,157,0.22);
    border-radius: 10px;
    background: rgba(0,255,157,0.03);
    padding: 14px 16px;
    margin-bottom: 12px;
    transition: all 0.25s;
    box-shadow: 0 0 18px rgba(0,255,157,0.04);
  }
  .event-card.inactive {
    opacity: 0.4;
    border-color: rgba(0,255,157,0.1);
    background: rgba(0,255,157,0.01);
  }
  .event-card.inactive::before {
    content: "DISATTIVATO";
    position: absolute;
    font-size: 9px;
    letter-spacing: 3px;
    color: #ff8844;
    padding: 2px 6px;
    border: 1px solid #ff8844;
    border-radius: 3px;
    background: rgba(255,136,68,0.1);
    margin-top: -22px;
    margin-left: 0;
  }

  .row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }
  .row.top { margin-bottom: 10px; }

  input[type="time"],
  input[type="text"],
  select,
  textarea {
    font-family: inherit;
    background: rgba(0,0,0,0.4);
    color: #00ff88;
    border: 1px solid rgba(0,255,157,0.3);
    border-radius: 6px;
    padding: 7px 10px;
    font-size: 13px;
    outline: none;
    transition: all 0.15s;
  }
  input[type="time"]:focus,
  input[type="text"]:focus,
  select:focus,
  textarea:focus {
    border-color: #00ff88;
    box-shadow: 0 0 10px rgba(0,255,136,0.35);
  }
  input[type="time"] {
    width: 100px;
    font-weight: bold;
    letter-spacing: 1px;
    cursor: pointer;
  }
  input[type="time"]::-webkit-calendar-picker-indicator {
    filter: invert(0.9) sepia(1) hue-rotate(80deg) saturate(4);
    cursor: pointer;
  }
  select {
    cursor: pointer;
    padding-right: 26px;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M0 0l5 6 5-6z' fill='%2300ff88'/></svg>");
    background-repeat: no-repeat;
    background-position: right 8px center;
    appearance: none;
    -webkit-appearance: none;
  }
  textarea {
    width: 100%;
    resize: vertical;
    line-height: 1.5;
    min-height: 70px;
  }
  input[type="text"].text-input {
    width: 100%;
    font-size: 14px;
  }

  .toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    font-size: 11px;
    letter-spacing: 1.5px;
    user-select: none;
    padding: 6px 10px;
    border: 1px solid rgba(0,255,157,0.25);
    border-radius: 6px;
    margin-left: auto;
  }
  .toggle input { accent-color: #00ff88; cursor: pointer; }
  .toggle:hover { border-color: rgba(0,255,157,0.5); }

  .delete-btn {
    border-color: rgba(255,80,80,0.5);
    color: #ff8888;
    padding: 7px 10px;
  }
  .delete-btn:hover {
    background: rgba(255,80,80,0.15);
    border-color: #ff5555;
    box-shadow: 0 0 12px rgba(255,80,80,0.3);
  }

  .hint {
    font-size: 10px;
    opacity: 0.5;
    letter-spacing: 1px;
    margin-top: 6px;
  }

  .empty {
    text-align: center;
    padding: 30px;
    opacity: 0.5;
    letter-spacing: 2px;
    font-size: 12px;
  }

  /* Output section */
  .output {
    margin-top: 30px;
    padding: 20px;
    border: 1px solid rgba(0,255,157,0.3);
    border-radius: 10px;
    background: rgba(0,255,157,0.05);
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
  }
  .output label {
    font-size: 12px;
    letter-spacing: 2px;
    color: #00cc66;
  }
  .output input[type="text"] {
    flex: 1;
    min-width: 180px;
    font-size: 13px;
  }
  #generateBtn {
    background: rgba(0,255,136,0.15);
    border-color: #00ff88;
    padding: 10px 22px;
    font-size: 13px;
  }
  #generateBtn:hover {
    background: rgba(0,255,136,0.28);
    box-shadow: 0 0 22px rgba(0,255,136,0.5);
  }

  /* Flash message */
  .flash {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: rgba(0,30,15,0.95);
    color: #00ff88;
    padding: 12px 28px;
    border: 1px solid #00ff88;
    border-radius: 8px;
    font-size: 13px;
    letter-spacing: 2px;
    box-shadow: 0 0 30px rgba(0,255,136,0.4);
    opacity: 0;
    transition: all 0.3s;
    pointer-events: none;
    z-index: 9999;
  }
  .flash.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  [hidden] { display: none !important; }

  @media (max-width: 600px) {
    .row.top { gap: 6px; }
    input[type="time"] { width: 90px; }
    .toggle { margin-left: 0; }
  }
</style>
</head>
<body>
<header>
  <h1>◈ SCHEDULE EDITOR ◈</h1>
  <p class="sub">MESSAGGI PROGRAMMATI — DESK AVATAR</p>
</header>

<main>
  <!-- Loader -->
  <section class="loader" id="loader">
    <p>Carica un file avatar HTML per iniziare</p>
    <label class="file-btn">
      <input type="file" accept=".html,.htm" id="fileInput" hidden>
      📁 SCEGLI FILE
    </label>
    <p class="hint">Il file deve contenere <code>const SCHEDULED_EVENTS = [...]</code></p>
  </section>

  <!-- Editor -->
  <section id="editor" hidden>
    <div class="toolbar">
      <span class="filename" id="loadedName">—</span>
      <button id="reloadBtn">↻ Ricarica</button>
      <button id="addBtn">+ Nuovo evento</button>
    </div>

    <div id="eventsList"></div>

    <div class="output">
      <label for="filenameInput">SALVA COME:</label>
      <input type="text" id="filenameInput" value="index02.html">
      <button id="generateBtn">💾 GENERA FILE</button>
    </div>
  </section>
</main>

<script>
// ============================================================
// STATE
// ============================================================
let currentHtml = '';
let currentFilename = '';
let events = [];

// ============================================================
// DOM
// ============================================================
const fileInput = document.getElementById('fileInput');
const loader = document.getElementById('loader');
const editor = document.getElementById('editor');
const eventsList = document.getElementById('eventsList');
const loadedName = document.getElementById('loadedName');
const filenameInput = document.getElementById('filenameInput');
const addBtn = document.getElementById('addBtn');
const generateBtn = document.getElementById('generateBtn');
const reloadBtn = document.getElementById('reloadBtn');

// ============================================================
// FILE LOADING
// ============================================================
fileInput.addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const text = await file.text();
    const parsed = parseEventsFromHtml(text);
    if (!parsed) {
      alert("Non ho trovato 'const SCHEDULED_EVENTS = [...]' nel file.\n" +
            "Assicurati che sia un avatar HTML valido.");
      return;
    }
    currentHtml = text;
    currentFilename = file.name;
    events = parsed;
    loadedName.textContent = '📄 ' + file.name;
    suggestFilename();
    renderEvents();
    loader.hidden = true;
    editor.hidden = false;
  } catch (err) {
    alert('Errore di lettura: ' + err.message);
  }
  fileInput.value = ''; // allow reloading the same file
});

reloadBtn.addEventListener('click', () => fileInput.click());

// ============================================================
// PARSER — find SCHEDULED_EVENTS array (bracket matching)
// ============================================================
function findArrayBounds(html) {
  const marker = 'SCHEDULED_EVENTS';
  const idx = html.indexOf(marker);
  if (idx === -1) return null;

  const openBracket = html.indexOf('[', idx);
  if (openBracket === -1) return null;

  let depth = 0;
  let inString = false, stringChar = '';
  let inLineComment = false, inBlockComment = false;

  for (let i = openBracket; i < html.length; i++) {
    const c = html[i];
    const next = html[i + 1];

    if (inLineComment) { if (c === '\n') inLineComment = false; continue; }
    if (inBlockComment) { if (c === '*' && next === '/') { inBlockComment = false; i++; } continue; }
    if (inString) {
      if (c === '\\') { i++; continue; }
      if (c === stringChar) inString = false;
      continue;
    }
    if (c === '/' && next === '/') { inLineComment = true; i++; continue; }
    if (c === '/' && next === '*') { inBlockComment = true; i++; continue; }
    if (c === '"' || c === "'" || c === '`') { inString = true; stringChar = c; continue; }

    if (c === '[') depth++;
    else if (c === ']') {
      depth--;
      if (depth === 0) return { open: openBracket, close: i };
    }
  }
  return null;
}

function parseEventsFromHtml(html) {
  const bounds = findArrayBounds(html);
  if (!bounds) return null;
  const arrStr = html.slice(bounds.open, bounds.close + 1);
  try {
    const fn = new Function('return ' + arrStr);
    const arr = fn();
    return Array.isArray(arr) ? arr : null;
  } catch (err) {
    console.error(err);
    return null;
  }
}

// ============================================================
// FILENAME SUGGESTION
// ============================================================
function suggestFilename() {
  const m = currentFilename.match(/^index(\d+)\.html?$/i);
  if (m) {
    const num = parseInt(m[1], 10);
    filenameInput.value = 'index' + String(num + 1).padStart(2, '0') + '.html';
  } else if (/^index\.html?$/i.test(currentFilename)) {
    filenameInput.value = 'index02.html';
  } else {
    filenameInput.value = 'index02.html';
  }
}

// ============================================================
// RENDER
// ============================================================
function escapeAttr(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/"/g, '&quot;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

function renderEvents() {
  eventsList.innerHTML = '';

  if (events.length === 0) {
    eventsList.innerHTML = '<p class="empty">NESSUN EVENTO — AGGIUNGINE UNO</p>';
    return;
  }

  events.forEach((ev, i) => {
    const card = document.createElement('div');
    card.className = 'event-card' + (ev.active === false ? ' inactive' : '');

    const hh = String(ev.h ?? 0).padStart(2, '0');
    const mm = String(ev.m ?? 0).padStart(2, '0');
    const isSeq = Array.isArray(ev.sequence);
    const vol = ev.volume === 'low' ? 'low' : 'normal';

    const seqText = isSeq ? ev.sequence.join('\n') : '';
    const textVal = !isSeq ? (ev.text || '') : '';

    card.innerHTML = `
      <div class="row top">
        <input type="time" class="time-input" data-idx="${i}" value="${hh}:${mm}">
        <select class="type-input" data-idx="${i}">
          <option value="text"${!isSeq ? ' selected' : ''}>Frase singola</option>
          <option value="sequence"${isSeq ? ' selected' : ''}>Sequenza</option>
        </select>
        <select class="volume-input" data-idx="${i}">
          <option value="normal"${vol === 'normal' ? ' selected' : ''}>Voce normale</option>
          <option value="low"${vol === 'low' ? ' selected' : ''}>Sottovoce</option>
        </select>
        <label class="toggle">
          <input type="checkbox" class="active-input" data-idx="${i}"${ev.active !== false ? ' checked' : ''}>
          <span>ATTIVO</span>
        </label>
        <button class="delete-btn" data-idx="${i}" title="Elimina">🗑</button>
      </div>
      <div class="content">
        ${isSeq
          ? `<textarea class="seq-input" data-idx="${i}" rows="${Math.max(3, ev.sequence.length)}">${escapeAttr(seqText)}</textarea>
             <p class="hint">Una riga = una frase. Riga vuota = pausa breve.</p>`
          : `<input type="text" class="text-input" data-idx="${i}" value="${escapeAttr(textVal)}" placeholder="Testo della frase...">
             <p class="hint">Frase unica detta in una volta.</p>`
        }
      </div>
    `;

    eventsList.appendChild(card);
  });

  attachListeners();
}

function attachListeners() {
  eventsList.querySelectorAll('.time-input').forEach(el => {
    el.addEventListener('change', e => {
      const [h, m] = e.target.value.split(':').map(Number);
      const idx = parseInt(e.target.dataset.idx, 10);
      events[idx].h = h;
      events[idx].m = m;
    });
  });

  eventsList.querySelectorAll('.type-input').forEach(el => {
    el.addEventListener('change', e => {
      const idx = parseInt(e.target.dataset.idx, 10);
      const ev = events[idx];
      if (e.target.value === 'sequence') {
        if (!Array.isArray(ev.sequence)) {
          ev.sequence = ev.text ? [ev.text] : [''];
          delete ev.text;
        }
      } else {
        if (Array.isArray(ev.sequence)) {
          ev.text = ev.sequence.find(s => s && s.trim()) || '';
          delete ev.sequence;
        }
      }
      renderEvents();
    });
  });

  eventsList.querySelectorAll('.volume-input').forEach(el => {
    el.addEventListener('change', e => {
      const idx = parseInt(e.target.dataset.idx, 10);
      events[idx].volume = e.target.value;
    });
  });

  eventsList.querySelectorAll('.active-input').forEach(el => {
    el.addEventListener('change', e => {
      const idx = parseInt(e.target.dataset.idx, 10);
      events[idx].active = e.target.checked;
      e.target.closest('.event-card').classList.toggle('inactive', !e.target.checked);
    });
  });

  eventsList.querySelectorAll('.delete-btn').forEach(el => {
    el.addEventListener('click', e => {
      const idx = parseInt(e.target.dataset.idx, 10);
      const card = e.target.closest('.event-card');
      if (confirm('Eliminare questo evento?')) {
        card.style.transition = 'all 0.2s';
        card.style.opacity = '0';
        card.style.transform = 'translateX(-20px)';
        setTimeout(() => {
          events.splice(idx, 1);
          renderEvents();
        }, 180);
      }
    });
  });

  eventsList.querySelectorAll('.text-input').forEach(el => {
    el.addEventListener('input', e => {
      const idx = parseInt(e.target.dataset.idx, 10);
      events[idx].text = e.target.value;
    });
  });

  eventsList.querySelectorAll('.seq-input').forEach(el => {
    el.addEventListener('input', e => {
      const idx = parseInt(e.target.dataset.idx, 10);
      events[idx].sequence = e.target.value.split('\n');
    });
  });
}

// ============================================================
// ADD EVENT
// ============================================================
addBtn.addEventListener('click', () => {
  const now = new Date();
  let h = now.getHours();
  let m = now.getMinutes() + 5;
  if (m >= 60) { m -= 60; h = (h + 1) % 24; }

  events.push({
    h, m,
    text: 'nuovo messaggio'
  });
  renderEvents();

  const last = eventsList.lastElementChild;
  if (last) {
    last.scrollIntoView({ behavior: 'smooth', block: 'center' });
    const input = last.querySelector('.text-input');
    if (input) { input.focus(); input.select(); }
  }
});

// ============================================================
// SERIALIZE
// ============================================================
function serializeEvents() {
  if (events.length === 0) return '[]';
  let out = '[\n';
  events.forEach(ev => {
    out += '  {\n';
    out += `    h: ${ev.h}, m: ${ev.m},\n`;
    if (ev.active === false) out += `    active: false,\n`;
    if (ev.volume === 'low') out += `    volume: 'low',\n`;
    if (Array.isArray(ev.sequence)) {
      out += `    sequence: [\n`;
      ev.sequence.forEach(line => {
        out += `      ${JSON.stringify(line)},\n`;
      });
      out += `    ]\n`;
    } else {
      out += `    text: ${JSON.stringify(ev.text || '')}\n`;
    }
    out += '  },\n';
  });
  out += ']';
  return out;
}

// ============================================================
// GENERATE FILE
// ============================================================
function buildNewHtml() {
  const bounds = findArrayBounds(currentHtml);
  if (!bounds) throw new Error('SCHEDULED_EVENTS non trovato nel file corrente');
  const before = currentHtml.slice(0, bounds.open);
  const after = currentHtml.slice(bounds.close + 1);
  return before + serializeEvents() + after;
}

generateBtn.addEventListener('click', async () => {
  try {
    const newHtml = buildNewHtml();
    const filename = (filenameInput.value.trim() || 'index02.html');

    // Try modern save picker (Chromium) — allows saving to same folder
    if (window.showSaveFilePicker) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: filename,
          types: [{ description: 'HTML', accept: { 'text/html': ['.html'] } }]
        });
        const writable = await handle.createWritable();
        await writable.write(newHtml);
        await writable.close();
        flash('✅ FILE SALVATO');
        return;
      } catch (err) {
        if (err.name === 'AbortError') return;
        console.warn('showSaveFilePicker failed, falling back', err);
      }
    }

    // Fallback: download
    const blob = new Blob([newHtml], { type: 'text/html;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    flash('✅ FILE SCARICATO');
  } catch (err) {
    alert('Errore: ' + err.message);
  }
});

// ============================================================
// FLASH
// ============================================================
function flash(msg) {
  const el = document.createElement('div');
  el.className = 'flash';
  el.textContent = msg;
  document.body.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => {
    el.classList.remove('show');
    setTimeout(() => el.remove(), 350);
  }, 2000);
}
</script>
</body>
</html>
